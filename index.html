<body>
<title>神操</title>

<style>
/* Layout: single reading column (~36em) inside an app shell — top bar, scrolling page, bottom tab bar. Vertical-set hero title. */
:root{
  --bg:#F4ECE1; --surface:#FBF6EF; --sunk:#EBDFCF; --ink:#2B1E15; --muted:#6E5A4A; --line:#E0D0BC;
  --accent:#A35E17; --accent-soft:#F1DDBF; --wine:#8E2E23; --ok:#4E6B2E;
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai",serif;
  --f-body:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --fs:1.0625rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18110C; --surface:#221912; --sunk:#2C2118; --ink:#F1E6D8; --muted:#B49F8A; --line:#3A2C21;
  --accent:#E3A55A; --accent-soft:#3A2A18; --wine:#EC9A86; --ok:#A9C47E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18110C; --surface:#221912; --sunk:#2C2118; --ink:#F1E6D8; --muted:#B49F8A; --line:#3A2C21;
  --accent:#E3A55A; --accent-soft:#3A2A18; --wine:#EC9A86; --ok:#A9C47E; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.shell{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:44rem;margin:0 auto;padding:.6rem 16px;display:flex;align-items:center;gap:.5rem;min-height:3.2rem}
.top h1{font-family:var(--f-display);font-weight:400;font-size:1.2rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:none;border:1px solid transparent;border-radius:999px;width:2.4rem;height:2.4rem;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{border-color:var(--line);color:var(--ink)}
.icon-btn svg{width:1.2rem;height:1.2rem}
main{flex:1;width:100%;max-width:44rem;margin:0 auto;padding-inline:16px;padding-block:1.25rem 6.5rem}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:44rem;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;padding:.55rem 0 .6rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.75rem;color:var(--muted);letter-spacing:.08em}
.tab svg{width:1.35rem;height:1.35rem}
.tab[aria-current="page"]{color:var(--accent)}

/* Home */
.hero{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:stretch;padding-block:.5rem 1.5rem;border-bottom:1px solid var(--line);margin-bottom:1.5rem}
.hero-v{writing-mode:vertical-rl;font-family:var(--f-display);font-size:clamp(4.2rem,17vw,6.5rem);line-height:1;letter-spacing:.12em;margin:0;color:var(--ink);position:relative}
.hero-r{display:flex;flex-direction:row-reverse;gap:.5rem;align-items:flex-start}
.hero-sub{writing-mode:vertical-rl;font-family:var(--f-body);font-size:.8rem;letter-spacing:.45em;color:var(--accent);padding-top:.4rem}
.hero-l{display:flex;flex-direction:column;justify-content:space-between;gap:1.25rem;min-width:0}
.eyebrow{font-size:.72rem;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.hero-l p.lead{font-family:var(--f-body);font-size:1.05rem;line-height:1.85;margin:.4rem 0 0;max-width:22em}
.amdg{font-family:var(--f-body);font-style:italic;color:var(--muted);font-size:.85rem}
.continue{display:block;width:100%;text-align:left;background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:1rem 1.1rem}
.continue .eyebrow{opacity:.75;color:var(--bg)}
@supports (color:color-mix(in srgb,red,blue)){.continue .eyebrow{opacity:1;color:color-mix(in srgb,var(--bg) 70%,transparent)}}
.continue strong{display:block;font-family:var(--f-display);font-weight:400;font-size:1.45rem;margin:.15rem 0 .5rem}
.meter{height:4px;background:rgba(128,128,128,.35);background:color-mix(in srgb,var(--bg) 25%,transparent);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.continue small{display:block;margin-top:.45rem;font-size:.78rem;opacity:.75;font-variant-numeric:tabular-nums}

.sec-title{font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin:2rem 0 .75rem;display:flex;align-items:baseline;gap:.6rem}
.sec-title .eyebrow{font-family:var(--f-ui)}
.guide-links{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media (max-width:30rem){.guide-links{grid-template-columns:1fr}}
.glink{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem;display:flex;flex-direction:column;gap:.3rem}
.glink b{font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.glink span{color:var(--muted);font-size:.85rem}
.glink:hover{border-color:var(--accent)}

/* Course list */
.set{margin-bottom:2rem}
.set-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.5rem}
.set-head h2{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:0}
.set-head span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.lessons{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.lessons li{border-bottom:1px solid var(--line)}
.lesson-btn{width:100%;background:none;border:0;text-align:left;display:grid;grid-template-columns:2.4rem 1fr auto;align-items:center;gap:.75rem;padding:.85rem .25rem}
.lesson-btn:hover{background:var(--sunk)}
.num{font-family:var(--f-ui);font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.lt{font-family:var(--f-body);font-size:1.05rem;min-width:0}
.lt small{display:block;font-family:var(--f-ui);font-size:.75rem;color:var(--muted);letter-spacing:.06em}
.state{width:1.35rem;height:1.35rem;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.state.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.state.done svg{width:.8rem;height:.8rem}
.state.next{border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 10px var(--accent)}
.soon{border:1.5px dashed var(--line);border-radius:14px;padding:1.25rem;color:var(--muted)}
.soon h2{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:0 0 .25rem;color:var(--ink)}
.soon p{margin:0;font-size:.9rem}

/* Reading */
.prose{font-family:var(--f-body);font-size:var(--fs);line-height:1.95;max-width:36em}
.prose p{margin:0 0 1.05em;text-align:justify;text-justify:inter-character}
.prose h2{font-family:var(--f-display);font-weight:400;font-size:1.7em;line-height:1.3;margin:0 0 .8em;text-wrap:balance}
.prose h3{font-family:var(--f-display);font-weight:400;font-size:1.25em;line-height:1.4;margin:1.6em 0 .6em;color:var(--accent);text-wrap:balance}
.prose strong{font-weight:600}
.prose ul,.prose ol{padding-left:1.4em;margin:0 0 1.05em}
.prose blockquote{margin:1em 0;padding-left:1em;border-left:2px solid var(--accent);color:var(--muted)}
.prose sup.fn a{font-family:var(--f-ui);font-size:.7em;text-decoration:none;padding:0 .15em;color:var(--accent)}
.prose table{border-collapse:collapse;width:100%;font-size:.92em}
.prose td,.prose th{border:1px solid var(--line);padding:.5rem .6rem;vertical-align:top;text-align:left}
.tbl{overflow-x:auto;margin:1.25em 0}

.lesson-head{padding-block:.25rem 1.25rem}
.lesson-head .eyebrow{display:block;margin-bottom:.35rem}
.lesson-head h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.2;margin:0;text-wrap:balance}

.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 3.25rem);z-index:10;background:var(--bg);margin-inline:-16px;padding:.5rem 16px;display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.steps::-webkit-scrollbar{display:none}
.step{flex:none;background:none;border:1px solid var(--line);border-radius:999px;padding:.3rem .8rem;font-size:.8rem;color:var(--muted);white-space:nowrap}
.step.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.part{padding-block:1.75rem .5rem;scroll-margin-top:7.5rem}
.part-label{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem}
.part-label b{font-family:var(--f-display);font-weight:400;font-size:1.35rem;color:var(--wine)}
.part-label span{font-size:.72rem;letter-spacing:.18em;color:var(--muted)}
.part-label::after{content:"";flex:1;height:1px;background:var(--line)}

.veni{display:grid;grid-template-columns:1fr 1fr;gap:.35rem 1.25rem;font-size:calc(var(--fs)*.95);line-height:1.75}
.veni .la{font-style:italic;color:var(--muted);font-family:var(--f-body)}
.veni .zh{font-family:var(--f-body)}
@media (max-width:30rem){.veni{grid-template-columns:1fr;gap:0}.veni .la{font-size:.85em}.veni .zh{margin-bottom:.6rem}}

.timer{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.85rem 1rem;margin:0 0 1.5rem}
.timer .clock{font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-size:1.7rem;font-weight:500;letter-spacing:.04em;min-width:5ch}
.timer .tl{flex:1;min-width:10rem;font-size:.85rem;color:var(--muted);line-height:1.45}
.timer .btns{display:flex;gap:.4rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.45rem 1rem;font-size:.88rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:hover{border-color:var(--accent)}
.durs{display:flex;gap:.3rem}
.dur{border:1px solid var(--line);background:none;border-radius:8px;padding:.15rem .5rem;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dur.on{border-color:var(--accent);color:var(--accent)}

.review{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.1rem}
.review ol{margin:0 0 1rem;padding-left:1.3rem;font-family:var(--f-body);line-height:1.8;color:var(--muted)}
.review label{font-size:.8rem;letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:.35rem}
textarea{width:100%;min-height:9rem;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:.75rem;font-family:var(--f-body);font-size:1rem;line-height:1.8}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.8rem}
.saved{font-size:.78rem;color:var(--muted)}
.done-banner{display:flex;align-items:center;gap:.5rem;color:var(--ok);font-size:.9rem}

.notes{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.notes h4{font-size:.72rem;letter-spacing:.2em;margin:0 0 .6rem;font-weight:500}
.notes ol{margin:0;padding-left:1.6rem;line-height:1.7}
.notes li{scroll-margin-top:8rem}
.notes li:target,.notes li.flash{color:var(--ink)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:2rem}
.pager button{text-align:left;background:none;border:1px solid var(--line);border-radius:12px;padding:.75rem .9rem;min-width:0}
.pager button:last-child{text-align:right}
.pager small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.1em}
.pager b{font-family:var(--f-display);font-weight:400;font-size:1.05rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager button:disabled{visibility:hidden}

/* How-to steps */
.method{list-style:none;padding:0;margin:1.25em 0 1.5em;counter-reset:m}
.method>li{position:relative;padding:0 0 1.1rem 2.6rem;counter-increment:m}
.method>li::before{content:counter(m);position:absolute;left:0;top:.15rem;width:1.8rem;height:1.8rem;border-radius:50%;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--f-ui);font-size:.8rem}
.method>li:not(:last-child)::after{content:"";position:absolute;left:.9rem;top:2.1rem;bottom:.2rem;width:1px;background:var(--line)}
.method h4{font-family:var(--f-display);font-weight:400;font-size:1.15em;margin:0 0 .3em}
.method ul{margin:.3em 0 0;padding-left:1.1em}
.method li li{margin-bottom:.45em}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:1em 0 1.5em;font-family:var(--f-body)}
@media (max-width:30rem){.choice{grid-template-columns:1fr}}
.choice div{border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;background:var(--surface);font-size:.95em;line-height:1.75}
.choice b{font-family:var(--f-display);font-weight:400;font-size:1.2em;display:block;color:var(--accent)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:1.5em 0}
@media (max-width:30rem){.trio{grid-template-columns:1fr}}
.trio div{border-top:2px solid var(--accent);padding-top:.6rem;font-size:.92em;line-height:1.7}
.trio b{display:block;font-family:var(--f-ui);font-size:.72rem;letter-spacing:.2em;color:var(--muted);margin-bottom:.2rem}
.toc-q{list-style:none;padding:0;margin:0 0 1.5em;display:flex;flex-direction:column;gap:.4rem}
.toc-q button{background:none;border:0;padding:0;color:var(--accent);font-family:var(--f-body);font-size:1em;text-align:left;text-decoration:underline;text-underline-offset:.25em;text-decoration-thickness:1px}

/* Journal */
.entry{border-bottom:1px solid var(--line);padding:1rem 0}
.entry-h{display:flex;justify-content:space-between;gap:1rem;align-items:baseline}
.entry-h b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.entry-h span{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.entry p{font-family:var(--f-body);white-space:pre-wrap;margin:.4rem 0 0;line-height:1.85}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:1.5rem;text-align:center;color:var(--muted);font-family:var(--f-body)}

.sizer{display:flex;align-items:center;gap:.25rem}
.sizer button{width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--f-body)}
.install{position:relative;background:var(--accent-soft);border-radius:12px;padding:.85rem 2.4rem .85rem 1rem;font-size:.88rem;line-height:1.6;margin-bottom:1rem}
.install b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.05rem;color:var(--accent)}
.install-x{position:absolute;top:.4rem;right:.4rem;background:none;border:0;font-size:1.3rem;color:var(--muted);width:2rem;height:2rem}
.toast{position:fixed;left:50%;bottom:calc(5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.55rem 1rem;border-radius:999px;font-size:.85rem;z-index:50}
/* Plan, today, backup, consolation/desolation */
.hero-l .linkbtn{align-self:flex-start}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:.2em;font-size:.85rem}
.opts{display:grid;gap:.5rem}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;display:flex;flex-direction:column;gap:.15rem}
.opt b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.opt span{font-size:.82rem;color:var(--muted);line-height:1.55}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.on b{color:var(--accent)}
.install .row .btn{font-size:.85rem}
.moods{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem}
.mood{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.4rem .95rem;font-size:.9rem}
.mood.on[data-m="c"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.mood.on[data-m="n"]{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.mood.on[data-m="d"]{background:var(--wine);border-color:var(--wine);color:var(--surface)}
.counsel{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:.85rem 1rem;margin:0 0 1rem;font-family:var(--f-body);font-size:.95rem;line-height:1.85;color:var(--ink)}
.counsel h5{font-family:var(--f-display);font-weight:400;font-size:1.1rem;margin:0 0 .35rem;color:var(--accent)}
.counsel p{margin:.3rem 0;text-align:left}
.counsel ul{margin:.3rem 0 .5rem;padding-left:1.2em;color:var(--ink)}
.counsel li{margin-bottom:.3rem}
.chip{display:inline-block;font-family:var(--f-ui);font-size:.72rem;border-radius:999px;padding:.05rem .55rem;margin-right:.45rem;vertical-align:.1em}
.chip.c{background:var(--ok);color:var(--surface)}
.chip.n{background:var(--sunk);color:var(--muted)}
.chip.d{background:var(--wine);color:var(--surface)}
@media (prefers-reduced-motion:no-preference){.view{animation:in .35s ease both}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<script>
const DATA = {"sets": [{"id": "1", "name": "神操之一", "lessons": [{"id": "1-00", "num": "00", "kind": "主題講解", "title": "神操介紹", "veni": false, "sections": [{"name": "講解", "html": "<h3>1．神操介紹<\/h3>\n<p>當以色列因為忘記天主的恩賜而崇拜別的神的時候，天主對歐瑟亞先知說道：“看，我要誘導她，領她到曠野和她談心”（歐 2:16）。 雖然以色列不斷地違反天主的誡命，而且再輕視天主對她的愛，但是天主卻忘掉所有以色列人的罪過，誘導以色列人回到他的身邊，恢復初次的愛情。後來以色列對天主的愛果然很快復原了，“就如她幼年時，就如她從埃及地上來的那一天一樣”（ 歐2:17）。<\/p>\n<p>我們應該深刻地認識自己！以色列的故事其實也是我們自己的故事。我們每一個人都想跟天主和好，同時也想跟世界和好；或者想跟天主和我們自己和好。所以我們這幾天在這裏，要做的就是認識自己，也要看我們對天主的愛如何，省察我們的財寶在哪里，“因為你的財寶在那裏，你的心也必在那裏”（瑪6：21）。這就是為了避免犯以色列的錯誤。這幾天，天主會領我們到曠野和我們談心，他會向我們顯示他自己的聖意。神操是神聖的時間，是跟耶穌特別在一起的時間。穀 6，32：“耶穌對他們說：走！我們去一個安靜的地方，你們休息一會吧！這是因為有很多人跟隨著他們，他們連吃飯的時間也沒有。”<\/p>\n<h3>1．神操的目的<\/h3>\n<p>神操是什麼？神操有什麼目的？我們這次避靜，要以聖依納爵的神操為（wei2）主要的內容。不過我們也會用別的材料。聖依納爵給我們神操的定義：[1]“神操這個名詞，是指任何省察、默想、默觀、口禱、心禱以及下麵要說的其他靈修神工。就如散步、走路、跑步都是體操，同樣地，準備整理靈魂，驅除邪情，好能認清天主的聖意，以便調整自己的生活，拯救靈魂，便都叫「神操」。＂聖依納爵說明神操的定義的時候，也告訴我們神操的目的：[21] “是為戰勝自己，整理自己的生活，使不致為任何不正的心情決定自己的生活。＂<\/p>\n<p>所以呢，神操的主要目的不是：學習新的東西啊，聽很好的道理啊，也不是放假的時間啊。那神操有什麼目的呢？<\/p>\n<p>一，<strong>神操是為戰勝自己<\/strong>。這幾天是一段戰鬥的時間。參加神操像到曠野一樣。在曠野，我們會碰到魔鬼，他會來誘惑我們，因為他知道我們在這裏會很努力的祈禱，放棄所有的一切去尋找天主的聖意，所以呢，這幾天他會更誘惑我們。我們要戰勝自己，我們應該在小事上戰勝自己(或；我們應該從小事上開始戰勝自己)，比方：我們要拒絕好奇，不要做令我們分心的東西，比如：因為看書而不祈禱，或者想到避完靜以後還要做什麼事情等等。我們也要保持安靜，不說話。我們不能浪費時間。我們也應該戰勝自己害怕的心情：我們不能怕做克苦，不要怕祈禱很長時間，不能怕對天主大方一點（意思是說：如果天主向我們顯示他的聖意，請我們做很大的選擇，我們不能害怕）。為了戰勝自己，我們應該把所有自己不正的心情去掉。天主肯定會讓我們認識到我們在什麼地方不對，我們應該改什麼缺點、缺陷、不足，所以我們應該準備好報答天主的邀請。這是我們在這裏第一個主要的目的：“準備整理靈魂，驅除邪情，好能認清天主的聖意”。<\/p>\n<p>二，<strong>神操是為調整自己的生活<\/strong>。我們在這裏不僅僅要認識到我們不足的地方，也要調整它們。神操是一個很好的機會，它會幫助我們改正我們的缺點。在我們的生活當中，會有許多東西束縛我們，不讓我們自由服務天主。我們應該解開它們。這是我們的第二個目的：當我們驅除邪情的時候，我們應該找到天主的聖意，“以便調整自己的生活，拯救靈魂”。就是說：我們按照天主的安排來改善自己的生活。<\/p>\n<p>三，<strong>神操是為讓我們和天主的關係更加親密<\/strong>。雖然在曠野裏，魔鬼會比平時更“努力”地工作（誘惑我們），但是最重要是天主會比他還努力工作，幫助我們。在神操上最感興趣的就是天主吧。在這裏，他想告訴我們很多東西，我們應該認真地注意他，聆聽（ling2ting1）他，跟隨他。我們只要跟著天主就會打得過魔鬼，我們就會改善我們的生活，我們會更好地為天主服務。<\/p>\n<p>總言而之，神操的目的是我們的聖化。通過戰勝自己，通過調整自己的生活，通過我們和天主在一起，達到與耶穌更加密切地結合，親密的關係，獲得靈魂的聖化。我們應該跟隨救主，就像若望和<a href=\"file:///J:/Neni%202005/Juan%20Beroch/EJERCICIOS%20ESPIRITUALES%20EN%20CHINO/Material/Chinese%20Bible/Jame.htm\">雅各伯<\/a>一樣，我們也要問他：“師傅，你住在哪里？”耶穌馬上會告訴我們：“你們來看看吧！”（若1：35-39）兄弟們，我們應該說服自己：我們得成為聖人。不僅僅知道聖善的生活是什麼，而且度聖善的生活。為了這個，我們應該堅定地做個決擇：我想度聖善的生活。<\/p>\n<p>聖依納爵把他的神操分成四個部分，他把每個部分都稱為“星期”。每週都有特定的目的。<\/p>\n<p>第一周是為了看我們的缺點，同時決定改善。<\/p>\n<p>第二周是為了看耶穌的生活如何，同時決定追隨耶穌，效法他的生活。<\/p>\n<p>第三周是為了看耶穌受難時如何堅持下去，同時決定我們，不管受到多麼大的困難，也不要放棄我們在這個避靜當中決定的意志<\/p>\n<p>第四周是為了看耶穌復活之後的光榮，同時明白我們在世所做的事情和所過的困難，肯定會有天主的報酬（豐富的賞報）。<\/p>\n<h3>1．重要的條件：<\/h3>\n<p>為了做這場神操而獲得效果，  每一個參加者應該努力符合一些條件。並執行條件<\/p>\n<p>一,<strong>寬大的行為<\/strong>:[5]“奉行神操的人，如果開始時便以慷慨的心胸，將全部意願和自主奉獻給自己的造物主，聽憑他隨意處理他和他所有的一切，為能最好地侍奉他，這樣一定為他很有益處。＂這個條件是最重要的。我們應該注意我們的精神狀態怎麼樣。如果我們用慷慨的心胸來作這個神操，來做每一個默想，那我們就會獲得很好的效果。我們在這個神操當中不可以希望獲得一個一般的效果，而要希望提高我們靈修的水準，提高到天主想到的程度。如果我們跟他大方，他會給我們更大的幫助，因為天主的“慷慨大方超過我們”。<\/p>\n<p>二，<strong>怎麼戰勝自己<\/strong>： [16]“為了讓天主在我們的靈魂上更自由工作，如果我們對某事物有不正當的愛好或傾向，最好我們應該全力鼓勵自己，走上與他偏愛的事物相反的方向。比如我們想保留某項職務，可是並不是為了光榮天主，也不是為人靈的好處，而是為自己的方便和現世的好處 ，我們就應該勉強自己去愛相反的事，加強祈禱及其他神業，向我們的主天主祈求相反的事；就是說我們決不願意接受那個職務，除非天主糾正了我們的願望，改變了我們的心情，致使我們願望或保持這個或那個的動機，只是為侍奉光榮至尊的天主才對。＂<\/p>\n<p>在這裏我們應該聆聽天主的聖意，他是怎麼安排的。我們要學習怎麼聆聽他，怎麼尋找他。我們不可以隨心所欲地選擇我們想做的東西，我們應該考慮是否耶穌想讓我做它們。天主的聖意是最重要的。<\/p>\n<p>三，<strong>最重要是祈禱<\/strong>：[2]“講授默想或默觀的方式和次序的人，應將默想或默觀的史實，忠實地敘述，只簡短地大概分析說明一下便夠了。因為從事默觀的人既然取得了歷史的正確基礎，便可自己去思考、推論，由自己的思考，或因理智受天主的光照，比講授的人多所發揮，更有趣味，更有益處；因為不是知道的多，而是內心的玩味品嘗更能使人滿意。＂<\/p>\n<p>四，<strong>保持安靜<\/strong>：你們已經知道安靜不一定是不說話。安靜主要是內在的，心裏的。不僅是不說話，也是不分心。我們這幾天除了我們的聖化，除了神操的活動，最好不要想別的事情吧。本堂神父們可能會想到神操講完之後有很多的活動；學生不要想回到學校之後的考試或者要學習的東西吧。因為這些東西只會讓你們分心，不會幫助你們找到天主對你們的指示，你們不會更好的作這些事情，反而你們做得會更不好。話又說回來，如果你們全心地參加這個神操，那你們以後就會更好的從事牧靈的工作，更好的學習，更好的作所有的一切。主要的原則應該是：該做什麼就做什麼。在這裏應該祈禱，那我們只想祈禱。<\/p>\n<ol>\n<li><strong>祈禱的簡單介紹<\/strong><\/li>\n<\/ol>\n<p>為了做好這幾天的祈禱，我簡單地介紹一下聖依納爵祈禱的方式。每天三次我們給你們講一些道理，給你們提供一些材料幫助你們祈禱。你們也可以自由地選擇其他的材料。在這裏，主要是祈禱。聖依納爵把每一個默想分成幾部分。<\/p>\n<p>１．來這裏祈禱以前，他建議我們做一下<strong>相遇的準備<\/strong>。什麼是相遇的準備呢？祈禱前五分鐘，不要幹別的事情，慢慢地來到這裏，準備一下你的祈禱。 要讓自己的身心寧靜下來。我們忙碌的生活中有不少焦慮、紛擾、煩惱…。我們已經說了：靜默並非無言，而是讓「我」的言安靜下來，好能有機會聆聽「另一位」之言，即天主的聖言。以後我們要把自己安放在天主面前<\/p>\n<ol>\n<li>意識到我是誰，我又為什麼在這裏。「我們是在他內生活、行動和存在。」我並不是偶然在這裏。我對那吸引我，並帶領我來此的那一位有著全心的信賴和盼望。<ol>\n<li>意識到我與他之間存在著一種個人的關係，是「你」與「我」之間的關係。我將要與那先愛了我的那一位相處一小段時光。我起床時意識到他愛著我；我晚上睡覺前，也經驗到他愛著我。他常同我在一起，他也願意我常同他在一起。<\/li>\n<\/ol>\n<\/li>\n<li>與天主相遇者的態度：<\/li>\n<li>深度的謙遜 (我是他的受造)<\/li>\n<li>完全的信賴 (我蒙他的眷愛)<\/li>\n<li>充滿安全感 (我承蒙他召選)<\/li>\n<li>\n<p>徹底的交付 (我願為他生活)<\/p>\n<ol>\n<li>\n<p>預備經：<\/p>\n<\/li>\n<li>\n<p>意識到自己將要祈禱的內容<\/p>\n<\/li>\n<li>\n<p>緩慢地閱讀所選的聖經章節，想起自己所要祈禱的主題或某項生活的事件。<\/p>\n<\/li>\n<li>\n<p><strong>定像<\/strong>：用想像力將福音或某生活事件放在眼前。在默想或者默觀當中這個“定像”是非常重要：主要是給我們的想像一個對象，不讓它打擾我們的祈禱而且讓它幫助我們。如果我們默想耶穌聖誕的奧跡，那我們就可以把一個耶誕節的情景放在眼前。如果我們默想耶穌基督受難，那我們可以想像基督在十字架上。這樣一來，我們的想像會安靜下來，讓我們祈禱。<\/p>\n<\/li>\n<li>\n<p><strong>求恩<\/strong>：以對話的方式向天主懇求我所渴望的恩寵，即天主願意在這段祈禱時光中賞給我禮物。<\/p>\n<\/li>\n<li>\n<p>這種對話，如同朋友和朋友之間的對談。<\/p>\n<\/li>\n<li>\n<p><strong>默想<\/strong>：這是在祈禱中偏向理智的反省。試著去瞭解聖言所要教導的內容，想想與基督徒生活的其他教導有什麼關係，試著與自己的生活整合起來。這是對福音一種更深的領悟：更認識耶穌和他的聖言。<\/p>\n<\/li>\n<li>\n<p><strong>默觀<\/strong>：這是在祈禱中的靜默，重視我所發現和體悟到的，專注或聆聽我所看到或反省的。用五官去看、去聽、… 究竟福音這一幕中有哪些人物，他們在做什麼、說什麼…。我讓這一切逐漸滲透到我內…。<\/p>\n<\/li>\n<li>產生情感與內在的推動：注意到當我在默想或默觀時，當我默觀福音中的人物和其態度時，當我想到自己的生活時…，在我內產生的情緒是：<\/li>\n<li>喜樂、愉悅、平安、光照、安全感、力量、被接納、樂觀…<\/li>\n<\/ol>\n<\/li>\n<\/ol>\n<p>難過、悲傷、不安、冷淡、沮喪、害怕、孤獨、被排斥、悲觀…<\/p>\n<ul>\n<li>這些感受與我跟隨耶穌有關：鼓勵我或阻礙我？<\/li>\n<li><strong>對禱<\/strong>：這是一種交談式的祈禱，與主耶穌或是與聖母瑪利亞交談，答覆我所聆聽、瞭解、感受、和能應用的聖言。表達的方式是多元的：<\/li>\n<li>感恩：感謝在祈禱中、生活中、在圍繞著我的人身上，我所領受的恩惠…。<\/li>\n<li>讚美：因著他為我所做的奇事。<\/li>\n<li>懇求寬恕：有時我不見得慷慨答覆：逃避、忽視、困難、害怕、不夠信賴…。<\/li>\n<li>祈求幫助：因著天主的光照而得以瞭解，獲得改變的恩寵，有力量繼續往前邁進…<\/li>\n<\/ul>\n<p>對禱是每次操練最重要的一部分，不能缺乏；至少要花十五分鐘作它。<\/p>\n<ul>\n<li>\n<p>結束時，可以用天主經、聖母經…<\/p>\n<ul>\n<li>\n<p><strong>祈禱的省察<\/strong>：在祈禱後，花兩三分鐘反省這次祈禱<\/p>\n<\/li>\n<li>\n<p>意識到我怎樣做了這次祈禱，簡單記錄神修筆記。<\/p>\n<\/li>\n<li>我記得哪個時刻是特別重要而我也渴望答覆的？<\/li>\n<li>我在那時刻的感覺怎樣？不安、有光照、冷淡、分心、平靜… 有什麼原因嗎？<\/li>\n<\/ul>\n<\/li>\n<li>\n<p>在祈禱過程中，我主要的感受是什麼？<\/p>\n<\/li>\n<\/ul>\n<p>我會有這種感覺，主要因素可能是…<\/p>\n<p>動   機<\/p>\n<p>深刻被愛的經驗，這是人性最恒常的渴望<\/p>\n<p>在父母的愛中，我們多少有此體驗<\/p>\n<p>朋友之間的友誼也使我們有所體會<\/p>\n<p>由於雙方是不同的個體，多少會有個「但是」…<\/p>\n<p>當別人對我們有某種刻板印象時，我們就緘默了：某人就是這幅德性，但是他並不認識真正的我。<\/p>\n<p>因此，我們在人面前出現時，會帶著面具…，為使自己被接納。<\/p>\n<p>唯有天主完全認識我，並愛本然的我…，儘管我不容易真的相信這事實。<\/p>\n<p>我可以信靠他，他永遠不會拋棄我。<\/p>\n<p>我可以確信他接納我，儘管我是有罪的人。<\/p>\n<p>在天主面前，我不需要戴面具，他徹底接納我，並不斷地愛我。<\/p>\n<p>他的愛是一份白白賞賜的禮物，<\/p>\n<p>天主愛我不是基於我做了什麼。<\/p>\n<p>注意法利賽人的態度，他們依恃自己的努力和功績，為博得天主的恩佑。<\/p>\n<p>求恩：阿爸，父啊！幫助我相信我是您所深愛的，這才是我的喜樂與平安。<\/p>\n<h3>祈禱材料<\/h3>\n<ul>\n<li>我的生命，出於天主主動而具創造性的愛：創一26-31；智十一21-26<\/li>\n<li>天主愛我本然之所是，他認識我的名字：依四三1-7；依四九1-16<\/li>\n<li>他的愛是完全的、恒常的：詠一三九<\/li>\n<li>他的愛是無條件的，白白賞賜的：羅八31-39；若四       9-10<\/li>\n<\/ul>\n<p>與主交談，感謝他對自己的愛  詠八<\/p>\n<p>==============================================================<\/p>\n<h3>萬古長新的美！我愛您愛得太晚了！<\/h3>\n<p>摘自聖奧斯定主教懺悔錄<\/p>\n<p>啊，永遠的真理！啊，真正的愛德！啊，可愛的天主！您是我的天主；我日夜渴念著您！在我第一次認識您的時候，您就提拔我，叫我歸向您，叫我覺得有一樣我當瞻仰的東西，可是我那時還沒有能力去瞻仰。您用您的神光，照射我軟弱的眼睛，激起我一種且驚且喜的情緒。我遠離著您，居於化外之地。在哪里，我彷佛聽到您來自空中的聲音說：「我是成人之糧：你長大吧，就能夠飽饗我！你將不會把我轉變成你內的物質，就像你吃一般食物那樣；反而是你將轉化而變成我！」<\/p>\n<p>我尋求那能使我享見您的途徑，可是總沒有找到，一直到我擁抱了天人之間的中保  耶穌基督，他是人，他是高於一切並永受讚美的天主，他召喚我並對我說：我是真理、道路與生命；我是食糧，我是天主聖言，成了血肉，取了人性，好成為世人的神糧。主！您用以創造天地萬物的智慧，卻做了我們弱小者的乳汁。<\/p>\n<p>主！您是萬古長新的美，我愛您愛得太晚了，太晚了！您怎麼會在我內而我在我外呢？我在外邊找您：我追求妖豔的受造之物，而破壞了我的本身。您在我身邊，我卻醉心於物而遠離了您。當知：脫離了您，一切都算不得什麼。您呼喚了我，且您的呼聲震動了我的耳鼓；您發過光，且您的光驅逐了我的黑暗；您散播過馨香，使我聞到之後就景仰您；我嘗過您的美味，而現在我渴慕著您；您碰觸過我，而我正切望那出自於您的平安！<\/p>"}], "notes": []}, {"id": "1-01", "num": "01", "kind": "默想要點", "title": "原則與基礎（一）", "veni": true, "sections": [{"name": "預備經", "html": "<p>求我們的主天主，賞我聖寵，使我的一切意向和行為，都為事奉讚美至尊無對的天主。<\/p>"}, {"name": "定像", "html": "<p>「天主照自己的肖象造了人，就是照天主的肖象造了人：造了男人和女人」（創 1：27）。<\/p>"}, {"name": "求恩", "html": "<p>我們要求天主賞賜我們恩寵，為按照我們受造的目的而生活。<\/p>"}, {"name": "默想", "html": "<p>聖依納爵說：「人受造的目的，是為讚美、崇敬、事奉我們的主天主，因而拯救自己的靈魂」<sup class=\"fn\"><a href=\"#n-1-01-1\" data-fn=\"1-01-1\">1<\/a><\/sup>。<\/p>\n<p><strong>1.<\/strong> <strong>聖人的意思是什麼？<\/strong><\/p>\n<p>聖人的意思是說，天主是人的最後目的。那麼天主是人的最後目的是什麼意思？意思是說，人做什麼，都是為了天主而做，都是為了達到他而做：吃飯、學習、工作、生活……都是為了愛慕他、事奉他。天主是人的最後目的，也意味著，只有天主，才能使人完全幸福。因此，人願意不惜任何代價，並付出一切來達到祂。天主是人的最後目的，也意味著，人把天主視為生活中最重要的，或更好說，唯一重要的。<\/p>\n<p>「人縱然賺得了全世界而賠上自己的靈魂，為他有什麼益處？」（谷8：26）。<\/p>\n<p><strong>2.<\/strong> <strong>那麼為什麼天主創造人的時候，要他追求這麼一個目的？<\/strong><\/p>\n<p>天主創造人，要他追求這麼一個目的，以使他完全幸福。天主創造人的理由是他願意人光榮他，不是因為天主需要人光榮他，而是因為人光榮了天主，就可以抵達天鄉而得到永福。<\/p>\n<p>耶穌給門徒們講了葡萄樹的比喻以後，對他們說：「我對你們講論了這些事，為使我的喜樂存在你們內，使你們的喜樂圓滿無缺」（若15：11）。<\/p>\n<p><strong>3.<\/strong> <strong>我們怎麼知道人應該追求天主，有如最後目的呢？<\/strong><\/p>\n<p>我們知道，就是因為健全的哲學，以及天主教的信仰是這樣教導的。<\/p>\n<p>健全的哲學告訴我們，天主是為了他自己而創造萬物。他是那樣做的，不是出於自私，而是出於慷慨。為什麼呢？因為他創造萬物的時候，願意與受造物分享自己的存有、自己的美善，自己的真理。關於人呢，天主還願意與他分享自己的靈性，也就是說，天主有理智和意志，所以他願意人也有理智和意志，為使他能夠認識、愛慕自己的創造者。關於其他受造物呢，它們沒有理智和意志，所以不能認識自己的創造者，但是它們還能光榮天主。受造物怎樣光榮天主呢？就是以自己的存在而光榮他，以幫助人認識、愛慕天主而光榮自己的創作者。天主創造萬物的時候，就為它們定了這麼一個最後目的， 即光榮他。天主不能為它們定另一個目的，因為沒有比天主更崇高的存有。<\/p>\n<p>「一切都是借著他，並且是為了他而受造的。他在萬有之先就有，萬有都賴他而存在」（哥1：15-16）。聖奧斯定說：「主……我們是為了你而受造的，除非安息於你，我們的心，得不到安寧」<sup class=\"fn\"><a href=\"#n-1-01-2\" data-fn=\"1-01-2\">2<\/a><\/sup>。<\/p>\n<p><strong>4.<\/strong> <strong>那麼如果人不把天主視為自己的最後目的會怎麼樣？<\/strong><\/p>\n<p>如果人不把天主視為自己的最後目的，就會把財物、聲望、榮譽、權勢、健康、美貌、肉體快樂或智慧，視為自己生命中最重要的東西。<\/p>\n<p>人不可能追求兩個最後目的，例如：追求肉體快樂，同時追求天主；或追求健康，同時追求天主。「沒有人能事奉兩個主人：他或是要恨這一個，而愛那一個，或是依附這一個而輕忽那一個。 你們不能事奉天主而又事奉錢財」（瑪6：24）。<\/p>\n<p><strong>5.<\/strong> <strong>那麼如果人把其中一個，例如：財物，美貌或肉體快樂，視為最後目的，他會不會幸福？<\/strong><\/p>\n<p>如果人所追求的不是天主，而是財物，美貌或肉體快樂等，他永遠不會完全幸福，因為他死以後，就不會看到天主：在世上，他沒有愛天主勝過一切，在來世也就不會有愛他、享受他的機會了。<\/p>\n<p><strong>6.<\/strong> <strong>但是為什麼有些人追求財物，或肉體快樂就會幸福呢？<\/strong><\/p>\n<p>事實上，他們的幸福是短暫的，是假的，不能完全滿足人的一切渴望，客觀而言，這些東西，都沒有任何一個能夠使人心滿意足。<\/p>\n<p>財物、聲望、榮譽、權勢、健康、美貌、肉體快樂或智慧，哪一樣我們可以永遠保留呢？死了不是都沒了嗎？<\/p>\n<p>聖十字若望曾說過：「一切的受造物，與天主的無限存有相比，全是虛無。例如：受造物（礦物、植物、動物、人、天使）的所有美麗，與天主的無限美麗相比，是極至的醜陋；因為『姿色是虛幻，美麗是泡影』（箴卅1：30）；受造物的一切恩寵和幽雅，與天主的恩寵相比，是極至的失寵和極至的粗俗；世上受造物的所有良善，與天主的無限良善相比，能稱之為邪惡；因為除了天主以外，沒有誰是善的（路18：19）；世上的一切智慧與人類的才能，和天主的無限智慧相比，是純然的無知；根據聖保祿的教導：「在天主的眼中，今世的智慧是愚妄的」（格前3：19）；世上所有的權勢與自由，和天主聖神的權勢和自由相比，是極至的奴役、憂苦和束縛；世上對世物一切的愉悅與意志的樂趣，和天主的一切愉悅相比，是至極的痛苦、折磨和辛酸；受造物的一切富裕與光榮，和天主的富裕相比，是極至的貧窮與可憐」<sup class=\"fn\"><a href=\"#n-1-01-3\" data-fn=\"1-01-3\">3<\/a><\/sup>。<\/p>\n<p>所以，聖女大德蘭也說：「心有天主者，堅忍百事成，夫複何所求，有主心意稱」<sup class=\"fn\"><a href=\"#n-1-01-4\" data-fn=\"1-01-4\">4<\/a><\/sup>。聖保祿教導我們，天主是「不可言傳的」（格後12：4），即人類語言所不能說出的；他所能說的只有：「天主為愛他的人所準備的，是眼所未見，耳所未聞，人心所未想到的」（格前2：9） 。<\/p>\n<p><strong>7.<\/strong> <strong>那麼客觀上，讓我們完全幸福的東西應有什麼樣的特性？<\/strong><\/p>\n<p>應該是人的至善，應該是自足的善，應該是完美的善，並應該是人自身的善，而只有天主符合這些特性。只有天主能夠讓我們的幸福圓滿無缺。<\/p>\n<p><strong>8.<\/strong> <strong>但是為了享見天主、享有永福，我們應該做些什麼呢？<\/strong><\/p>\n<p>我們應該讚美、崇敬、事奉我們的主天主，因而拯救自己的靈魂。<\/p>\n<p><strong>9.<\/strong> <strong>我們真想拯救自己的靈魂，但是如果碰到一些障礙，例如：某些罪過、某些壞習慣，就應該怎麼辦？<\/strong><\/p>\n<p>應該求天主幫助我們排除障礙，遵守十誡，保留恩寵，永不離開他，因為是他邀請我們，是他願意我們得救，是他召喚我們。<\/p>\n<p><strong>10.<\/strong> <strong>尋找我們生命的意義值得嗎？<\/strong><\/p>\n<p>教宗聖若望保祿二世曾對⻘年說：「尋找真理、發現真理、因尋獲真理而歡欣，乃人生一大樂事，令人振奮不已。」而事實是，誰尋找真理，誰就是尋找天主，因為天主是永恆的真理。因此，所有尋找天主的青年，都會踏上一段振奮人心的探險之旅：「發現天主、發現福音、找到救主，我向你們保證，確實是一段奇妙的探險」<sup class=\"fn\"><a href=\"#n-1-01-5\" data-fn=\"1-01-5\">5<\/a><\/sup>，那就是認識耶穌基督的偉大探險！<\/p>"}, {"name": "對禱", "html": "<p>對禱應是真正的談話，就如朋友與朋友，僕人與主人談心一樣；有時祈求某項恩寵，有時承認自己犯的某項罪過，有時訴說自己的心情，有時對某事請求指導。最後念一遍「天主經」。<\/p>"}], "notes": [{"n": "1", "html": "《神操》書，第23號。"}, {"n": "2", "html": "聖奧斯定，《懺悔錄》I，1，1。"}, {"n": "3", "html": "《攀登加爾默羅山》1，4-7。"}, {"n": "4", "html": "《詩集》，30；參閱：《天主教教理》，22。"}, {"n": "5", "html": "聖若望保祿二世，《致坎培拉⻘年文告》，1993 年。"}]}, {"id": "1-02", "num": "02", "kind": "默想要點", "title": "原則與基礎（二）", "veni": true, "sections": [{"name": "預備經", "html": "<p>求我們的主天主，賞我聖寵，使我的一切意向和行為，都為事奉讚美至尊無對的天主。<\/p>"}, {"name": "定像", "html": "<p>「在起初天主創造了天地」（創 1:1）。<\/p>"}, {"name": "求恩", "html": "<p>我們要求天主賞賜我們恩寵，為按照我們受造的目的而使用受造物。<\/p>"}, {"name": "默想", "html": "<p>上次默想，我們反省了有關人受造的目的，為了明白，我們應該追求天主，有如最後目的，我們的生命有什麼意義，我們怎樣可以完全幸福。那麼現在，我們要反省有關受造物的目的。為什麼天主創造了天地萬物？萬物受造的目的是什麼？<\/p>\n<p>聖衣納爵說：「世界上的一切，都是為人而造的，為幫助他追求他之所以受造的目的。結論是：根據人受造的目的，世物能有多少幫助，就必須取用多少；能造成多少障礙，就必須放棄多少」<sup class=\"fn\"><a href=\"#n-1-02-1\" data-fn=\"1-02-1\">1<\/a><\/sup>。<\/p>\n<p><strong>1.<\/strong> <strong>天主創造萬物<\/strong><\/p>\n<p>在起初，除天主外，空無一物，只有天主存在。但他在願意的時刻，以他願意的方式，創造了天地萬物：「你創造了萬物，萬物都是因了你的旨意而存在，而造成的」 （默4：11）。<\/p>\n<p>唯有天主能夠創造，即無中生有。因此，萬物的存在與行動，都依賴於他，因為萬物並非因自己而存在，而是天主給了萬物存在，以及行動的能力；因為「萬有都賴他而存在」（哥1：17），而且是他「使你們願意，並使你們力行」（斐2：13）。天主借著他的聖言，即借著他全能的旨意，創造了萬有。他如此做，因為他願意。<\/p>\n<p><strong>2.<\/strong> <strong>為什麼天主創造天地萬物呢？<\/strong><\/p>\n<p>天主創造了天地萬物，是為了幫助人：為了幫助他生存（所以天主創造了水、空氣、各種植物與動物等）。天主創造了天地萬物，也是為了好使人借著受造物而發現自己的創作者。<\/p>\n<p>「從受造物的偉大和美麗，人可以推想到這些東⻄的創造者」（智13：5）。「其實，自從天主創世以來，他那看不見的美善，即他永遠的大能和他為神的本性，都可憑他所造的萬物，辨認洞察出來」（羅1：20）。<\/p>\n<p><strong>3.<\/strong> <strong>既然天主是為了人而創造了萬物，那麼人就可以隨便用嗎？<\/strong><\/p>\n<p>不，萬物受造的目的是為幫助人，但我受造的目的是為追求天主，拯救靈魂，所以要取用世物，必須注意我受造的目的。<\/p>\n<p><strong>4.<\/strong> <strong>所以說，取用世物，有原則嗎？<\/strong><\/p>\n<p>有，原則是：根據人受造的目的，世物能有多少幫助，就必須取用多少；能造成多少障礙，就必須放棄多少。<\/p>\n<p><strong>5.<\/strong> <strong>比方說，什麼東西能幫助我達到我受造的目的呢？<\/strong><\/p>\n<p>水、食物、衣服、有些物質上的東西、有些友誼關係，等等。這些東西，幫助我修德行，修了德行就可以達到目的。還有一些靈性方面的東西，例如：祈禱、聖事、教會、信仰，等等，也幫助我修德行，修了德行就可以達到目的。<\/p>\n<p><strong>6.<\/strong> <strong>那麼，什麼東西能阻礙我達到目的呢？<\/strong><\/p>\n<p>比方說，有些東西造成障礙，比如那些被禁止的，肉是個善的東西，但是聖週五是被禁止吃的。<\/p>\n<p><strong>7.<\/strong> <strong>所以天主也創造了一些阻礙我達到我受造的目的的東西嗎？<\/strong><\/p>\n<p>不是，天主所創造的，都是好的，但我要用理智正確辨別，並用自由妥當選擇。<\/p>\n<p><strong>8.<\/strong> <strong>那麼這些能幫我達到我受造的目的的東西，我必須要用，還是我可以不用？<\/strong><\/p>\n<p>這樣看情況，能幫我達到我受造的目的的東西，我必須要用，例如：主日彌撒，我必須要參加；能阻礙我達到我受造的目的的東西，我必須放棄，例如：聖週五吃肉。所以我們所用的原則是所謂的「tantum quantum」原則：「根據人受造的目的，世物能有多少幫助，就必須取用多少；能造成多少障礙，就必須放棄多少」。<\/p>\n<p><strong>9.<\/strong> <strong>但是，有沒有一些東西，雖然能幫我達到我受造的目的，但不必取用？<\/strong><\/p>\n<p>有，一些東西，不被禁止，也不必用，例如：我念一遍聖母經或一遍天主經；我騎自行車或走著去學習；我學醫學或學化學；我想當神父或想結婚；我要活到50歲或80歲；我要身體健康，或不健康；我想自己富裕，或能吃能喝、有基本的東西就知足，等等。針對這些東西，我們用要採取的態度叫作：不偏不倚的態度。但現在我們不多說，下一次默想，我們要解釋。<\/p>\n<p><strong>10.<\/strong> <strong>我們繼續解釋取用或放棄世物的原則<\/strong><\/p>\n<p>關於日常生活中的事情，我們天天用這個原則。例如：因為我要去台北，所以我必須坐往台北的公車。因為我要解渴，所以我必須喝水。因為我要結果實，所以我必須種地。因為我要達到某個目的，所以我必須採取有效的方法。這個原則，我們天天用。<\/p>\n<p>關於超性生活中的事情，我們也要用這個原則。因為我要得救，所以我必須取用那些幫我得救的世物，也必須放棄那些阻礙我得救的世物。<\/p>\n<p><strong>11.<\/strong> <strong>但是，我們也經常違背這個原則<\/strong><\/p>\n<p>關於日常生活中的事情，我們經常違背這個原則。例如：我要考試，但我不好好學習。我要默想，但我不准備默想。我要修潔德，但我求天主恩寵，也不避開犯罪的機會。<\/p>\n<p>關於超性生活中的事情，我們經常違背這個原則。例如：我要得救，但我不遵守十誡、犯大罪，或任意犯使我慢慢兒遠離天主的小罪。<\/p>\n<p><strong>12.<\/strong> <strong>所以問題是，我到底要不要達到最後目的呢？<\/strong><\/p>\n<p>我到底要不要抵達天鄉，並獲享圓滿無缺的幸福呢？我發現不發現財物、聲望、榮譽、權勢、健康、美貌、肉體快樂或智慧，都不會讓我完全幸福呢？我發現不發現這些都一文不值呢？<\/p>\n<p>財物：「不要嫉妒他人變成富翁，不要忌恨他人家產倍增；因為他死時什麼也不能帶走，他的財產也不能隨著他同去……將與牲畜無異，都要死去」（詠49：16-20）。<\/p>\n<p>聲望、榮譽：耶穌形容法利賽人說：「他們喜愛世人的光榮，勝過天主的光榮」（若13：43）。<\/p>\n<p>權勢：「庶民不過是口氣，顯貴也無非是幻影；放在天秤上必然浮起，合計還比氣輕」（詠49：10）。<\/p>\n<p>健康：「我們的壽數，不外七十春秋，若是強壯，也不過八十寒暑；但多半還是充滿勞苦與空虛，因轉眼即逝，我們也如飛而去」（詠90：10）。<\/p>\n<p>美貌：「姿色是虛幻，美麗是泡影」（箴31：30）。<\/p>\n<p>肉體快樂：「那隨從肉情撒種的，必由肉情收穫敗壞」（迦6：8）。<\/p>\n<p>智慧：「這世界的智慧在天主前原是愚昧」（哥3：19）。<\/p>\n<p>「我將一切都看作損失，因為我只以認識我主基督耶穌為至寶；為了他，我自願損失一切，拿一切當廢物，為賺得基督」（斐3：8）。<\/p>"}, {"name": "對禱", "html": "<p>對禱應是真正的談話，就如朋友與朋友，僕人與主人談心一樣；有時祈求某項恩寵，有時承認自己犯的某項罪過，有時訴說自己的心情，有時對某事請求指導。最後念一遍「天主經」。<\/p>"}], "notes": [{"n": "1", "html": "《神操》書，第23號。"}]}, {"id": "1-03", "num": "03", "kind": "默想要點", "title": "原則與基礎（三）", "veni": true, "sections": [{"name": "預備經", "html": "<p>求我們的主天主，賞我聖寵，使我的一切意向和行為，都為事奉讚美至尊無對的天主。<\/p>"}, {"name": "定像", "html": "<p>「正在耶穌出來行路時，跑來了一個人，跪在他面前，問他說：『善師，為承受永生，我該做什麼？』耶穌對他說：『你為什麼稱我善﹖除了天主一個外，沒有誰是善的。誡命你都知道：不可殺人，不可姦淫，不可偷盜，不可做假見證，不可欺詐，應孝敬你的父母。』他回答耶穌說：『師傅！這一切我從小就都遵守了。』耶穌定睛看他，就喜愛他，對他說：『你還缺少一樣：你去，變賣你所有的一切，施捨給窮人，你必有寶藏在天上；然後來，背著十字架，跟隨我! 』」（谷10：17-21）。<\/p>"}, {"name": "求恩", "html": "<p>我們要求天主賞賜我們恩寵，使我們獲得不偏不倚的態度<\/p>"}, {"name": "默想", "html": "<p>聖依納爵說：「我們對一切受造物，在不被禁止而能自由選擇的事上，必須保持平心，以及不偏不倚的態度：就是在我們這方面，不願意健康甚於疾病，不願意財富甚於貧窮，不願意尊榮甚於屈辱，也不願意長壽甚於短命；其他一切，莫不如此。總而言之：我們所願意、所選擇的，只是那更能引我們達到受造目的的事物」<sup class=\"fn\"><a href=\"#n-1-03-1\" data-fn=\"1-03-1\">1<\/a><\/sup>。<\/p>\n<p>聖羅伯多·伯辣民主教也表達了同樣的意思，說：「你要認清真善，就是使你達到目的的一切；你也要認清真惡，就是使你失落目的的一切。順與逆、富與貧、健康與疾病、榮譽與羞辱、生命與死亡，明智人不該為了這些事的本身而加以追求，或者加以逃避。如果這一切，有助於天主的光榮和你永遠的幸福，便是好的，該加以追求；如果它們構成阻礙，就是壞的，該加以逃避」<sup class=\"fn\"><a href=\"#n-1-03-2\" data-fn=\"1-03-2\">2<\/a><\/sup>。<\/p>\n<p><strong>1.<\/strong> <strong>複習上次默想的內容<\/strong><\/p>\n<p>上次默想，我們反省有關受造物的目的，也就是說，天主創造萬物的理由：萬物是為人而造的，為幫助他追求他之所以受造的目的。<\/p>\n<p>我們也反省有關取用或放棄世物的原則：根據人受造的目的，世物能有多少幫助，就必須取用多少；能造成多少障礙，就必須放棄多少。<\/p>\n<p>我們也說過，我們經常違背這個原則：<\/p>\n<p>– 針對日常生活中的事情：一個懶惰的學生明明知道，要通過考試，必須選擇並放棄一些東西：必須選擇學習的痛苦，也必須放棄舒適；可他不那樣做：他選擇舒適，並放棄學習。<\/p>\n<p>– 針對超性生活中的事情：一個罪人明明知道，要得救，必須選擇並放棄一些東西：必須取用那些幫他得救的世物，也必須放棄那些阻礙他得救的世物；可他不那樣做：他選擇犯那使他離開天主的大罪，或者選擇犯那些使他慢慢兒遠離天主的小罪，而不採取避免犯罪的方法。<\/p>\n<p>那麼，為什麼懶惰的學生選擇舒適而放棄學習的痛苦？為什麼罪人選擇一個受造物而拒絕天主呢？因為懶惰的學生是舒適的奴役；罪人是某個受造物的奴役。<\/p>\n<p>那麼，那懶惰的學生，要擺脫舒適的奴役，或那罪人，要擺脫罪過的奴役，都必須做什麼？為獲得自由，他們要做什麼呢？<\/p>\n<p>我們暫時不回答這個問題。我們暫時把答案放一邊。現在我們來解釋，不偏不倚的態度是什麼。<\/p>\n<p><strong>2.<\/strong> <strong>不偏不倚的態度，應用於什麼受造物？<\/strong><\/p>\n<p>上次默想，我們提到兩種受造物：一種是説明我們達到目的的，與阻礙我們達到目的的世物；對此，要用取用或放棄的原則。<\/p>\n<p>另一種世物，是指不被禁止而能自由選擇的世物，例如：健康與疾病、財富與貧窮、尊容與屈辱、長壽與短命，等等。對於這些世物，我們應該保持不偏不倚的態度，也就是說，我們只應該願意，只應該選擇那更能引我們達到受造目的的事物。<\/p>\n<p><strong>3.<\/strong> <strong>那更能引我們達到受造目的的事物，由誰來決定？<\/strong><\/p>\n<p>那更能引我們達到受造目的的事物是健康還是疾病？是財富還是貧窮？是尊容還是屈辱？是長壽還是短命？是修道還是結婚？這由天主來決定：有時天主要一個人以健康或財富或尊容或長壽光榮他，有時則要一個人以疾病或貧窮或屈辱或短命光榮他。<\/p>\n<p><strong>4.<\/strong> <strong>那麼不偏不倚的態度是什麼樣的態度？<\/strong><\/p>\n<p>不偏不倚的態度是富貴少年所缺乏的態度。<\/p>\n<p>他遵守取用或放棄世物的原則，因為他遵守十誡；但是因為他沒有不偏不倚的態度，也就是說，他願意財富，不願意貧窮，所以他無法擺脫財富的奴役，結果不願意跟隨耶穌。他還可以得救，但他不能選擇那更能引他達到受造目的的事物，即變賣一切跟隨耶穌。<\/p>\n<p><strong>5.<\/strong> <strong>那缺乏不偏不倚的態度，後果是什麼？<\/strong><\/p>\n<p>缺乏不偏不倚的態度的第一個後果就在於此，缺乏自由來選擇那更能引他達到受造目的的事物，像富貴少年一樣。<\/p>\n<p>第二後果也是缺乏自由，那就是缺乏自由來取用必須取用的世物，以及缺乏自由來放棄該放棄的世物。<\/p>\n<p>現在我們回答上面的問題：那懶惰的學生，要擺脫舒適的奴役，或那罪人，要擺脫罪過的奴役，都必須做什麼？為獲得自由，他們要做什麼呢？他們要培養不偏不倚的態度。為什麼呢？因為如果一個人，對於不被禁止而能自由選擇的世物，學會選擇那更能引他達到受造目的的事物，他對該取用或放棄的世物，也就會自由取用他必須取用的世物，也會自由放棄該放棄的世物。<\/p>\n<p><strong>6.<\/strong> <strong>但是如果我只是遵守取用或放棄世物的原則，而不培養不偏不倚的態度，可以得救嗎？<\/strong><\/p>\n<p>為了回答這個問題，我覺得我們可以舉兩個例子：<\/p>\n<p>第一、富貴少年的例子：他遵守十誡，因而可以得救。耶穌要求他變賣一切，並跟隨他，可富貴少年拒絕。他還可以得救嗎？理論上可以。因為變賣一切、跟隨耶穌，不是要求，而是邀請，是聖衣納爵所說的「不被禁止而能自由選擇的事」。<\/p>\n<p>第二、一位修生學習告解課時，學到以下原則：「當告解人身處極端緊急情況時，受任堂區主任職務者，依照義德的要求，就是遭遇實際的生命危險，也負有實施和好聖事的義務」。然後老師舉例子，說：「臨終病人所感染的病毒容易傳染，倘若聽告司鐸去給他實施臨終聖事，再小心也免不了感染疾病甚至死亡的可能性，而且可能性非常大」。這位修生想：「碰到這麼一個情況的司鐸並不多，所以不用擔心，而對生命與死亡，更不用培養不偏不倚的態度」。結果，晉鐸不久以後，就碰到了這個情況，而因為沒有提前培養不偏不倚的態度，現在不敢面對死亡，不敢去見臨終的教友。這個時候，我們以前所說的「長壽或短命」，已經不是「能自由選擇的事」，現在就是必須選擇短命。要是他早一點兒培養不偏不倚的態度而享有自由，他現在就會甘願為主致命。所有他會不會得救？要看他選擇什麼。如果他選擇長壽，不去看那個教友，那得救的難度就大了。<\/p>\n<p><strong>7.<\/strong> <strong>那麼一個沒有培養不偏不倚的態度的人，會不會對聖召做正確的選擇？<\/strong><\/p>\n<p>問問富貴少年就知道了。<\/p>\n<p><strong>8.<\/strong> <strong>那如果一個人不培養不偏不倚的態度，會不會按天主的旨意調整自己的生活？<\/strong><\/p>\n<p>不會，因為他總會按自己的旨意來調整自己的生活。<\/p>\n<p><strong>9.<\/strong> <strong>但是怎麼培養不偏不倚的態度呢？<\/strong><\/p>\n<p>比方說，一位母親與她女兒一起去動物園。女兒靠近老虎，伸出她胳膊，想摸摸老虎，老虎抓到她衣服，要把她拉進去。母親為救女兒，不會伸出自己胳膊，讓老虎咬傷它，以免女兒受傷嗎？母親為什麼敢於那樣做？答案是愛。她不會站在一邊考慮，要不要犧牲自己，她寧願犧牲自己的性命，也都不要女兒受傷。為什麼？答案是愛。要是我們對天主的愛，像那位母親的一樣，為了選擇那最喜悅天主的事，我們就不會怕什麼。<\/p>"}, {"name": "對禱", "html": "<p>對禱應是真正的談話，就如朋友與朋友，僕人與主人談心一樣；有時祈求某項恩寵，有時承認自己犯的某項罪過，有時訴說自己的心情，有時對某事請求指導。最後念一遍「天主經」。<\/p>"}], "notes": [{"n": "1", "html": "《神操》书，第23号。"}, {"n": "2", "html": "诵读，读经二。"}]}, {"id": "1-04", "num": "04", "kind": "默想要點", "title": "三種罪", "veni": true, "sections": [{"name": "預備經", "html": "<p>求我們的主天主，賞我聖寵，使我的一切意向和行為，都為事奉讚美至尊無對的天主。<\/p>"}, {"name": "定像", "html": "<p>「這裏所要默想的是罪過，便可設想一個幻景：整個的我，好像被放逐在野獸中一樣。整個的我，指我的靈魂和肉身」。<\/p>"}, {"name": "求恩", "html": "<p>「懇求我主天主賞賜我所願望的恩典。祈求的對象按題材而定，如默想復活，祈求的對象是與歡樂中的耶穌同樂；如默想苦難，祈求的對象則是悲傷、眼淚，與痛苦中的基督同苦。在這次默想中既然見到許多人只因一條大罪便受了永罰，我曾多次犯罪，本來早該受罰，所以該求慚愧與羞恥的真情」。<\/p>"}, {"name": "默想", "html": "<p><strong>1.<\/strong> <strong>天使之罪<\/strong><\/p>\n<p>天使是一個精神體。當中最著名的是聖彌格爾，上天萬軍的統帥；聖辣法耳，旅人的守護者；聖加俾額爾，曾顯現給童貞聖⺟瑪利亞；以及天主所賞賜給我們每個人的護守天使，為在世上保護我們，並引領我們到達天堂。耶穌親自指著孩童們說道：「你們小心，不要輕視這些小子中的一個；因為我告訴你們：他們的天使在天上，常見我在天之父的面」（瑪18：10）。<\/p>\n<p>有一部分天使不服從天主，而成了惡天使，因而被判下地獄：「天主沒有寬免犯罪的天使，把它們投入了地獄」（伯後2：4；猶1：6)。它們是魔鬼。<\/p>\n<p>它們妒嫉我們，因為它們沒有得救的可能性；因此，它們引誘我們作惡，使我們偏離朝向天堂的正道，把我們拖下地獄裏去。<\/p>\n<p>教會教導我們，他起初是好天使，由天主所造。聖經曾談及這些天使的罪惡。這種「墮落」在於這些受造的精神體，以自由的抉擇，徹底而無可挽回地拒絕天主及祂的神國。<\/p>\n<p>天使的罪之所以不能獲得寬恕，是由於他們在抉擇上具有無可挽回的特性，而並非天主無限仁慈的一項缺陷。「正如人死後不能再悔改，天使們在墮落後也不可能悔改」。<\/p>\n<p>魔鬼只犯了一條罪就受永罰了。<\/p>\n<p><strong>2.<\/strong> <strong>原祖之罪<\/strong><\/p>\n<p>天主不僅給亞當肉身和靈魂，更重要的是，天主賞給他恩寵，使他作天主的兒子及朋友。當亞當犯死罪時，自己喪失了恩寵，而由於他是人類的首生者，他的一切後代，也喪失了恩寵。<\/p>\n<p>聖經說：「罪惡借著一人進入了世界，死亡借著罪惡也進入了世界；這樣死亡就殃及了眾人，因為眾人都犯了罪」（羅5：12）。<\/p>\n<p>因此，我們都在罪惡中出生，「我們生來就是義怒之子」（弗2：3），意思是說，因被剝奪了聖寵，我們天生就是天主的仇敵；我們是墮入罪惡中的受造物。由於亞當所犯的罪，是在創造之初，故稱為原罪。<\/p>\n<p>當亞當與其後裔喪失天主的恩寵時，全宇宙的和諧就破壞了，尤其是人與天主之間的和諧關係。靈魂上的精神官能，對身體的控制也被摧毀；人與人的關係也破壞了。與受造物的和諧也告決裂。最後，人要歸於土，即那用來塑造人的土。死亡從此進入了人類的歷史。<\/p>\n<p>毫無疑問，這些都是恐怖的懲罰，但比起那等著所有人類的最後懲罰：地獄，這只算是小懲罰而已。眾人都因亞當起初違背天主，被判接受這可怕的遺產：出生、受苦、死亡、下地獄。<\/p>\n<p>為何原祖的罪如此嚴重，且導致如此可怕的後果呢？舉個例子：假如一個士兵揍了另一個士兵，他會被關禁閉數天當作懲罰；假如他揍的是中士，就會再多關幾天；假如揍的是上尉，又再多關幾天；而假如揍的是將軍，又會再多關好多好多天。同樣的冒犯，同一位士兵，為什麼關禁閉的天數越來越多呢？因為被冒犯之人的重要性及尊嚴，越來越大。<\/p>\n<p>一切大罪，從某方面說，都是無限大的冒犯，因為冒犯不是以行冒犯的人來衡量，而是以被冒犯的對象來衡量，而在此受到冒犯的，是天主、無限完美的天主。<\/p>\n<p>在起初，亞當與厄娃，只犯了一條罪，造成極其嚴重的後果。<\/p>\n<p><strong>3.<\/strong> <strong>一個陌生人只犯了一條大罪而下地獄<\/strong><\/p>\n<p>假設說，一個陌生人，只犯了一條大罪，不悔罪，不辦告解，最後死了，會不會下地獄？從神學的角度來看，他就會下地獄。這個假設的目的，不是為了討論這樣的事兒會不會發生，而是為了強調大罪的嚴重性，不管所犯的只是一兩條或一千萬條大罪。<\/p>\n<p>處罰與罪過相應。所得罪的對象越偉大，罪過也越嚴重。因為天主無限的尊威，人相反天主所犯的大罪，也有無限的兇惡，所以應受永遠的處罰。<\/p>\n<p>如果人在大罪中過世的時候，沒有悔意，沒有接受天主的慈愛，這表示他借著自由的抉擇，永遠與天主分離。默想這種可能性，是為喚起人的責任，人以永遠的歸宿為目標，該負責地運用他的自由。<\/p>\n<p>為此，我要切記罪的嚴重，以及背叛造物主的兇惡。<\/p>\n<p><strong>4.<\/strong> <strong>聖亞豐索：當罪過到了一定的數量時，天主再也不寬恕<\/strong><sup class=\"fn\"><a href=\"#n-1-04-1\" data-fn=\"1-04-1\">1<\/a><\/sup><\/p>\n<p>有些教父們教導，按照聖經的話，天主：「處置這一切，原有一定的尺度、數目和衡量」<sup class=\"fn\"><a href=\"#n-1-04-2\" data-fn=\"1-04-2\">2<\/a><\/sup>。<\/p>\n<p>他為每一個人決定了生命的天數，健康的程度，以及所賜的能力，因而他也為每個人決定了罪過的數量，超過了數量就不寬恕；數量已滿，他不再赦免罪過。<\/p>\n<p>天主願意治癒那些誠懇地渴望改過自新的人，但不能寬恕固執於惡的罪人。天主寬恕罪人的罪過，但不能寬恕決意冒犯他的人。<\/p>\n<p>你說：「我還年輕。許多人犯過的罪，比我更多」。如果你再犯罪而得罪他，你覺得天主就有義務等你悔改嗎？因此，你要膽顫心驚，不要想到犯一條大罪，特別是如果你曾經犯過大罪。<\/p>\n<p>罪人，不要說：「正如天主曾寬恕過其他罪過，同樣，就算我再犯一條罪，他將再次寬恕」。<\/p>\n<p>你不能保證你能再活一個小時，你還敢說明天就去辦個告解嗎？<\/p>\n<p>天主許諾過要寬恕所有悔改的人，但沒有許諾過為冒犯他的人再等一天。<\/p>\n<p>天主可能再給你時間悔改，也有可能他不給你時間。所以，如果他不給你時間，你的靈魂又將如何呢？<\/p>\n<p>所以，你說什麼，你都下什麼決定？如果你聽完這道理以後，還不要堅決把自己奉獻給天主，我就會為你而痛哭流涕，並把你視為墮落到不可救藥的程度了。<\/p>"}, {"name": "對禱", "html": "<p>「設想我面對懸在十字架上的吾主耶穌，向祂祈禱。我請問祂：怎麼以造物主之尊降生成人，又怎樣以永遠的生命而接受現世的死亡，甚至為我的罪而這般慘死！我再轉看我自己：我為基督做了什麼？現在為基督做什麼？將來為基督應該做什麼？眼看祂這樣被懸在十字架上，儘量激發善情、善念 。」最後念一遍《天主經》。<\/p>"}], "notes": [{"n": "1", "html": "參見：聖亞豐索《On the number of sins beyond which God pardons no more》，講道15。"}, {"n": "2", "html": "智10：21。"}]}, {"id": "1-05", "num": "05", "kind": "默想要點", "title": "自己的罪", "veni": true, "sections": [{"name": "預備經", "html": "<p>求我們的主天主，賞我聖寵，使我的一切意向和行為，都為事奉讚美至尊無對的天主。<\/p>"}, {"name": "定像", "html": "<p>「這裏所要默想的是罪過，便可設想一個幻景：整個的我，好像被放逐在野獸中一樣。整個的我，指我的靈魂和肉身。」<\/p>"}, {"name": "求恩", "html": "<p>「祈求我所願望的；這裏是對我的罪，祈求強烈而深切的痛悔和眼淚」。<\/p>"}, {"name": "默想", "html": "<p>「如果我們說：『我們沒有罪過』，就是欺騙自己，真理也不在我們內。但若我們明認我們的罪過，天主既是忠信正義的，必赦免我們的罪過，並洗淨我們的種種不義」（若一 1：8-9）。<\/p>\n<p>借此默想，聖衣納爵邀請我們明認自己的罪過。<\/p>\n<p><strong>1.<\/strong> <strong>罪過是什麼？<\/strong><\/p>\n<p>罪過是一個違反理性、真理、正直良心的過錯；罪過是因了對某些事物反常的依戀，而欠缺了對天主和近人的真愛。罪過傷害人的本性並傷害人的連帶責任。罪過定義為「違反永恆法律的一句話，一個行動，或一個願望」。<\/p>\n<p>罪過是一個冒犯天主的行為：「我得罪了禰，唯獨得罪了禰，因為我作了禰視為惡的事」（詠 51：6）。罪過是起來違反天主對我們的愛，並使我們的心背向天主。<\/p>\n<p>正是在苦難中，罪惡十分清楚地顯示了它的兇猛及邪惡，正如依撒依亞先知預言過：「他被刺透，是因了我們的悖逆；他被打傷，是因了我們的罪惡；因他受了懲罰，我們便得了安全；因他受了創傷，我們便得了痊癒」（53：5）。<\/p>\n<p><strong>2.<\/strong> <strong>罪過嚴重不嚴重？<\/strong><\/p>\n<p><strong>大罪<\/strong>是嚴重地違反天主的法律，摧毀在我們心內的愛德；大罪是人把低下的美善放在天主之上，背離作為自己終向和真福的天主。<\/p>\n<p>關於<strong>小罪<\/strong>，聖奧思定說：「沒有一個人帶著自己的肉身，在此世度生，能連輕微的罪都沒有犯過；這裏所謂的輕微的罪，你卻不可視為微不足道，因為分別衡量，微不足道，合計起來，心驚肉跳。積沙成塔；滴水成河；粒米成丘。這樣，我們還有什麼希望呢？首先，就是懺悔」。<\/p>\n<p><strong>3.<\/strong> <strong>不斷地犯罪危險嗎？<\/strong><\/p>\n<p>罪過造成犯罪的傾向。若重複同樣行為，就滋生惡習。結果造成邪惡的傾向，蒙蔽良心，腐蝕具體鑒別善與惡的能力。因此，罪過有繁殖和加強的傾向。<\/p>\n<p><strong>4.<\/strong> <strong>只犯小罪的人可以得救嗎？<\/strong><\/p>\n<p>應該說，死在小罪中的人可以得救。但誰能保證，不斷地犯小罪，會有一天不會犯大罪而死呢？因為有些人也許這麼說：「是小罪呢，犯吧，還可以得救！」<\/p>\n<p><strong>5.<\/strong> <strong>罪過侮辱天主嗎？<\/strong><\/p>\n<p>當罪人考慮是否要犯罪的時候，好像手中拿著天枰，衡量天主的聖寵與狂妄的舉動，或一點利益或一點快樂。在他順從誘惑的時候，他做什麼呢？他表示，在他看來，那滴點醜陋快樂的價值，勝過天主的寵愛，因而侮辱天主。他又表示，他看那不幸的快樂，比天主的友誼，還要重要。<\/p>\n<p><strong>6.<\/strong> <strong>天主容忍等待罪人<\/strong><\/p>\n<p>在世上，哪能找到一個人對自己的同伴，如天主對自己的受造物表示如此大的容忍呢？罪人雖然再三再四地得罪了天主，天主仍然耐心地等待罪人回頭。<\/p>\n<p><strong>7.<\/strong> <strong>人人都會死去，繼續犯罪有什麼用？<\/strong><\/p>\n<p>我既然是人，就不得不死。聖西彼廉說：「每一個人一生下來，在頸上已系上了繩索，他短促的生命一時一刻的過去，那條索也一時一刻的加緊絞死他，這就是奪去我們生命的病苦。假如有人幻想自己不會死，那真是癡呆。窮人幻想變成富翁，臣僕幻想南面稱王，那都有可能實現，但古今來有誰敢妄想常生不死呢？有些人老年時死，有些人青年時死，但終究都必須進到墳墓裏去」。那麼，我繼續犯罪，我到底是怎麼想呢？<\/p>\n<p><strong>8.<\/strong> <strong>冒用天主的仁慈<\/strong><\/p>\n<p>魔鬼用兩種方法騙人下地獄。在犯罪以前，借希望得天主的仁慈而鼓勵人犯罪。在犯罪之後，又借天主威脅的公義恐嚇人而使他失望。魔鬼用第一種方法，比第二種方法為多。冒用天主仁慈的罪人常說，天主是仁慈的。但聖母更正確地說：「他對敬畏他的人們，廣施慈愛，千秋萬世」。天主對於怕得罪他的人，世世代代都是仁慈的，但不是對於那妄用他仁慈的人。<\/p>\n<p>天主是仁慈的，但他也是公義的。罪人們只願意天主是仁慈的而不願意是公義的。但這是不可能的，因為天主假如時時寬赦，總不懲罰，那就是有損於他的公義。聖若望雅味拉說：「假如天主憐憫了那些妄用他的仁慈而加重罪惡的人，那不是仁慈，卻是侵犯公義，他應該懲罰忘恩負義的人，他容忍他們一定的限期，但以後懲罰他們」。<\/p>\n<p><strong>9.<\/strong> <strong>人生如夢<\/strong><\/p>\n<p>依撒伯爾皇后，在青年時就死了。聖方濟各·玻爾日亞見到她的屍體就說：「世上的偉大，君主的尊容，竟是如此結束的！」這種思想，使他離開世俗而事奉天主。那時，他說：「我寧願去事奉一個不死不滅的主人」。<\/p>\n<p>作罪過的奴役而事奉魔鬼，有什麼用？繼續不斷地得罪為我而死的天主，有什麼意義？<\/p>"}, {"name": "對禱", "html": "<p>為結束這次默想，特別頌揚天主的仁慈，一面禱告一面感恩，感謝我們的主天主，賜我生活至今；定志賴天主的聖寵，痛改前非。」 然後作三個對禱如下：<strong>第一對禱<\/strong>：先向聖母，求她在她的聖子耶穌我等主臺前，為我求得三事：一、使我深切認清，並憎恨我的罪過；二、使我感覺到自己的行為違情悖理，因而深惡痛絕，矢志改邪歸正；三、使我認清世俗的腐敗，好能真心憎惡，痛絕世俗的種種虛幻。然後念〈聖母經〉一遍。<strong>第二對禱<\/strong>：轉向聖子耶穌，求他在聖父前為我獲得這三樣恩寵。念〈向耶穌聖靈誦〉一遍。<strong>第三對禱<\/strong>：再向天主聖父，懇求永生之光允我所求。念《天主經》一遍。<\/p>"}], "notes": []}, {"id": "1-06", "num": "06", "kind": "默想要點", "title": "地獄", "veni": true, "sections": [{"name": "預備經", "html": "<p>求我們的主天主，賞我聖寵，使我的一切意向和行為，都為事奉讚美至尊無對的天主。<\/p>"}, {"name": "定像", "html": "<p>「用想像力設想地獄是多麼長、多麼寬，多麼深」。<\/p>"}, {"name": "求恩", "html": "<p>「祈求我所願意的；這裏是祈求天主賞我深深地感覺到地獄囚犯所受的痛苦，使我若因自己的過失而忘掉永生之主的愛情時，至少對地獄的怕情，能防止我陷於重罪。」<\/p>"}, {"name": "默想", "html": "<p><strong>1.<\/strong> <strong>私審判<\/strong><\/p>\n<p>「就如規定人只死一次，這以後就是審判」（希9：27）。我們死後，會照我們一生所行的事，經受審判。這是信德的道理。這個關係我們永遠得救或永遠喪亡，這也是當信的信條。<\/p>\n<p>所以我要設想，我現在已快要死，不久要離開世界，到耶穌面前向他交一生的賬。到那時，我所犯的罪過的印象，將是最可怕的事。<\/p>\n<p>如果一個靈魂第一次見耶穌基督時，見他發怒，那個靈魂會感到多麼難過。那時，那個靈魂也知道耶穌為愛它所受的痛苦，它也知道，耶穌施給它如此大的仁慈，賜予它如此多得救的方法，同時它也瞭解：永福的偉大和世俗快樂的卑賤；但可惜它為了卑賤的快樂，竟失去自己，以致於現在永遠喪亡。<\/p>\n<p>它那時會明白這一切，但已經是無補於事了，因為已經沒有時間補贖它的錯誤。它所做的，已經是做了。在受審判時，不衡量人的出生貴賤，也不審問人的地位財富，那時只審判人一生的行為。<\/p>\n<p>凡為愛天主而離開世俗的人，凡不讓五官享受禁止的快樂的人，在死的時侯會感到多麼的快慰；也許有時他們犯了罪，可是他們以後做了相當的補贖。相反地，時常跌入同樣罪過的人，那時會感到多大的痛苦。<\/p>\n<p>他到了臨死時會說，不久以後，我要到我的判官面前受審，但是我還沒悔改遷善。我多次許下悔改，但是總沒有實行，再過一會，我將是怎樣的呢？<\/p>\n<p><strong>2.<\/strong> <strong>地獄感官之苦<\/strong><\/p>\n<p>首先，下地獄的人<strong>記憶力<\/strong>受痛苦。不幸的他，在那個痛苦的深淵裏，不會忘記他一生命曾有多少行善工做補贖的時間，但自己沒有利用，現在再沒有補救的希望了，因此加重了他的痛苦。<\/p>\n<p>他也必定記憶他從天主受了如此多的光照，如此多親切的呼喚，天主許多次賜給他得赦罪的機會，但是他輕忽了這一切。到那時，他明白，為他一切都完了，為他只剩下永遠受苦和絕望。<\/p>\n<p>下地獄的人的<strong>理智<\/strong>，也要受痛苦，因為不斷想到他所任意失去的天堂；幸福的人們，在福樂的家鄉所享受的無窮福樂，時常呈現在他的眼前，這種思想，使他在絕望的監獄中，永遠過的生活是不幸的。<\/p>\n<p>下地獄的人的<strong>意志<\/strong>所受的痛苦，更為劇烈，因為他看見無法達到自己的任何願望，並且必須受他不願受的痛苦。不幸的他，凡他所希望的，在地獄中沒有一件，反而他所忌恨的，卻無一或缺。<\/p>\n<p>他願脫離那痛苦的深淵而尋求平安，但無法尋得，他必須在那痛苦中永遠受苦。他的壞意志，使他感受最大的痛苦，因為一方面要恨自己的天主，同時一方面知道天主是他至大的善，值得無窮的愛。<\/p>\n<p>地獄是一個大<strong>火<\/strong>炕，不幸下了地獄的人，將永遠在那裏受苦，這是一定的。連在世上火燒的苦，在所有的痛苦中，也是最厲害的；但地獄的火，更有磨難人的能力，因為地獄的火，是天主特別做的來懲罰叛逆者用的。<\/p>\n<p>「可咒罵的，離開我到永火裏去吧」。這是天主對下地獄的人的判決。既然在這判決書上特別提及了火，那麼應該說， 他們五官所受的痛苦中，火燒的痛苦應該是最大的。<\/p>\n<p><strong>3.<\/strong> <strong>喪失天主之苦<\/strong><\/p>\n<p>地獄中最大的痛苦，並不是黑暗、臭味和烈火焚燒的疼痛，地獄中最劇烈難當的痛苦，是喪失天主之苦。人的靈魂所以受造，是為了使它與天主結合，並享見他的聖容。天主是靈魂的終向， 是它惟一的善。<\/p>\n<p>因此，若沒看天主，世上的一切快樂，都不能滿足它。所以在地獄中的人，如果能佔有天主，愛天主，地獄以及其他一切痛苦，為下地獄的人，可說變為天堂及榮福，因此，當他們發覺永遠不能享見、愛慕天主時， 這為他們無疑是最大的苦，使他們永遠成為不幸者。<\/p>\n<p>靈魂既是天主所造，自然地傾向與至高的善——天主結合。可是，因為它與肉身結合著，而沉湎於罪惡之中。由於那些吸引五官的對象的阻礙，它不能看見光明，因此對於天主的認識較少，有時達與天主結合的願望，都不會興起。<\/p>\n<p>但當它脫離肉身而遠離可感覺的世物時，它自會明瞭，唯有天主是能使它有福的；因此它一離開肉身，立刻感到一種強烈的力量，吸引它與天主結合，但另一方面，因為離世時缺乏天主的寵愛，就覺得它的罪，有如一條鎖煉系住它，不但阻擋它與天主結合，並且拉它下地獄；在那裏與天主永遠分離。<\/p>\n<p>那時，不幸的靈魂，在那個永遠的火炕裏，會明白天主是如何優美，但它已是永遠無法享見他了。靈魂明白天主是何等可愛，但是它再不能愛他了，而且它的罪還強迫它恨天主。<\/p>\n<p>靈魂知道自己仇恨無限可愛的天主，為它是地獄中最慘烈的痛苦。如果可能的話，它深願消滅自己仇恨的天主，同時恨不得也能消滅為天主仇恨的它自己；這就是這個不幸的靈魂永遠應盡的職務。<\/p>\n<p>靈魂因為知道天主一生賜給它的恩典和對它表示的愛，就異常地加強了它的痛苦。它尤其明白了耶穌基督為救它在流血犧桂時所對它表示的愛，但不知恩的它為了不失去醜陋的快樂，就任意地捨棄了自己的至善——天主，它也明白，再沒有恢復他的希望了。<\/p>"}, {"name": "對禱", "html": "<p>「向吾主耶穌基督對禱時，想想那些在地獄中的靈魂，有的是因為沒有信仰他降生救人的慈愛，有的雖然相信了，卻沒有遵守他的誡命。再把那些靈魂分為三部份：<\/p>\n<p>第一部份是在基督降生以前的；<\/p>\n<p>第二部份是在他生活在世時的；<\/p>\n<p>第三部份是在他逝世以後的。於是感謝他沒有讓我在任何一部份中結束我的生命，而且至今常用良善、慈悲對待我。為結束這次默想，念《天主經》一遍。」<\/p>"}], "notes": []}, {"id": "1-07", "num": "07", "kind": "默想要點", "title": "天主的慈愛", "veni": true, "sections": [{"name": "預備經", "html": "<p>求我們的主天主，賞我聖寵，使我的一切意向和行為，都為事奉讚美至尊無對的天主。<\/p>"}, {"name": "定像", "html": "<p>設想我是比喻中要歸向父親的浪子，或耶穌腳下痛哭的瑪麗亞瑪達肋納。<\/p>"}, {"name": "求恩", "html": "<p>祈求天主能夠感受到天父親切的慈悲。<\/p>"}, {"name": "默想", "html": "<p>我們要把「天主慈愛」的默想分三端：第一端，天主等待罪人；第二端，天主召喚罪人；第三端，天主和悅的接待罪人。<\/p>\n<h3>第一端：天主等待罪人<\/h3>\n<p>慈善是有自然散佈性的，即是有和別人分享自己所有的善的傾向。天主的性體本來是無限美善的。聖良教宗說：「天主的本性是慈善」。所以他極願意把自己的福樂分給我們。天主的傾向並不是懲罰，而是對所有的人表示仁慈。當天主在現世降罰人的時候，他的目的是使他在永世能仁慈對待我們：「天主啊……你曾發怒，不過你也可憐我們。」<sup class=\"fn\"><a href=\"#n-1-07-1\" data-fn=\"1-07-1\">1<\/a><\/sup><\/p>\n<p>他之所以發義怒的原因，即是為使我們醒悟而懺悔我們的罪。「你使你的百姓，遭受了艱難；你使我們飲了麻醉的酒。」<sup class=\"fn\"><a href=\"#n-1-07-2\" data-fn=\"1-07-2\">2<\/a><\/sup>他對我們所施的任何降罰，都是因為他愛我們，並願意我們免受永遠的罰：「你為敬畏你的人豎立旗幟，使他們逃避仇敵的弓箭，為使你所愛的人得救。」<sup class=\"fn\"><a href=\"#n-1-07-3\" data-fn=\"1-07-3\">3<\/a><\/sup><\/p>\n<p>誰能充分地讚美天主對於罪人所表示的仁慈呢？他等待罪人，召喚他，在他回頭的時候容納他。首先當天主等著我們回頭的時候，他必須容忍到什麼時間呢？當我們得罪天主的時候，本來他能置我們於死地；可是天主容忍了我們，他不但不罰我們，且良善地對待我們，天主保留我們的生命，且賜給我們所需要的一切。他佯作不注視我們的罪，為了給我們醒悟的機會：「你佯作不注意人的罪，為使他們改過遷善。」<sup class=\"fn\"><a href=\"#n-1-07-4\" data-fn=\"1-07-4\">4<\/a><\/sup><\/p>\n<p>天主本來不忍看見罪惡，可是他看見許多人犯罪而緘默：「上主！你的眼睛是純潔的，不忍看邪惡……你為什麼垂頭背信的人，當罪人吞噬比他更義的人時，你為什麼緘默？」<sup class=\"fn\"><a href=\"#n-1-07-5\" data-fn=\"1-07-5\">5<\/a><\/sup>他眼看那米色的、復仇的、愛褻瀆他的人，他們逐日增加他們的罪咎，但天主並不降罰他們，為什麼他有這麼大的忍耐呢？「然而上主仍舊等著能向你們施惠。」<sup class=\"fn\"><a href=\"#n-1-07-6\" data-fn=\"1-07-6\">6<\/a><\/sup>天主等待罪人，為的是使他改過遷善，這樣他就可以施給他們寬赦和得救的恩典。<\/p>\n<p>聖多瑪斯說：一切受造物，水，火，大地，氣體，由於他們自然的本性，都請願懲罰罪人，而如此向罪人報復淩辱天主的仇：「一切屬於你的受造物，都激怒而反抗罪人。」但是天主由於仁慈而制止它們。<\/p>\n<p>天主等待我們惡人醒悟回頭，但是他不知道我們這些不知恩的人，會妄用他的仁慈而多得罪他嗎？為什麼天主容忍我們這麼久呢？因為上主「<strong>我決不喜歡惡人喪亡，但卻喜歡惡人歸正，離開邪道，好能生存。<\/strong>」<sup class=\"fn\"><a href=\"#n-1-07-7\" data-fn=\"1-07-7\">7<\/a><\/sup><\/p>\n<p>聖奧斯定見天主這樣過分容忍罪人，就向天主說：「如果你不是天主，我要向你說你不公義。」<sup class=\"fn\"><a href=\"#n-1-07-8\" data-fn=\"1-07-8\">8<\/a><\/sup><\/p>\n<h3>第二端：天主召喚罪人<\/h3>\n<p>讓我們來想想，天主在召喚罪人回頭時所表現的仁慈。當亞當違背了天主的誡命，他就藏起來，以期逃避上主的耳目。但是，天主丟失了亞當以後，去尋找他，且以哀哭的聲音叫喚他說：「亞當，你在哪里？」<sup class=\"fn\"><a href=\"#n-1-07-9\" data-fn=\"1-07-9\">9<\/a><\/sup>天主所說的這些話，有如父親尋找迷失了的兒子一般。<\/p>\n<p>天主許多次對我們表示了同樣的行為。當我們逃避天主的時候，他有時以他的啟發，有時以我們的良心的斥責，有時以我們所聽的道理，有時以困苦以及朋友親屬的死亡來召喚我們：「我因不住的哀號，疲乏無力，我的喉嚨嘶啞。」<sup class=\"fn\"><a href=\"#n-1-07-10\" data-fn=\"1-07-10\">10<\/a><\/sup>耶穌在聖詠上說的這些話，似乎是預想到我們而說的，意思就是：我的兒子，我喊你回頭而累得我啞了喉嚨。聖女大德蘭說：「罪人啊！請你注意，現時召叫你回頭的即是將來要審判你的上主。」<\/p>\n<p>因為我們許多次對天主的召叫充耳不聞，我們本來應該不再受他的召叫了。但是我們的天主卻繼續不斷地召叫我們，因為他願意與我們和好而使我們得救。究竟是誰召叫我們呢？是無限尊嚴的天主。我們究竟是誰呢？我們不過是卑賤的臭蛆蟲！他為什麼召叫我們呢？除了為使我們恢復所喪失的寵愛的生活，他沒有其他目的：「你們回轉心意吧！你們定可生存。」<sup class=\"fn\"><a href=\"#n-1-07-11\" data-fn=\"1-07-11\">11<\/a><\/sup><\/p>\n<p>如果我們為獲得天主的寵愛，必須在曠野裏度過一生的時期，那都不算多的，實際上如果我們願意，借一個在一分鐘所能激發的痛悔，都可以取得天主的寵愛，天主願意把它還給我們，但我們固執地拒絕他。在這種情形下，天主不但沒有放棄我們而且去尋找我們，似乎哀哭著說，我的兒子，為什麼你願意喪亡呢？<\/p>\n<p>當人犯大罪的時候，就是把天主從自己的靈魂裏斥逐出去：「惡人曾向天主說：你離開我們吧。」<sup class=\"fn\"><a href=\"#n-1-07-12\" data-fn=\"1-07-12\">12<\/a><\/sup>但是天主做什麼呢？他卻在那不知恩的人心門外等待著：「你看，我立在門口敲門。」<sup class=\"fn\"><a href=\"#n-1-07-13\" data-fn=\"1-07-13\">13<\/a><\/sup>在那兒有如請求靈魂讓他進去一般，並且他似乎因求進去而感到疲倦。<\/p>\n<p>聖德宜說：「是的，天主有如被輕視的愛者一般，尾隨著罪人，懇求他們別喪失他們的靈魂。」聖保祿給教友寫的信裏也含有這樣的意思：「我們如今代基督請求你們：與天主和好罷!」<sup class=\"fn\"><a href=\"#n-1-07-14\" data-fn=\"1-07-14\">14<\/a><\/sup>在解釋這段經文的時候，金口若望提出一個很美麗的釋義，他說：「基督親自懇求你們，但是他懇求你們什麼事呢？他所懇求你們的事即是求你們與天主和好，因為並不是天主懷恨你們，而是你們懷恨天主。」<\/p>\n<h3>第三端：天主和悅的接待罪人<\/h3>\n<p>「如果你們歸向他，他決不會轉過臉去看你們的。」<sup class=\"fn\"><a href=\"#n-1-07-15\" data-fn=\"1-07-15\">15<\/a><\/sup>凡是回頭改過的人來到天主腳下，天主不會以背向他：「你歸向我，我就收容你」<sup class=\"fn\"><a href=\"#n-1-07-16\" data-fn=\"1-07-16\">16<\/a><\/sup>；「你們歸向我……我必轉向你們。」<sup class=\"fn\"><a href=\"#n-1-07-17\" data-fn=\"1-07-17\">17<\/a><\/sup>當一個罪人回頭的時候，天主以這樣的親切和愛收容他！耶穌以亡羊的比喻，也表示過這種親切的愛，所以當牧人找到了他走失的那支羊的時候：「他歡天喜地的把他扛在肩上，回到家裏；他召集了朋友鄰居來，對他們說：‘你們和我一起喜歡吧，因為我迷失的那支羊找回來了’。」<sup class=\"fn\"><a href=\"#n-1-07-18\" data-fn=\"1-07-18\">18<\/a><\/sup><\/p>\n<p>贖世主又說：「我告訴你們，一個罪人悔改，在天堂上為他也是這樣歡喜。」<sup class=\"fn\"><a href=\"#n-1-07-19\" data-fn=\"1-07-19\">19<\/a><\/sup>救世主把自己對罪人們所有的那種親切的愛和善，在浪子的比喻中表示得更完美。他說自己是那位父親，他看見失去的兒子又回來了：「他離得還遠的時候，他父親就看見了他，他動了憐憫的心，跑上前去，撲到他的脖子上，熱情地親吻他。」<sup class=\"fn\"><a href=\"#n-1-07-20\" data-fn=\"1-07-20\">20<\/a><\/sup><\/p>\n<p>上主更進一步說，如果罪人們懺悔，他就會忘掉他們的罪，有如他們總沒有得罪他一樣：「若惡人離開一切罪惡，回心轉意……他定要生存……他們行的一切惡事，不再被提及。」<sup class=\"fn\"><a href=\"#n-1-07-21\" data-fn=\"1-07-21\">21<\/a><\/sup><\/p>"}, {"name": "對禱", "html": "<p>「向吾主耶穌基督對禱時，想想那些在地獄中的靈魂，有的是因為沒有信仰他降生救人的慈愛，有的雖然相信了，卻沒有遵守他的誡命。再把那些靈魂分為三部份：<\/p>\n<p>第一部份是在基督降生以前的；<\/p>\n<p>第二部份是在他生活在世時的；<\/p>\n<p>第三部份是在他逝世以後的。於是感謝他沒有讓我在任何一部份中結束我的生命，而且至今常用良善、慈悲對待我。為結束這次默想，念《天主經》一遍。」<\/p>"}], "notes": [{"n": "1", "html": "詠59，3。"}, {"n": "2", "html": "詠59，5。"}, {"n": "3", "html": "詠59，6-7。"}, {"n": "4", "html": "智11，24。"}, {"n": "5", "html": "哈1，13。"}, {"n": "6", "html": "依30，18。"}, {"n": "7", "html": "則33，11。"}, {"n": "8", "html": "“Deus meus, pace tua dicam: nisi quia Deus es, injustus esses”（De Vis. inf. l. 1. c. 5.）。"}, {"n": "9", "html": "創3，9。"}, {"n": "10", "html": "詠68，4。"}, {"n": "11", "html": "則18，32。"}, {"n": "12", "html": "約21，4。"}, {"n": "13", "html": "默3，20。"}, {"n": "14", "html": "格後5，20。"}, {"n": "15", "html": "編下30，9。"}, {"n": "16", "html": "耶3，1。"}, {"n": "17", "html": "匝1，3。"}, {"n": "18", "html": "路15，5。"}, {"n": "19", "html": "路15，7。"}, {"n": "20", "html": "路15，20。"}, {"n": "21", "html": "則18，21。"}]}, {"id": "1-08", "num": "08", "kind": "默想要點", "title": "耶穌神國", "veni": true, "sections": [{"name": "預備經", "html": "<p>求我們的主天主，賞我聖寵，使我的一切意向和行為，都為事奉讚美至尊無對的天主。<\/p>"}, {"name": "定像", "html": "<p>這可用想像力，觀看吾主耶穌宣道時，所經過的會堂、市鎮、及鄉村、山坡、海濱等。<\/p>"}, {"name": "求恩", "html": "<p>求我所願望的恩寵。這裏是求吾主耶穌賞我聖寵，使我對他的號召不要裝聾不聽，卻要爽快、勤奮地奉行他的聖意。<\/p>"}, {"name": "默想", "html": "<p>在第二周正式開始之前，聖依納爵願意我們默觀一位世上君王的號召，為幫助我們默觀永遠君王耶穌基督的生活，願意我們「對於他的號召不要裝聾不聽，卻要爽快、勤奮地奉行他的聖意」，幫助他在全世界上建立他的神國。為此，這默觀通常稱為「神國默想」。<\/p>\n<p>在神國默想中，我們可以注意到兩點：傳教神火，以及棄絕自己。<\/p>\n<p><strong>1.<\/strong> <strong>傳教神火<\/strong><\/p>\n<h3>神國默想的意義是什麼？<\/h3>\n<p>耶穌基督——真天主真人——是天主與人間的唯一仲介，是人類在天主前的唯一司祭，是人類的救主，是奧體的元首，是超性真理的啟示者，是我們靈魂的生命與淨配。但聖依納爵還要我們默觀耶穌基督是我們的君王。天主是我們的主宰，我們是天主所造，又是耶穌基督所拯救的，我們應該事奉天主，應該奉耶穌做我們的君王，應該聽從他的召喚，為他的神國出力工作。<\/p>\n<p>聖依納爵對於神修生活的基本觀念，是為愛天主而給天主忠誠服務；所以他對於耶穌基督的基本態度，也自然是奉他做君王，幫助他建立神國，何況耶穌自己明明宣佈自己是君王，甚至他被判死刑的官方原因，是因為他承人自己是人類的君王，而在他釘死的十字架上，也寫著這君王的稱號。二千年來，聖教會也常在稱耶穌為君王。<\/p>\n<p>聖依納爵神操的基本教訓，是要我偕同耶穌貧窮吃苦受辱，因而真正地光榮天主，事奉天主，為耶穌的教會，以及靈魂的得救服務。這實在是艱苦的工作。我們唯有存想這貧窮吃苦受辱，甚至釘死在十字架上的耶穌，原來是天主聖子，現今在天堂上做「榮光之王」，他實在是宇宙萬物的主宰，是我們人類、尤其是我們基督信徒的君王。這「耶穌君王」的觀念，不單使我們在默想耶穌的貧窮吃苦受辱的時候，驚奇他的為我們而甘心如此的深恩大愛，更可使我們在自己為耶穌而貧窮吃苦受辱的時候，振作精神，勇氣百倍，歡欣踴躍，甚至不怕犧牲性命。<\/p>\n<h3>神國默想的重要性是什麼？<\/h3>\n<p>神國默想可說是全部神操的中心，是聖依納爵在茫萊撒（Manresa）所獲得的中心思想，也是將創立耶穌會的種子，更是幾乎五百年來神操傾動了無數人，在修會生活中，在世俗地位上，跟隨基督，幫助他建立神國的偉大力源。<\/p>\n<p>神國默想，人們公認是神操第二周的基礎，實則是第二、三、四周的基礎。因為這三周，都是默觀吾主耶穌的生活，甚至聖依納爵在一個月的神操中，把神國默想的一天，不計算在第二周內，也暗示了它的效用不限於第二周。<\/p>\n<p>我們可以更進一步說，「原則與基礎」是神國默想的一種準備。我們要讚美、崇敬、事奉天主，我們要實現人生宗向，必須因著耶穌，偕同耶穌，在耶穌內，就是奉耶穌做我們的君王，聽從他的召喚，奉行他的旨意，效法他的表樣，幫助他建立神國。這才是基督徒的宗向，真真實實的人生宗向；不是在黑暗中摸索的人生，在歧路上彷徨的宗向。甚且對於健康或疾病，財富或貧窮，榮耀或侮辱的保持平心，也只是消極地準備我們的切願偕同耶穌貧窮吃苦受辱。所以，不是原則與基礎使神國默想獲得了價值，而是神國默想，使原則與基礎的道理，提拔到超性的境界。<\/p>\n<p>從另一方面說來，我們在神操的第一周中，痛悔了罪過，獲得了赦免，因此深深感激耶穌的拯救大恩，查問我自己將來為耶穌該做什麼。神國默想，就是這個問題的答案。我們該詢問耶穌：「你要我為你做什麼？」誰也不可逞自己的私意，不管他的聖意，為他做些他所不希望、不願意的事。換句話說，我們只該聽從耶穌的召喚，完成他的至聖意志，幫助他建立神國。<\/p>\n<p>全部神操的目標，是除去自己的一切錯亂心情，尋覓並獲得天主的聖意，因而處置自己的生活。我們在第一周中，認識並痛恨了我們的一切錯亂心情，現今可怎樣尋覓天主的聖意呢？天主聖父清楚表示的聖意，是叫我們聽從耶穌：「這是我鍾愛的聖子，你們該聽從他」。為此，我們聽從耶穌的召喚，效法耶穌的表樣，也就最穩妥地正確地獲得了天主的聖意。我們在這第二周中，要處置自己的生活，要選擇（或確定）人生地位，要解決重大問題，要整理生活；實際上，也就是自由自主地聽從耶穌的召喚，爽快勤緊地奉行他的聖意，在某種地位上，跟隨他，在某項生活情形中，效法他，可見這神國默想，真是全部神操的中心思想。<\/p>\n<h3>神國默想的概況是什麼？<\/h3>\n<p>聖依納爵用了一種特殊的方式，寫他的神國默想。他拿一位世上的君王做陪襯、把這默想分作兩部分：先默想了世上君王的比喻，然後默想耶穌君王的事實。但開始的兩個前導，以及最後的對禱，都是丟掉了比喻中的世上君王，集中在吾主耶穌身上。<\/p>\n<p>第一部分：一位理想的世上君王。第一端，設想我眼見一位理想的世上君王，受到天主的揀選，受到眾人尊敬、服從。第二端，聆聽這位君王的話，他號召人們幫助他征服全世界，條件是分擔了他的勞苦，也分享他的勝利。第三端，存想那良好的屬下，一定要接受那位君王的號召，誰不接受，就該受眾人的譴責。聖依納爵效法耶穌宣講福音的方式，用比喻來講明真理。這比喻的動機，無疑地，是聖人自己的生活和理想：他的騎士精神，使他希望遇到這樣的一位理想君王，準備給他忠誠服務。<\/p>\n<p>這比喻，的確可以準備聽眾的心理，容易接受耶穌的號召；可以激發聽眾的熱忱，興奮地跟隨耶穌。因為這樣的理想君王，在世上找不到，在耶穌身上，卻完成實現了。不聽從這位世上君王的號召，是怯懦，是不合理，是可恥可責；不聽從耶穌的召喚，將更是卑鄙怯懦，更是不合理，可恥可責。<\/p>\n<p>第二部分：耶穌基督的召喚。第一端，耶穌召喚全世界，更個別地召喚我跟隨他去征服全世界，幫助全世界的人類恭敬天主；條件也是和他一同勞苦工作，將來和他一同享受光榮。第二端，存想「凡判斷正確，理智清醒的人，必定獻身勞苦工作」。第三端，「誰若願意有更大的愛情，在事奉永生之王、萬有主宰的事上與眾不同；不但甘願獻身服務，且要攻打自己的貪欲，割斷血肉和世俗的私愛，作更有關系和更有價值的奉獻」，更是切願效法耶穌「承受一切淩辱、反對，忍受一切實際的和心靈的貧窮；只要你的至聖尊威選擇我、收納我，在這樣的生活和地位上」。<\/p>\n<p>結束這默想的對禱，就是在聖母和天朝眾位聖人聖女的鑒察下，這樣把自己奉獻給君王耶穌。<\/p>\n<h3>神國默想與傳教<\/h3>\n<p>無疑地，神國默想，是為鼓勵我們幫助耶穌建立神國，是為激發我們的傳教神火。聖依納爵清楚提出：吾主耶穌的意志，是征服全世界，是得勝了魔鬼和它的徒黨，引領眾人恭敬天主，救己靈魂；吾主耶穌的召喚，是願意我們跟隨他，一同做傳教勞苦的工作，幫助他建立神國。<\/p>\n<p>奉行第二周神操的人，都是有資格的人，是有「判斷正確，理智清醒的人」，在這神國默想中，也都受到耶穌的召喚，都該接受這召喚，慷慨地完全奉獻自己，為幫助君王建立神國，為傳教而勞苦工作。不論將來選擇的，或已經選定的，是什麼地位——的確，所有基督徒，應該按照自己的地位和能力，發展榮主救人的神火，實行傳教工作。<\/p>\n<p><strong>2.<\/strong> <strong>棄絕自己<\/strong><\/p>\n<p>神國默想提醒我們聽從君王耶穌的召喚，幫助他建立神國，做傳教工作，這原是容易明白的事。聖依納爵神國默想的特點，更是提醒我們，要幫助耶穌傳教，先該棄絕自己。耶穌早已清楚說過：「誰若願意跟隨我，該棄絕自己，背著自己的十字架來跟隨我」（瑪16：24）。棄絕自己，真是重要。不幸，人們不喜歡這樣的話，因而不去注意。<\/p>\n<h3>話語的解釋<\/h3>\n<p>聖依納爵說：「誰若願意有更大的愛情，在事奉永生之王、萬有主宰的事上與眾不同；不但甘願獻身服務，且要攻打自己的貪欲，割斷血肉和世俗的私愛，作更有關系和更有價值的奉獻」。<\/p>\n<p>我們正確地明白了這幾個名詞的意義，也就容易明白，為什麼聖依納爵在這神國默想中，格外注重棄絕自己的工作。<\/p>\n<h3>反攻自己<\/h3>\n<p>仇敵來攻打，我抵抗；不來攻打，我就聽它自然；這不是反攻，這也一定不能得勝仇敵。仇敵來攻打，失敗了，我追上去攻打；即使它不來攻打，我也要尋找它；這才是反攻，才能得勝仇敵。聖依納爵的軍事知識，熟悉這一點；所以他叫我們反攻自己，反攻我們的錯亂心情，這最難得勝的仇敵。我不該等那些錯亂心情發動了，引誘我犯罪，擾亂我的心靈，妨礙我修德行善，我才去抵抗；我必須尋找這些錯亂心情，把它們糾正，把它們克除；我必須反攻自己。<\/p>\n<h3>反攻自己感官的貪愛<\/h3>\n<p>這兒所說的感官貪欲，不該是那引誘我犯大罪的種種私欲偏情；因為那些有重大關係的罪根，早該在第一周中加以深切的痛恨，定志努力拔除。這感官貪欲，該是指我們在感官方面尋找若干舒適和享受。這樣的舒適享受，能夠是合理的，無罪的；可是，誰若效法耶穌而慷慨犧牲，一定是更好。一個從事傳教工作的人，反攻自己的感官貪欲，毫不依戀生活的舒適，以及身體的種種享受，即使遇到了機會，也慷慨犧牲，以便能夠真正地、多多地為建立神國而勞苦工作。如果他依戀舒適的生活，以及物質方面的享受，他就不可能為耶穌而勞苦工作。專為聖教會服務的神職人員，誓願貧窮刻苦的修士修女，當然更需要反攻這樣的感官貪欲。<\/p>\n<h3>反攻自己血肉的貪愛<\/h3>\n<p>那拉扯我犯出污穢醜陋大罪的淫欲，更該是早已在第一周中加以痛恨，定志拔除。這兒所說的血肉的貪愛，該是指那對於家人親族的過分愛惜。原來愛惜家人親族，在正當合理的限度內，是正當合理的事，甚且可能是正義或仁愛的義務。可是，誰若憑著血肉的見解或情緒，過分愛惜家人親族，而不肯離開家人、國家，就不算是聽從耶穌的命令：你們往普天下去，宣講福音。聖奧斯定說：所有宣講聖言者，乃是聖言之聲，我們對家人親族的愛惜，不應該限制聖言之聲，不應該讓傳教使命，深受影響。<\/p>\n<h3>反攻對世俗的貪愛<\/h3>\n<p>這世俗的貪愛，也不該再指那引我們犯大罪的錯謬觀念和虛假事情，只該是指對於那些正當合理的榮耀、名譽、尊位、權力等的過分的、不合理的貪圖。我們為著超性本性的正當合理的緣由，僅可取用正當合理的方法，保護自己的種種權力，更尋求向上發展。可是，我們對於這些世俗所看重的事情，很容易越出了正當合理的範圍，貪圖它們，甚至取用不正當不合理的方法，去尋求、去爭取。魔鬼破壞基督神國最得意的詭計，就是誘惑傳教士，借著傳教工作，尋求自己的榮譽、名譽、尊位、權力等，以致傳教士自己的勞苦工作，再也不是幫助耶穌建立神國的傳教工作，甚至他嫉妒他人的傳教工作，加以誹謗，加以破壞，爭權奪利，排擠傾軋，擾亂聖教會的平安團結。所以我們必須反攻這世俗的貪愛，把那些正當合理的榮耀、名譽、尊位、權力等等，也慷慨捨棄，為能真正地幫助君王耶穌建立神國。<\/p>"}, {"name": "對禱", "html": "<p>為結束這次默想，我們可以用「萬物的永生主宰」的經文來作對禱。「萬物的永生主宰，我賴你的恩寵助佑，在你的無窮美善前，及你光榮之母和天朝聖人聖女們的面前，做此奉獻，並鄭重聲明，只要更能事奉你、讚美你，我真心願意，滿心切望，效法你承受一切淩辱、反對，忍受一切實際的和心靈的貧窮；只要你的至聖尊威選擇我、收納我，在這樣的生活和地位上」<sup class=\"fn\"><a href=\"#n-1-08-1\" data-fn=\"1-08-1\">1<\/a><\/sup>。<\/p>"}], "notes": [{"n": "1", "html": "神操書，98。"}]}, {"id": "1-09", "num": "09", "kind": "默想要點", "title": "道成肉身", "veni": true, "sections": [{"name": "預備經", "html": "<p>求我們的主天主，賞我聖寵，使我的一切意向和行為，都為事奉讚美至尊無對的天主。<\/p>"}, {"name": "定像", "html": "<p>記得我要默想的歷史。這裏是設想天主三位俯視滿布人類的世界廣大區域，看見眾人都走向地獄，便從永遠決定了天主第二位降生成人，為拯救人類。因此，時期一到，便派遣天使加俾額爾來拜訪聖母瑪利亞。觀看地點：這裏是觀看地球的廣大面積，居住著那麼多、那麼複雜的民族；然後特別觀看加裏肋亞的納匝肋聖母所住的房屋和住室。<\/p>"}, {"name": "求恩", "html": "<p>祈求我所願望的。這裏是求天主賞我深深地認識為降生成人的吾主耶穌，為能更加愛慕祂、追隨他。<\/p>"}, {"name": "默想", "html": "<p><strong>1.<\/strong> <strong>降生默觀的關係<\/strong><\/p>\n<p>我們既然決心跟隨君王耶穌，那麼，我們先該仔細認識我們的君王。我們需要從歷史方面，正確地認識君王耶穌的來歷。<\/p>\n<p>信德告訴我們，耶穌基督是天主聖子降生成人。所以，吾主耶穌的歷史，不像普通人的從誕生開始，而是從天主聖子的誕生開始。我們默觀他的種種奧跡，默觀他的貧窮吃苦受辱，常該記起他是人，也是降生的天主聖子；他有天主性的無窮美善、無限尊威，他常該受到我們的欽崇；他的貧窮吃苦受辱，甚至釘死在十字架上，都是出於甘心情願，為顯示他的上愛天主，下愛眾人，為奉行天主聖父的旨意，為拯救我們犯罪墮落的人類。<\/p>\n<p><strong>2.<\/strong> <strong>擴展視線提高心神<\/strong><\/p>\n<p>路加福音記載降生的奧跡，只是在納匝肋的天神來報聖母的一幕。聖依納爵發揮這降生默觀，卻擴展視線，追溯到降生以前的人類的悲苦境遇，追溯到天主聖三的永遠計畫。他叫我們睜眼觀看地球上，前古後今的一切人類，怎樣彼此相仇相害，走向地獄。他更叫我們提高心神，默觀到納匝肋的聖家，聖母和天神，默觀到無限尊威的天主聖三。這樣，他啟示了我們，默觀吾主耶穌的奧跡，不該只是見到這奧跡的表面人物和行為；更該看到天主的至聖意志和永遠計畫，看到吾主耶穌的天主性，看到這些人物的內心情緒，這些行為的超性價值。因此，我們的默觀，可以不單資料豐富，興趣深厚，甚且更符合事實的真相，更容易採取高超深刻的教訓。<\/p>\n<p>聖依納爵在這默觀的發揮中，著力描繪世界上無數人的可憐情形：戰爭、哭泣、疾病、死亡，在昏盲中生活，更咒罵天主，彼此毆打殘殺，終於墮入地獄。另一方面，他提出天主聖三怎樣垂憐人類，怎樣決定拯救，怎樣成為降生奧跡；他又提出聖母和天使，怎樣奉行天主的聖意，襄助降生奧跡的成就。無疑地，聖人願意我們明白，人類的迫切需要拯救，天主的切願拯救人類，以及我們的幫助吾主耶穌拯救人類的職責；因而我們重新慷慨大量地，奉獻我們自己，為建立神國而勞苦工作，更努力反攻自己。<\/p>\n<p><strong>3.<\/strong> <strong>第二周的求恩<\/strong><\/p>\n<p>聖依納爵在這降生默觀的第三前導中，叫我們祈求的恩寵是「深深認識這為我而降生的主耶穌，為能更加愛慕他，並且跟隨他」。這求恩常是深深地認識他，熱烈地愛慕他，勤緊地跟隨他，且是第二周每次奧跡默觀的目標。<\/p>\n<p>我們默觀吾主耶穌的奧跡，首先是為深深地認識他。這認識，不是書本中的認識，不是尋求抽象的知識，也不是作學術性的研究；更是活的認識，因著聖寵的光照和助佑，和吾主耶穌親密晤對的認識。這認識，不只是認識吾主耶穌的外表，聆聽他的言語，觀看他的容貌，注釋他的動作；更是認識他的天主性和人性的種種美善及德行，認識他的聖心，他的愛情，他的思想，他的意願；尤其是認識他和我的關係，他為我所受的苦，為我所做的事，加給我的種種恩惠，向我表示的愛情，對於我的種種意願、種種希望，對於我的召喚。這樣的深深認識，一方面必須吾主耶穌自己賞賜，所以我們應該懇切祈求這大恩寵；另一方面，也必須我們自己努力，就是在默想中深深地時常默觀他。<\/p>\n<p>我們的理智深深地認識了耶穌，我們的情感自然要熱烈地愛慕耶穌。可是，真正的愛德，不只在動情，「愛情不在空言，應在事實上表現」。所以，我們的意志，要勤緊地跟隨耶穌，也就是忠信地效法耶穌。這跟隨和效法，就是聽從他的召喚，奉獻自己為幫助他建立神國而勞苦工作，也就是效法他，偕同他貧窮吃苦受辱，因而完成他的至聖旨意，為光榮天主，拯救人類，而征服全世界的崇高偉大的意志。<\/p>\n<p><strong>4.<\/strong> <strong>道生會規中的降生奧跡<\/strong><\/p>\n<p>[36] <strong>前言<\/strong>：我們的靈修要紮根於降生成人的神聖奧跡—— 聖言於至聖童貞瑪利亞的胎中成了血肉。因此可以說，我們的靈修衍生自聖言的位格及他的母親，如此，我們在聖神內，能與聖父結合。本會靈修生活的所有原則，一如在靈修指引書所述，出自對降生聖言奧跡的詮釋。<\/p>\n<p>[37] <strong>耶穌基督的優先性<\/strong>：在我們的生命及行動中，要活出並以「納匝肋耶穌，天主子的名字、教訓、生活、許諾、天國及奧跡」為先，不把任何事物置於基督之上。<\/p>\n<p>[38] <strong>聖言位格的先存性<\/strong>：借著宣認至聖聖三第二位格的永恆性、區別和天主性，我們願意培養我們對完全交付於天主喜悅意志的願望，以及對聖三與天主按自己肖像和模樣所造的人類之愛。<\/p>\n<p>[39] <strong>聖言降生成人的奧跡<\/strong>：他的初次來臨—— 因聖神在瑪利亞胎中完成，要使我們完全馴服該聖神，以及深愛瑪利亞—— 耶穌和我們的母親。基於由聖神在童貞瑪利亞內所完成的降生奧跡，我們要永永遠遠歌詠上主的仁慈，因為「永福的不朽性，借由天主子的降生變得可信」。我們要明瞭，沒有耶穌基督，我們什麼也不能作，我們也要盡全力在德行上日益成長。<\/p>\n<p>[40] 耶穌是通往天父那裏的「道路」，除非經過他，誰也不能到父那裏去。只有他的名字，使我們賴以得救。他使教會成為「一件聖事，就是說教會是與天主親密結合，以及全人類彼此團結的記號和工具」。他是教會所有信理的支柱，因為他是「包含一切真理的真理」。他向我們表明，永生的優先性與價值，遠超塵世的一切。認識到耶穌是真天主，要推動我們實踐信、望、愛三超德，並重視祈禱生活，以及主動和被動淨化心身的需要。成為人是「耶穌首要的奧跡」。「就在降生奧跡的那一刻，天主從未與人這般親近，人也從未與天主這般親近。」認識到耶穌是真人，要推動我們明瞭沒有任何真正屬人性的事，將對我們陌生，若我們能夠攝取之；在他內，愛整個人及所有的人，並實踐舍己犧牲的德行。認識到在他內不可分的兩個性體， 要推動我們發現恩寵與本性的雙重事實，毫無混淆；實踐看似相反的德行， 以高級的攝取低級的，因而不陷入虛假的二元論；並追求愈顯主榮，拯救人靈，即道成肉身的目的。<\/p>\n<p>[41] <strong>他的世間生活<\/strong>：從降生成人起，他給我們立了司鐸般委身於天父的榜樣， 以效法他。借共融的原則，我們已存在於瑪利亞胎中：他教導我們依靠他的母親。借他的隱居生活，他教導我們成長、工作、靜默、受管轄，以喜慶之心而生活。他的一切語言和行動養育我們的靈修。<\/p>"}, {"name": "對禱", "html": "<p>在這默觀的對禱中，聖依納爵叫我們追隨、效法為我降生成人的耶穌。這是提醒我們牢記，默觀吾主耶穌的奧跡，不是追想過去的事，而是打破時間空間的距離，參與這神聖的奧跡。所以，聖人邀請我們，尋思我對天主聖三，降生成人的永恆聖子，以及聖母瑪利亞該說些什麼。按照心中的感想，祈求幫助我更能追隨、效法降孕的救主。念「天主經」一遍。<\/p>"}], "notes": []}, {"id": "1-10", "num": "10", "kind": "默想要點", "title": "兩旗默想", "veni": true, "sections": [{"name": "預備經", "html": "<p>求我們的主天主，賞我聖寵，使我的一切意向和行為，都為事奉讚美至尊無對的天主。<\/p>"}, {"name": "定像", "html": "<p>「<strong>歷史<\/strong>：這裏可設想基督號召眾人，願他們都隸屬於自己的旗下；對面，路濟弗爾也號召眾人歸順它的旗下。<strong>定像<\/strong>：這裏可設想在耶路撒冷有一個廣場，是善人的最高領袖耶穌基督我等主的大本營；再看巴比倫地帶，是人類仇敵路濟弗爾的營地」<sup class=\"fn\"><a href=\"#n-1-10-1\" data-fn=\"1-10-1\">1<\/a><\/sup>。<\/p>"}, {"name": "求恩", "html": "<p>「祈求我所願望的；求天主賞我認清魔鬼的詭計，幫助我防備。另一方面更求天主賞我認清真正的最高領袖所指示的真生命，並賞我恩寵，好能效法他。」<sup class=\"fn\"><a href=\"#n-1-10-2\" data-fn=\"1-10-2\">2<\/a><\/sup><\/p>"}, {"name": "默想", "html": "<p>聖人把這默想分做兩部分，每一部分又分做三端。<\/p>\n<h3>第一部分：默想魔鬼的旗幟<\/h3>\n<p><strong>第一端<\/strong>：設想那仇敵的頭目，坐在巴比倫的高大陣地上，好像坐在冒出火焰的座位上，面目猙獰可怕。<\/p>\n<p><strong>第二端<\/strong>：想像它怎樣召集了無數的魔鬼，怎樣派遣它們到世界各城鎮去，沒有漏掉一村一鎮，也沒有任何身分或個人被遺漏的。<\/p>\n<p><strong>第三端<\/strong>：聽聽它怎樣向牠們演講，教它們向人們拋投羅網、鎖鏈，誘惑他們貪財，再使他們陷在虛榮裏，因而大起驕傲之心。所以第一步財富，第二步是尊榮，第三步是驕傲。由這三步引人陷入其他一切惡習中。<\/p>\n<h3>魔鬼詭計的第一步：財富<\/h3>\n<p>魔鬼詭計的第一步，是誘惑人貪圖財富，開始誘惑人只貪愛那正當合理的財富，只取用那正當合理的方法；可是這樣的人，不知不覺之中，過分注重財富的獲得。漸漸地，魔鬼誘惑人貪圖那不正當不合理的財富，不怕取用那不正當不合理的方法去尋求，以致犯出了許多違反正義和仁愛的罪過。<\/p>\n<p>即使那財富的獲得，絲毫沒有不正當不合理之處，有了相當的財富，自然而然地，在勢力社會中，受到人們的尊榮，滿足他「世俗的貪愛」。他有了相當的財富，又可隨意滿足他「感官的貪欲」，度著很舒適的生活，享受種種物質幸福；更可滿足那「血肉的貪愛」，他不再反攻自己；他的傳教工作，勢必鬆弛懈怠。<\/p>\n<p>佔有財富的人必須慎防魔鬼的這第一步詭計。那麼矢發神貧願的可以放心嗎？不可以，他也要小心謹慎。魔鬼也能誘惑他在名為實際貧窮的生活中，尋求日常的舒適，貪圖若干比較微小的財富，漸漸地也能受貪圖財富的大害。甚且他無法貪圖有形的財富，魔鬼也能誘惑他貪圖無形的財富，權利、勢力、事業、工作、名譽、學問等，因而使他受到他人的尊榮，並陷入了驕傲的大惡。<\/p>\n<h3>魔鬼詭計的第二步：尊榮<\/h3>\n<p>魔鬼誘惑人，獲得了相當的財富，就進而誘惑他貪圖尊榮。聖依納爵清楚瞭解這勢力社會的作風。比如說，一個人可能開始會把尊榮歸於天主，可是魔鬼可誘惑他漸漸地忘掉了天主，為自己而喜愛尊榮，貪圖尊榮。他開始只喜愛那正當合理的尊榮，只取用那正當合理的方法去尋求；可是漸漸地魔鬼誘惑他貪圖那不正當不合理的尊榮，不怕取用那不正當不合理的方法尋求。尊榮迷住了他的心；他滿心是「世俗的貪愛」，卻還想自己是在為天主而工作；一切傳教工作，在他手中成了他貪圖自己尊榮的工作，再也不能產生真正的榮主救靈的效果。<\/p>\n<p>矢發絕財絕意聖願的人，做一個手無分文的修士修女，也該小心謹慎魔鬼的這一步詭計。我們說過：他們能夠陷入那貪圖財富的詭計，也就能夠進而貪圖尊榮。他們能夠在小小的生活圈子中，在修會團體內，貪圖若干尊榮，嫉妒他人所受的尊榮，加以排擠陰損，或更貪圖修會中的顯要職位，妄用這些職位來尋求自己的尊榮。甚且他們能夠有了一些無形的財富，受到了若干人們的尊敬，因而陷入貪圖尊榮的誘惑。他們矢願偕同基督謙遜受辱，卻又墮入魔鬼的詭計，尋求自己的尊榮，真是更加可恥可惜。<\/p>\n<h3>魔鬼詭計的第三步：驕傲<\/h3>\n<p>享受尊榮的人，漸漸地，甚或很快地，陷入魔鬼詭計的第三步，陷入這顯然是罪惡的驕傲。他只見自己的尊榮，不再想到天主的光榮；他更把自己的尊榮放在一切之上，把自己放在天主之上。他再也不管正當不正當，合理不合理；他取用一切的方法尋求一切的尊榮。他得不到所尋求的，就發愁發怒，就焦急憤恨，就記仇報復，就設法打倒。他在傳教工作中，明顯地，再也不肯服從聖教會的指揮，再也不是為天主而工作。甚至如果遇到了重大事情，他不怕反抗聖教會的權威，不怕和聖教會分裂。他驕傲反叛了天主，也就成了魔鬼破壞天主神國的有力工具。<\/p>\n<p>聖依納爵說：「由這三步引人陷入其他一切惡習中」。這樣的人，雖然曾經痛恨了一切罪惡，一切私欲偏情，雖然曾經決心跟隨耶穌，幫助他建立神國，可是他如果不幸陷入了驕傲，喪失了天主的寵愛，被「七個更厲害的魔鬼」占住了他的心（參：瑪12：45），勢必他以前所曾經痛恨的私欲偏情，都要重新發作；他不單重新犯出以前的罪惡，甚且犯出更多更大的罪惡。<\/p>\n<h3>第二部分：吾主耶穌的旗幟<\/h3>\n<p><strong>第一端<\/strong>：設想在耶路撒冷的廣場上、吾主耶穌站在謙卑而美麗、可愛的地方。<\/p>\n<p><strong>第二端<\/strong>：設想這位普世的主宰，怎樣選擇許許多多的人，做祂的門徒弟子；派遣他們到世界各地去，向各種身分、各種境遇的人散佈神聖的道理。<\/p>\n<p><strong>第三端<\/strong>：聽聽吾主耶穌怎樣對祂的僕人和朋友們，在派遣他們出征時所作的訓話。祂囑咐他們去幫助所有的人，第一愛慕神貧，甚至如果天主的尊威願意揀選的話，達到實貧；第二引人甘願受輕慢、淩辱。因為由這兩件事（貧窮、淩辱），自然就產生了謙虛。所以這裏也有三個階段：第一階段是以貧窮對財富；第二階段是以輕慢、淩辱對世俗的尊榮；第三階段是以謙遜對驕傲。由這三個階段，引領人進修其他德行。<\/p>\n<h3>基督聖道的第一步：貧窮<\/h3>\n<p>魔鬼詭計的第一步是財富，耶穌聖道的第一步是貧窮。聖依納爵把這貧窮分做兩種，一種是內心的貧窮，另一種是實際的貧窮。<strong>內心的貧窮<\/strong>，就是雖然享有財富，或至少可能享有財富，卻在心中喜愛貧窮，毫不貪圖財富，更努力度節儉的生活，自動體驗一些貧窮的效果；這也就是普通所謂的神貧。<strong>實際的貧窮<\/strong>，就是缺乏財富，缺乏那物質生活的必需品，無法享受那相當舒適的生活，實實在在地成為窮人；或是自願自動地捨棄所有的財產，放棄那獲得財富的權利，甚至矢發神貧聖願，甘心終生做一個手無分文的窮人，以前所獲得的都交給修會，一切所需要的都謙遜地向修會乞求。這實際的貧窮，自然該有內心的貧窮，做它的靈魂，才是真正的德行，才有超性的價值。誰若缺乏生活必需品而內心貪圖財富，那就不是這兒所說的實際貧窮的德行。誰若說或想自己喜愛貧窮，卻不肯親身體驗一些貧窮的效果，也只是空說空想的貧窮，並不是這兒所說的內心的貧窮、神貧的德行。<\/p>\n<p>我們應該切願有這內心的貧窮，應該懇求天主賞賜；因為誰沒有這內心的貧窮，就不能有平心，又不能善用受造物，就很容易地陷入魔鬼的詭計而貪圖財富。可是對於實際的貧窮，對於那些還沒有選擇終身地位的人，聖依納爵只叫他們有條件地切願並祈求它。<\/p>\n<p>益處：貧窮使我們在日常生活中，有許多克己刻苦的機會，因而多多修德立功。貧窮使我們習慣吃苦耐勞，因而容易為基督的神國勞苦工作。貧窮使我們不求物質的報酬，純心為天主而從事傳教。貧窮使我們不依靠自己，全心依靠天主而實行偉大的傳教工作。貧窮使我們不依賴他人，不依賴有錢的人，因而在宣講福音中，不怕向眾人提出天主的誡命，斥責財富的禍害。<\/p>\n<p>貧窮的益處，就是幫助我們達到耶穌聖道的第二步，即受辱。<\/p>\n<h3>基督聖道的第二步：受辱<\/h3>\n<p>耶穌聖道的第二步是受辱，與魔鬼詭計的第二步，即貪圖尊榮對立。<\/p>\n<p>聖依納爵舉出的例子，在神國默觀中，是一切淩辱及反對。在這兩旗默想中，是輕慢及淩辱。在謙遜三級默想中，更添上「被人視為輕狂、昏愚」。受辱的種類、等級和程度，當然有所不同。甚且加給侮辱的人，不單是那無知識的、勢力的、邪惡的、兇暴的人們，甚且也能是比較善良的人，是同居共事的人，是神形方面的長上。他們加給侮辱的動機，能是出於惡意，能是出於無意或誤會、甚且能是出於他們主觀的善意。我們也可以說，聖人所叫我們切願的侮辱，更該是從他人的無意或誤會、他人的主觀善意而來的侮辱，因為在這樣的情形中，可能沒有誰的罪。為此，我們不單該安心忍受惡人仇人的侮辱，更該安心忍受善人友人甚至長上的譴責、慢待、攻勢、侮辱。至於我的罪過所招來侮辱，雖然我也該安心忍受，但不是這第二步的正式目標；因為這能夠為天主的神聖尊威，惹起若干厭惡。<\/p>\n<p>受辱原是一種不幸，一種恥辱。我們的本性當然不能歡迎。受辱的反應，也當然是憤怒、怒恨、記仇、報復、至少是羞慚、愁悶、灰心敗興、擾亂不安。所以必須有天主聖寵的聖化，我們才能得到受辱的益處。<\/p>\n<p>益處：就是幫助我們達到耶穌聖道的第三步，即謙遜。我們受了辱，也就無法在人前驕傲；也就認識了世俗的猙獰面目，不再貪圖它的虛榮；更認識了自己的虛無、拙笨、惡劣、認識了自己的許多缺點、許多過失。我們受了辱，覺得心中憤憤不平，擾亂不安，因而在天主臺前，不得不承人自己還沒有真實的德行，真實的謙遜；因而不致自己欺騙自己，不致受人的欺騙，受魔鬼的欺騙，避免了驕傲的大惡。<\/p>\n<p>受辱不單為我們自己，甚至為我們的傳教工作，因著天主聖寵的助佑，也是與貧窮一般，產生許多益處。受辱使我們在傳教工作中，謹慎小心，勇敢改去若干過失。受辱使我們不求人的讚美和賞識，純心純意地，為天主而從事傳教。受辱使我們不再顧到臉面，不再討人喜歡，因而勇敢剛毅地盡好自己的職務，保護天主的光榮。受辱使我們體會貧苦弱小者的心理，容易向他們講勸，他們也容易接受我們的勸勉。受辱使我們相似耶穌，因而在宣講他十字架的聖道中，不致言行不符，更能感動人心。<\/p>\n<p>實際享受財富，只內心貧窮的人，往往得不到貧窮的許多益處，甚且受到若干尊榮；所以格外需要受些辱，為能達到謙遜；格外該懇切天主賞賜他喜歡受辱，切願受辱，更實實在在地受辱的大恩寵。<\/p>\n<h3>基督聖道的第三步：謙遜<\/h3>\n<p>聖保祿宗徒說，天主聖子「使自己空虛，取了奴僕的形體……貶抑自己，聽命至死，且死在十字架上」（菲2：7-8）。耶穌聖道的第三步，我們自己得救和拯救他人的主要條件，也不能不是謙遜。誰因著天主聖寵的助佑，好好地，喜歡地，承受了貧窮和侮辱，走上了這聖道的前二步，也就很容易地，穩妥地，達到了這最後一步；因而切實地反攻了自己，真正地為基督的神國勞苦工作。<\/p>\n<p>聖依納爵說：「由這三個階段，引領人進修其他德行」。我們已經知道貧窮與受辱的益處。至於謙遜，更是使我們與謙遜的耶穌合二為一，完全奉行天主聖父的旨意，因而真正地事奉他，讚美他，光榮他，更幫助人們這樣做；因而使我們自己得救成聖，更幫助人得救成聖。我們在天主臺前謙遜自己，天主就喜歡我們的祈禱，加給我們豐盛的恩寵，免除我們種種危險的誘惑，賞賜我們深深地結合他，密切地親近他；更降幅我們的傳教工作，感化我們所願意拯救的靈魂。我們在人面前謙遜，那麼，在傳教工作上，也就很容易地恪遵聖教會的訓誥，服從神長的指揮，和同事們竭誠合作，接受朋友的規勸，儘量尊重他人的意見，稱讚他人的優點，原諒他人的過失，親近貧窮弱小的人，援助有困難的人，憐憫罪人的靈魂，幫助他們回頭改過，甚至和顏悅色地忍受攻擊教會者的迫害、磨難、譏笑、侮辱。<\/p>"}, {"name": "對禱", "html": "<p>這這兩旗默想的對禱中，聖依納爵只叫我們祈求貧窮和受辱，卻沒有叫我們祈求謙遜。因為誰若真的喜歡偕同基督貧窮受辱，也就是有了謙遜。謙遜是美麗、可愛的德行；驕傲的人，也不願意人們說他驕傲，卻要裝作謙遜，要人們說他謙遜。謙遜是人人願意有的；貧窮受辱，就我們的本性而論，是人人所不願意的。然而，不肯貧窮受辱的人，誰都容易明白，一定不是真正謙遜的人。所以我們不用祈求天主賞賜謙遜，免得反而自己欺騙自己；我們只該祈求天主賞賜貧窮受辱。我們走了這聖道的前二步，也就穩妥達到了第三步的謙遜。<\/p>\n<p><strong>對禱一<\/strong>：先求聖母為我祈求她的聖子和她的主耶穌，收我在他的旗下：第一、遵守嚴格的神貧，倘若至尊天主肯揀選我、收納我，更願實際貧窮。第二、只要不致引人犯罪或招惹至尊天主不悅，甘願受輕慢、淩辱，為能多多效法耶穌基督。念《聖母經》一遍。<\/p>\n<p><strong>對禱二<\/strong>：向聖子耶穌作同樣的祈禱，望他在聖父前為我求得此恩。念《向耶穌聖靈誦》一遍。<\/p>\n<p><strong>對禱三<\/strong>：向天主聖父作同樣的祈禱，望他賞賜我這些恩惠。念《天主經》一遍。<\/p>"}], "notes": [{"n": "1", "html": "《神操》書，第137-138號。"}, {"n": "2", "html": "《神操》書，第139號。"}]}, {"id": "1-11", "num": "11", "kind": "默想要點", "title": "三等人", "veni": true, "sections": [{"name": "預備經", "html": "<p>求我們的主天主，賞我聖寵，使我的一切意向和行為，都為事奉讚美至尊無對的天主。<\/p>"}, {"name": "定像", "html": "<p>「歷史性的事蹟：這裏設想三種人，每人獲得了一萬金元，但非完全出自愛天主的緣故。現在他們都願意擺脫財帛的負擔和阻礙，以便安心事奉天主，拯救自己的靈魂。」 「定像：設想我自己在吾主天主和眾聖人面前，渴望能認清無窮美善的天主所最喜歡的事。」<\/p>"}, {"name": "求恩", "html": "<p>「祈求我所願意的。這裏是求天主賞我聖寵，幫助我選擇那更能光榮天主和救己靈魂的事。」<\/p>"}, {"name": "默想", "html": "<p><strong>1.<\/strong> <strong>三等人默想的概況<\/strong><\/p>\n<p>聖依納爵把這操練稱作默想，但也與兩旗默想一般，給了三個特別的前導。第一前導，即歷史，更好說是比喻。三等人，也不妨說是三個人。每個人獲得了一萬金元。這一萬金元的獲得，是正當的，無罪的，至少是毫無大罪的；只是他們對這財產的心情，是錯亂的。可他們願意除去這錯亂的心情，為能妥救己靈，，更多多事奉天主。這情形，設想為三個人是完全相同的。<\/p>\n<p>第二前導是定像。聖依納爵叫我們丟開了那三個人，卻只存想我自己站在天主和眾聖人面前。在神操中，這樣的定像是非常隆重的。聖人也叫我們觀看自己，渴望能認清無窮美善的天主所最喜歡的事。天主和諸聖，都看得清楚，我的心情是否真切誠實。<\/p>\n<p>第三前導，即求恩，要「求天主賞我聖寵，幫助我選擇那更能光榮天主和救己靈魂的事」，也就是說，要決心做第三等人，因而好好選擇。<\/p>\n<p>這默想的三端，就是三等人心境的描寫。聖人不加說明，只讓默想者自己反省，採取神益。<\/p>\n<p>第一等人雖然願意除去對財物的偏情，卻絲毫不取用方法。這顯然是不合理的，顯然不能達到所願意的目的。<\/p>\n<p>第二等人願意除去偏情，更取用一些方法；只是不肯取用那有效的方法，就是不肯放棄這一萬金元。這也是不合理，也不能達到目的。聖人描述這樣的人，說「願意天主遷就他」。<\/p>\n<p>第三等人也願意除去偏情。可是他與前兩種人不同：他準備著為除去偏情的目的，而不怕取用任何方法，那就是如果天主要他放棄這財物，他就實行放棄；如果天主要他保留財物，他也不再為自己，卻專為事奉天主而保留財物。在天主的聖意沒有清楚顯示之前，他完全保持不偏不倚的態度。<\/p>\n<p><strong>2.<\/strong> <strong>三等人的意義<\/strong><\/p>\n<p>奉行第二周神操的人，在神國默想中，激發了獲享君王耶穌的熱忱，慷慨奉獻自己，為勞苦工作，為反攻自己，在兩旗默想中，又看破了魔鬼的詭計，明白了耶穌君王的聖道，切願偕同基督貧窮受辱。這樣的善願，很重要，很有益處。可是它究竟是否真切誠實呢？它能否產生真實的效果呢？這是很重要的問題。我們在默想中有了一些善情善願，很容易妄想自己有了那所願意有的善工和德行，因而自己欺騙自己，不察覺自己的意志缺乏堅決，缺乏剛強，更不懇切祈求天主賞賜這剛強堅決的意志；結果是默想過去之後，偏情也沒有糾正，善願更無法實踐，只仿佛輕煙般的飛速消逝。<\/p>\n<p>為此，聖依納爵叫我們做這三等人的默想，為使我們深深明白：做第一等第二等人，都是不合理的，是沒用的，我們必須做第三等人；所以我們要仔細問自己：在這實踐耶穌的聖道上，在這切願偕同基督貧窮受辱上，我們是第一等人？第二等人？還是第三等人？<\/p>\n<p>第一等人，願意救自己的靈魂，願意事奉天主，光榮天主，幫助耶穌建立神國，甚或願意偕同基督貧窮受辱，可是他只是憑一時的熱情，只是空談，卻不肯勞苦工作，不肯反攻自己的偏情。這顯然是不合理的，不管用的。大概而論，奉行第二周神操的人，不致是這樣。然而魔鬼也能這樣誘惑人們，尤其是這樣誘惑那些性格輕浮膚淺的人；好讓耶穌的聖道，像那落在路旁的種子，頃刻被飛鳥啄食；像那落在沙礫中的種子，發了芽，卻就被太陽曬死。至於連那第一周神操也做得不好的人，沒有深切痛恨自己的私欲偏情的人，當然是屬於這第一等。<\/p>\n<p>第二等人，有著和第一等人同樣的意願，甚且真真實實地取用若干方法，為實現這意願。可是他只按照自己的私欲私利，不按照天主的聖意，而取用方法；所以這些方法，不能幫助他得到所願意的目的，以致實際上和不取用任何方法，沒有多大的區別。比如，他願意少點享受，做點刻苦，卻不肯放棄全部財產，度實際貧窮的聖化。比如，他願意受點輕慢侮辱，但某種淩辱，從某人來的輕慢，太難堪了，他不肯忍受。總之，那沒有大價值的、天主所不向他要的犧牲，他可以奉獻；天主所向他要的、有真價值的犧牲，他卻不肯奉獻。這當然也是不合理的，不管用的。大概而論，奉行第二周神操的人，很有可能是這樣的。以前他被感官的貪欲，被血肉的世俗的貪愛所拉扯，又被魔鬼所擾亂；因而對於除去那事主救靈的負擔和阻礙，或是不認識有什麼切實有效的方法，或是沒有力量去取用；因而他只是定一些不徹底善志，做一些不重要的努力；結果當然是除不掉那負擔和阻礙。這也不奇怪。現今在神操中，他察覺了自己是第二等人，不該垂頭喪氣，消極敗興；只該感謝天主所賞賜的神光，認識了自己靈魂的可憐情形；更努力懇求天主，賞賜他堅強的神力，為能做第三等人。<\/p>\n<p>第三等人，願意取用任何方法，不怕任何犧牲，為除去那錯亂的心情，為事奉天主，光榮天主。這樣的人，不怕反攻自己的私欲私利，只一心奉行天主的聖意。他在沒有看清天主的聖意之前，完全保持心地的平正；對於財富或貧窮，對於尊榮或侮辱，完全抱著無可無不可的態度。實際上，我們的本性，對於享受財富，當然沒有難處；難處是在忍受貧窮侮辱。為此，第三等人的心境，實際上，是準備著放棄財富尊榮，接受貧窮侮辱。這也就是真真實實地願意效法耶穌，偕同耶穌，度實際貧窮的生活，受輕慢和侮辱；真真實實地在耶穌的旗下，實踐他聖道的第一第二步。<\/p>"}, {"name": "對禱", "html": "<p>「三個對禱與在兩旗默想中所作的相同。」<\/p>\n<p>「對禱一：先求聖母為我祈求她的聖子和她的主耶穌，收我在他的旗下：第一、遵守嚴格的神貧，倘若至尊天主肯揀選我、收納我，更願實際貧窮。第二、只要不致引人犯罪或招惹至尊天主不悅，甘願受輕慢、淩辱，為能多多效法耶穌基督。念《聖母經》一遍。<\/p>\n<p>對禱二：向聖子耶穌作同樣的祈禱，望他在聖父前為我求得此恩。念《向耶穌聖靈誦》一遍。<\/p>\n<p>對禱三：向天主聖父作同樣的祈禱，望他賞賜我這些恩惠。念《天主經》一遍。」<\/p>\n<p>「注意：幾時我感覺偏愛財帛或厭惡貧窮，心中不能平衡，無法不偏不倚；為克除這個偏情，最好在對禱中抑制著本性，求天主幫助我選擇貧窮；並且要堅決聲明，我這樣願望，這樣熱切祈求，只是為事奉、讚美至美善的天主。」<\/p>\n<p>我們人類的本性，原是這樣的偏愛財富，厭惡貧窮。何況魔鬼見到我們決心跟隨耶穌，一定要來攻擊我們，誘惑我們，施展它的詭計，阻止我們做第三等人。那麼我們要驚慌擾亂嗎？要灰心失望嗎？我們不單不該驚慌擾亂，不該灰心失望；更該向它反攻，就可得勝本性，得勝魔鬼。我們越是厭惡貧窮，越該懇求天主賞賜我度那實際貧窮的生活。<\/p>\n<p>誰肯這樣努力反攻自己，誠心誠意地向天主這樣祈求，那麼，即使他的本性還在感到偏愛和厭惡，他的意志已經是第三等人。天主也一定要嘉納他的好心，賞賜他豐盛的聖寵，為確實整理自己的生活。<\/p>"}], "notes": []}, {"id": "1-12", "num": "12", "kind": "默想要點", "title": "苦難", "veni": true, "sections": [{"name": "預備經", "html": "<p>求我們的主天主，賞我聖寵，使我的一切意向和行為，都為事奉讚美至尊無對的天主。<\/p>"}, {"name": "定像", "html": "<p>「史跡：可設想吾主耶穌怎樣派遣兩位門徒去耶路撒冷預備晚餐；隨後他同其他門徒共赴晚餐。吃過逾越節羔羊及晚餐後，他為門徒們洗腳，並將自己的聖體、聖血交給他們。又在猶達斯出賣他的上主後，對他們做了一番訓話。」 定像：「這裏可想，由伯達尼去耶路撒冷的路是寬是窄？是平坦還是崎嶇？再看晚餐廳是大是小？是怎樣的情形？」<\/p>"}, {"name": "求恩", "html": "<p>「祈求我所願望的。這裏是求天主賞我痛苦憂傷，因為主是為我的罪而受難。」<\/p>"}, {"name": "默想", "html": "<p>耶穌為我受苦受難受死。耶穌為我而受苦。而他在苦難中所受的痛苦，是最大的痛苦。<\/p>\n<p>他受過什麼痛苦呢？他受過感官方面的痛苦（是來自傷害身體之事物的痛苦）。基督也受過來自內在的痛苦（是來自意識到有傷害者迫近的內在痛苦，叫作憂苦或憂愁）。這兩種痛苦，都是現世生活所有痛苦中最大的。理由有四：<\/p>\n<p>第一、由於痛苦的原因：感官痛苦的原因是身體的傷害。而在基督內，這傷害和痛苦的劇烈，一方面是由於它遍及全身；另一方面，也是由於所受苦難的種類。<\/p>\n<p>關於受苦難的種類，被釘在十字架上的死亡，是非常痛苦的；因為被釘的是神經多，以及很敏感的部位，即手和腳；懸在十字架上的身體的重量，不斷地增加痛苦。此外，這痛苦也是持久的，因為受刑的人，不會馬上死，像那些為劍所殺的人一樣。<\/p>\n<p>關於內在痛苦的原因，首先是人類的一切罪惡，包括我的罪過，他是為補贖這些罪惡，而甘心受苦受難，因此，他宛如把這些罪惡，歸於自己。其次，特別是因為是猶太人背離他，其他置他於死地、得罪他的人們也背離他，尤其是因為見他受苦受難而跌倒的門徒們也背離他。還有，是因為身體生命的喪失，這是人性自然所恐懼的。這些原因讓耶穌非常難過。<\/p>\n<p>第二、由於受苦者的感應靈敏度，基督的觸覺，十分強健：因為在身體方面，他有最完美的組織，因為他的身體是借聖神的工作，以奇跡的方式形成的。所以，觸覺越完美，所感覺到的痛苦也越大。就內在的官能而言，基督的靈魂也清楚意識到憂苦的一切原因。<\/p>\n<p>第三、由於痛苦的清純。因為在其他受苦者身上，內在的憂苦，甚至外在的痛苦，都會因理性的某種思考，以及靈魂高級能力與低級能力的交錯，獲得減輕。例如：一個病人受痛苦，但如果他不想起病苦，反而想起其他的事情，如：為耶穌受苦，做補贖等德行，他的病苦得以減輕。可是在受苦的基督內，卻並非如此；因為正如大馬士革的若望所說的，每一種能力，“基督都容許它做那屬於自己者”，意思是說，雖然耶穌有能力，以不同的方式，減輕自己的痛苦，他還是讓所有的官能受痛苦。<\/p>\n<p>第四、基督是自願受苦的，也就是說，為了使人類，從罪惡中拯救出來，他自願接受了苦難和痛苦。所以，為了為我們從苦難中獲得極多的果實，他承受了極大的痛苦。<\/p>\n<p>統括上述種種原因觀之，顯然地，基督所受的痛苦是最大的。<\/p>\n<p>耶穌愛自己的生命，但是他更愛我們，所以他為我們的緣故，甘願犧牲了自己可愛的性命。亞裏斯多德說，有德行的人，越知道自己的生命可貴，也越愛惜它。可是為了德行的可貴，他卻不惜置生命於度外，或甘願冒生命的危險。同樣地，基督也為了愛德的可貴，不惜將自己最心愛的生命置於險地，按照耶肋米亞所說的：我將我心愛的生命，交在敵人的手中。<\/p>\n<p>基督又願意在年輕的時候受苦受難，共有三點理由：<\/p>\n<p>第一，是為更有力地向我們顯示他的愛，因為年輕的時候，生命處於最完美的境界，而這個時候，他就為我們犧牲了性命。<\/p>\n<p>第二，因為他不想讓人們以為，他的死亡是本性的衰微或身體的疾病所致。<\/p>\n<p>第三，基督之所以願意年輕的時候受死而復活，是因為他想預示未來復活者的性質。厄弗所書說：“到我們眾人都達到對於天主子，有一致的信仰和認識，成為成年人，達到基督圓滿年齡的程度”。<\/p>"}, {"name": "對禱", "html": "<p>耶穌為我受苦受難受死。耶穌為我而受苦。我為基督做了什麼？現在為基督做什麼？將來為基督應該做什麼？念《天主經》一遍<\/p>"}], "notes": []}, {"id": "1-13", "num": "13", "kind": "默想要點", "title": "復活", "veni": true, "sections": [{"name": "預備經", "html": "<p>求我們的主天主，賞我聖寵，使我的一切意向和行為，都為事奉讚美至尊無對的天主。<\/p>"}, {"name": "定像", "html": "<p>歷史：「這裏是吾主耶穌在十字架上斷氣後，肉身雖與靈魂分離，可是仍與天主性相偕；他的靈魂也結合著天主性降到了冥府，救出義人們的靈魂；他回到墳墓，復活起來，靈魂與肉身一起顯現給他可讚美的母親。」 定像：「觀看地點。這裏可觀看墳墓和聖母的住處，以及寢室和祈禱間等。」<\/p>"}, {"name": "求恩", "html": "<p>「祈求我所願意的。這裏是求天主賞賜聖寵，使我對吾主這般的光榮和福樂，感到歡欣雀躍。」<\/p>"}, {"name": "默想", "html": "<p><strong>1.<\/strong> <strong>復活默觀的概況<\/strong><\/p>\n<p>關於默觀的資料，聖依納爵寫下了五端。第一端：觀看人物；第二端：聆聽言語；第三端：注視動作。第四端：耶穌的天主性，在受難時，隱藏了起來，現在在這至聖的復活中，借著種種真實、神聖的效果，又神妙地彰顯出來。第五端：以朋友之間的互相安慰作比較，看吾主耶穌怎樣擔任了安慰者的職務。<\/p>\n<p>最後兩端是神操第四周所獨有的，也是第四周的一切奧跡默觀所共同的；我們特別要加以解釋。<\/p>\n<p><strong>2.<\/strong> <strong>最後兩端的意義<\/strong><\/p>\n<p>聖依納爵常牢記耶穌基督是人而天主。所以在受難的默觀中，他叫我們存想耶穌基督人性的苦難，更存想天主性好像隱藏了自己；現今在復活的默觀中，他又叫我們在耶穌人性的光榮福樂中，看到耶穌的天主性，神妙地彰顯出來。耶穌死了，卻又自己復活了。這清楚證示他是天主。他的光榮復活，就是他天主性真實的、神聖的效果。他在復活後，顯現給許多人，安慰他們，把超性的生命賜給信徒們，用聖神的恩寵變化人心，更新了世界，更建立了教會，產生了無數聖德的佳果。<\/p>\n<p>我們在默觀復活的奧跡中，常該因著耶穌人性的顯現，認出他天主性的光芒，因而欽崇他，讚美他，更切願努力事奉他，光榮他。我們更懇求他：把他的種種真實而神聖的效果賞賜給我們，好使我們將來有一天也獲享復活的光榮。<\/p>\n<p>在第五端中，聖人叫我們格外默觀復活後的耶穌，在顯現的時候，怎樣安慰人。原來，神操第四周的目標，是分享耶穌的光榮福樂，是領受耶穌的安慰。聖人為使我們明白神慰的性質，叫我們存想朋友們怎樣彼此安慰。無疑地，天主的安慰，深深地變化我們的心，增加我們的信望愛三德，使我們充滿天上喜樂：這是遠超過人間的安慰，我們只能用言語，用態度，用行為，用物件，來表示他們的同情心，來解救我們身體方面的困難，來幫助我們獲得世上的利益，來激發我們聖善的思想；這是遠遠比不上全能、全知、全善、居住我們心中的天主，用神光、神力、神慰、神樂，來安慰我們。聖依納爵的意思，只是叫我們知道：復活後的耶穌，對於善人們，一片仁慈良善，要遷就我們的劣弱，像朋友一般來安慰我們。我們在默觀復活後顯現中，當然要懇求耶穌安慰我們，增加我們的信望愛三德，因而歡欣地跟隨他，踴躍地事奉他，興奮地光榮他。<\/p>\n<p>聖依納爵在舉例中寫道：應當忠信地述出那所要默觀或默想的歷史事蹟。的確，神操書中有關耶穌奧跡的默觀，都是根據聖經的記載，或是撮述聖經的教訓，只有這「顯現給聖母」是例外。全部聖經，沒有提起這顯現。所以聖依納爵在「耶穌奧跡默想題材」中（神操書299條）解釋說：「首先顯現給他的母親瑪利亞。聖經雖然沒有明提這事，但既然記載他曾經顯現給那麼多的人，也算暗示顯現給聖母了」。<\/p>\n<p>聖人的許多同時人，尤其是不恭敬聖母的異端教徒，一定仍舊要爭辯這論證的價值；所以聖人接著說：「聖經假定我們是有理智的，就如有一處寫道：「連你們也不明白嗎？」（瑪15：16）。我們也該知道，聖經古代教父們，都承認耶穌復活後，應該是首先顯現給自己的母親。<\/p>\n<p>觀看耶穌在母親面前。就像自己也在那裏似地，觀看當時的情景，認出耶穌，他身上仍帶著傷痕，然而是光榮的傷痕。我們心裏十分快樂，又看見他們母子在一起了。聖母仍是他的母親，永遠都是。聖母因兒子的快樂而快樂，十分高興看到耶穌還活著。她用只有母親才會說的言詞表達出，重見聖子的喜樂。<\/p>\n<p>基督受難那幾天，聖母痛苦到了極點。我們可以十分合理地想，基督第一，就會親自來安慰聖母。有一次，耶穌顯現給聖女大德蘭<sup class=\"fn\"><a href=\"#n-1-13-1\" data-fn=\"1-13-1\">1<\/a><\/sup>。那時，聖女大德蘭心靈感受到一種極其強烈的神枯。聖女說：“他告訴我，他復活後去見我們的聖母，因為她有特別的需要，聖母心靈刺傷，非常痛苦；後來見了耶穌卻有一副樂不可支的樣子（我才明白我的那種痛苦很不同，童真瑪麗亞的應是多大的痛苦！），耶穌留下陪她很久，為了安慰她”。<\/p>"}, {"name": "對禱", "html": "<p>按照心靈的狀況，用一個或數個對禱來結束。念《天主經》一遍。<\/p>"}], "notes": [{"n": "1", "html": "參考TERESA DE JESÚS, Obras Completas, Relación 15, 6°, Ed. Manual. Revisado y notas por fray Tomás de la Cruz, O.C.D., Ed. Monte Carmelo, 3ª. Edición, 1982。"}]}, {"id": "1-14", "num": "14", "kind": "默想要點", "title": "獲得愛情的默想", "veni": true, "sections": [{"name": "預備經", "html": "<p>求我們的主天主，賞我聖寵，使我的一切意向和行為，都為事奉讚美至尊無對的天主。<\/p>"}, {"name": "定像", "html": "<p>設想地點。這裏可想我在天主和眾天使、聖人的面前，並求他們為我代禱。<\/p>"}, {"name": "求恩", "html": "<p>求我所願望的。這裏是求天主使我深切明瞭天主賞我的諸般恩惠，使我能感激之外，在一切事上愛慕、事奉天主。<\/p>"}, {"name": "默想", "html": "<p>首先要注意兩件事：<\/p>\n<p>一、愛情不在空言，應在事實上表現。<\/p>\n<p>二、愛是互相贈予。愛人者把自己所有的或其中的一部份，贈送給所愛的人；反之，被愛的人也這樣將所有的或其中的一部份，交給愛他的人。這樣無論是學問、知識、尊榮和財富，兩人都共同享受或互相授受。<\/p>\n<p>默觀的內容分四端。第一端：存想天主賜給我的無數恩惠，因而激發還愛之忱；第二端：存想天主臨在他的一切恩惠之中，因而更加激發我的愛情；第三端：存想天主在受造物中工作，為加給我恩惠，因而更加激發我的愛情；第三端：存想天主的無窮美善，略略顯現在受造物中，因而愛慕天主的無窮美善。<\/p>\n<p>在第一端中，聖依納爵撰寫了一篇經文，幫我們把自己奉獻給天主，並求天主賞賜聖愛。<\/p>\n<p>愛天主這一觀念，尤其是用行為來證實我們的愛，為愛天主而忠誠服務，是聖依納爵對於神修的基本觀念，並且貫徹在全部神操中。不單原則與基礎道理的崇敬、讚美、事奉天主，是用行為來實踐愛天主的誡命，不單第二周的聽從耶穌的召喚，為神國而勞苦工作，反攻自己，尋求忍受、愛慕、跟隨、效法耶穌；第三周的悲痛耶穌的受難，切願分擔耶穌的苦難，第四周的慶幸耶穌的復活光榮，因而歡欣愉快，都是用行為來證實我們的愛，甚且己罪默想，在釘死的耶穌跟前，詢問我將來該做什麼，又默想地獄，存想耶穌常是用著這般大的良善和仁愛來對待我，都是在激發我的知恩報愛之情；至於謙遜三式，更可很容易地改寫為「愛天主的三式」。<\/p>\n<p>為此，為獲得愛情默觀的性質，只是把貫徹在全部神操中的思想，明顯地從「愛」的角度，做一個綜合性的溫習。<\/p>\n<p>我們在以前各周中，已經分開存想了天主的造化、拯救、赦罪、賞賜恩寵，尤其是耶穌的降生、聖誕、傳教、受難、釘死，更為我們而復活的種種恩惠，反省到了我自己所領受的種種恩惠，我們已經深深地打動了以愛還愛的熱忱。在創造、降生、傳教、受難、聖體等奧跡中，我們格外見到天主怎樣臨在他的恩惠中，並且為加給我們恩惠，而真真實實地工作，甚且真真實實地勞苦。我們更在耶穌以及聖母聖人聖女的美善中，在我所受到的百般恩惠中，稍稍窺見了天主的全能全知全善，無窮仁慈，無限恩愛。我們更早已選擇了偕同基督貧窮吃苦受辱的生活，以聖心之憂為憂，以聖心之樂為樂，完全奉獻我自己，為幫助耶穌建立神國，多多讚美光榮天主。現今在神操的末尾，我們看到全景，默觀天主的聖愛，因而努力以愛還愛：這真是最貼切的結束。<\/p>\n<p>我們明白了這默觀的性質，也就容易明白它在神操中的重要性，那就是它更可準備我們在神操結束之後，好好 度我們的日常生活，好好在我們的日常生活中，按照我們在神操中所發現的天主的聖意，處理我們的一切。<\/p>\n<p>聖依納爵在為獲得愛情默觀的第一端中，叫我們觀看天主的無數恩惠，天主普遍給的，以及我個人所受到的恩惠；在第二端中，他叫我們不只見恩惠，而且見加恩惠的天主，更該見到天主臨在這恩惠中。在第三端中，他叫我們再進一層推想，天主怎樣在受造物中，為我的緣故，而工作。在第四端中，他叫我們從恩惠而加升到恩惠的天主自己：從受造物的美善，而推想到天主的無窮美善。<\/p>"}, {"name": "對禱", "html": "<p>最後如上所說，用對禱結束。念〈天主經〉一遍。」我們還可以慢慢念上面的經文做對禱：「主，請你收納我的全部自由、我的記憶、我的理智，和我整個意志。凡我所有，或所佔有，都是你所賞賜的；我願完全奉還給你，任憑你隨意安排。只將你的聖愛，和你的聖寵，賞賜給我，我便心滿意足，別無所求了」。<\/p>"}], "notes": []}]}, {"id": "2", "name": "神操之二", "lessons": [{"id": "2-00", "num": "00", "kind": "主題講解", "title": "導論", "veni": false, "sections": [{"name": "講解", "html": "<h3>導論<\/h3>\n<p>神操的目的：克勝自己；調節並規範我們的生活，使我們決不會受到不虔敬或低劣的理性（即「過度的依戀」）所影響。<\/p>\n<p>「任何人如果與自己的造物主、上主相偕，懷著無比勇氣和慷慨參與神操，將獲益匪淺」 [第 3 頁，凡例#5]。<\/p>\n<p>「人縱然賺得了全世界，卻賠上了自己的靈魂，為他有什麼益處？或者，人還能拿什麼作為自己靈魂的代價？」（瑪16:26）。<\/p>\n<p>神操是天主和我之間的事情（儘管魔鬼也扮演了一個角色）：神師在某種意義上是無關要旨的。<\/p>\n<p>這是一種淨化和釋放的體驗。誰犯罪，誰就為罪所主宰。<\/p>\n<p>有些人也被邀請，但他們沒有成功。我卻做到了：天主已經從永恆中記起了我和我這次的退省。當然，天主<strong>有話<\/strong>要告訴我。<\/p>\n<p>聖依納爵說，神操是一項經過精心策劃的「良心省察、默想、口禱和默禱，以及其他靈修活動的方法」（參見凡例#1）。他將它們比作「散步、徒步旅行和跑步」等身體鍛煉。我們進行身體鍛煉是為了加強身體的肌肉等。因此，神操旨在加強我們靈魂的力量，啟迪心靈，激發意志，讓它更有效運作。<\/p>\n<p>神操是「一種為靈魂妥作準備，並使它得以擺脫一切過度的依戀（即我們靈魂的不良性格傾向或不良習慣）的方法，並在去除它們之後，如何在人的本性和品格中，尋求並找到天主的旨意，藉以拯救我們的靈魂。」<\/p>\n<p>這意味著神操將有助我們消除我們的犯罪傾向。一旦成功了，我們將會了解天主對我們的期望，然後決心將有關期望付諸實踐。<\/p>\n<p>事實上，我們的壞習慣不僅使我們墮落，甚至蒙蔽我們，使我們無法辨識自己懷有敗壞的傾向。<\/p>\n<p>藉著天主的恩寵，神操使我們能夠看到我們內在的弱點，這並不是一件小事，因為依我們的天生本性, 我們會看見在自己之內任何正面和值得稱許的地方。為要找到天主的旨意，其先決條件就是要誠實地評鑑我們的<strong>犯罪傾向<\/strong>。最令我們無法認清天主旨意的原因，就是我們已被自己的意願全然佔據了。<\/p>\n<p>通過所需的退隱和靜默 [20]， 我們可以獲得許多益處，其中三個主要的是：<\/p>\n<p>1）第一個是任何人為了事奉天主而退避許多令人分心的世俗事務（包括朋友），他可以在神聖而至高的天主面前，立下不少功績。<\/p>\n<p>2）第二個是藉著這樣的分隔，我們的心神便不會被許多事情分散了，而是把我們所有的關心和專注，都放在事奉天主和令我們的靈魂得益的事上，「<strong>我們可以更自由地運用我們的天賦<\/strong>，更努力地尋找我們所渴求的。」<\/p>\n<p>3）第三個是，當靈魂越是覺察自己孤獨和遠離別人，它就越容易接近並與它的創造者及主結合。靈魂越接近天主，就越樂於並傾向接受來自天主的恩寵和賞賜。這就是靜默的道理。從實際的角度來看，要與輔導者交談。<\/p>\n<p>「技術進步，特別是在交通和通訊領域，使人類生活更加舒適，但也更加緊張，有時甚至令人發狂。城市幾乎總是嘈雜，很少能在其中找到寂靜，因為總是有背景噪音，而在某些地區，這甚至延至晚上。此外，近幾十年來，媒體的發展已經散播和擴展了一個在1960年代已經勾勒出來的現象：<strong>虛擬性比現實性佔有更大主導優勢的風險<\/strong>。人們所不知道的是，他們越來越沉浸在虛擬維度中，因為視聽訊息從早到晚陪伴著他們的生活。在這種環境下生長的幼孩，出於他們對這種空虛感的恐懼，似乎很想用音樂和影像來填補每一個空虛的時刻。這是一種一直存在的趨勢，特別是在年輕人之間和更發達的城市環境中，但今天它已經達到了一個程度，有如可引起對人類學變異的議論。有些人再也無法長時間保持靜默和孤獨………可這樣說：人類藉著退避到靜默和孤獨中，就像將自己「暴露」於赤裸的現實，即我從一開始便提到的那明顯的「空虛」，反而是為了體驗天主臨在的圓滿境界──即那至真實而存在的「現實」，也處於可感知的有形維度以外的「現實」。」（本篤十六世，講道，09-X-11）。<\/p>"}], "notes": []}, {"id": "2-01", "num": "01", "kind": "主題講解", "title": "辨別神類的規則：第一週", "veni": false, "sections": [{"name": "講解", "html": "<h3>辨別神類的規則–第一週[神操第313號等等]<\/h3>\n<p>辨別神類是基督徒生活所必需的，尤其是為了基督徒的成全：「可愛的諸位，不要凡神就信，但要考驗那些神是否出於天主。」（若一4：1)<\/p>\n<p>聖保祿説：「你們該考查自己，是否仍站在信德上，你們要考驗自己！」（格後13：5)<\/p>\n<p>我們的傾向可能有不同的根源，它們可能是源自：<\/p>\n<p>— 天主的推動<\/p>\n<p>— 魔鬼<\/p>\n<p>— 我們自己<\/p>\n<p><strong>我們辨別是爲了遵循天主的旨意，拒絕來自魔鬼或我們自己的一切<\/strong>。坎特伯雷的鮑德溫説：「辨別是正確思想和德行操練的結合」。斯卡拉梅利(Scaramelli) 說：「為獲得辨別神類的神恩，其途徑是<strong>祈禱<\/strong>、<strong>學習<\/strong>和<strong>我們各自進行辨別所累積的經驗<\/strong>。」<\/p>\n<p>不同的神類正影響著我們，但他們各懷相反的目的：<\/p>\n<p>— <strong>天主<\/strong>總是激勵我們行善，祂直接引導我們的靈魂。<\/p>\n<p>— 只有天主才能從內心推動我們的意志，雖然有時天主也利用其他媒介（次要的根由)。<\/p>\n<p>—反而，<strong>魔鬼<\/strong>總是促使我們做壞事，有時在表面上卻看似好事。<\/p>\n<ul>\n<li>魔鬼有<strong>兩個盟友：即我們的肉身和俗世<\/strong>。我們的天性有時驅使我們做好事，但有時也做壞事。俗世有它本身的行為準則及價值觀，均與福音的準則和價值觀互相對立。<\/li>\n<\/ul>\n<p>斯卡拉梅利(Scaramelli)對善神和惡神在我們內的活動，進行了有趣的觀察。<\/p>\n<h3>天主的神<\/h3>\n<h3>a）在我們的心神<\/h3>\n<p><strong>總是喚起真理<\/strong>。因此，天主的神永遠不會激發任何違背信仰的事。它不會激發反對教會訓導或反對教宗的事情，因爲教宗得到了特殊的助佑。<\/p>\n<p>天主的作為總是合乎由信德所光照的理性。在超自然的領域中，有些事可能會超越我們的理性，但絕不會是非理性(違反理性)。因爲天主是信德和理性的原創者，所以它們之間不會有矛盾，因爲天主不會有矛盾。因此，當有人憑著脫離理性的情慾而行事，這種行爲方式不可能來自天主。<\/p>\n<p>天主會在重要的事情引導我們的心思，而不會理會無聊或瑣碎的事情。天主尤其引領我們傾向神性和靈性的事情。<\/p>\n<p>天主總是啓迪我們的心思。即使天主要介入來淨化我們，祂也絕不會是混亂的來源。天主激勵謙卑和信賴的意念。<\/p>\n<h3>b）在我們的意志<\/h3>\n<p>天主在我們身上工作的效果，總以內心的平安作為標記。「因為天主不是混亂的天主，而是平安的天主。」（格前14：33)<\/p>\n<p>因此，當一個人發現自己煩惱和不安時，他必須辨別清楚。<\/p>\n<p>天主激發我們變得謙遜，使我們對祂深切信靠。<\/p>\n<p>同樣，天主也激發我們變得溫順，讓我們依從祂的催促去做善事。<\/p>\n<p>天主激發我們要有正直的意向，好讓我們在所做的每件事上尋求祂的光榮。<\/p>\n<p>天主在我們內傾注忍耐的恩賜，使我們能忍受十字架的苦痛。<\/p>\n<p>天主賜給我們靈性的內心自由、神貧及捨棄世物的精神，以能信奉天主爲至善。<\/p>\n<p>魔鬼<\/p>\n<h3>a）在我們的腦海<\/h3>\n<p>牠是謊言與謬誤之神。耶穌將魔鬼描述爲「撒謊者，而且又是撒謊者之父。」（若8：44)。從一開始牠總是這樣哄騙人：「(你們……)將如同天主一樣。」（創3：5)。<\/p>\n<p>因此，激發謊言、謬誤和半真半假的道理是牠的一個特徵｡<\/p>\n<p>聖依納爵說：魔鬼常向我們推荐「謬誤的推理」和焦慮。<\/p>\n<p>魔鬼喚起我們內心的好奇精神，令我們傾向學習無聊的事情，驅使我們重視某些無聊的東西，把它們看成必要的事。「惡神的特徵是以焦慮去滋擾，以憂傷去折磨，以及由『謬誤的推理』所支撐而引致的種種障礙，遂令我們的靈魂深感不安。牠就這樣力求阻止靈魂成長和增益」（第二條規則)。<\/p>\n<p>聖依納爵憶述他要往巴黎學習的往事。當學習的時刻來臨時，他便對祈禱體會到難以抗拒的渴求。他祈禱時便會感到神慰。但當他回到學習時，他意識到那些祈禱總是為他帶來焦慮感。因此，他明白即使祈禱本身是一件好事，但在那個時刻，他本來應該學習而不是祈禱；而那也是魔鬼的伎倆，用來分散他對本份的專注。<\/p>\n<h3>b）在我們的意志<\/h3>\n<p>在這裏，惡神以驕傲或偽謙卑之神的身分顯示自己。同樣地，牴牠是令人猜忌和灰心喪氣的神。<\/p>\n<h3>第一條規則[神操第314號]<\/h3>\n<p>這條規則是有關那些甘願沉溺或受制於特定惡行的人。那甚至可能只是單一的惡行，卻會引致他們在更重大的事情上犯罪。<\/p>\n<p>惡神力求讓這些人保持著上述這種狀態，冀令他們陷入更敗壞的處境。<\/p>\n<p>因此，牠會給他們「明顯的歡樂」，讓他們誤以為人失去那些官能上的歡樂，便無法活下去。<\/p>\n<p>魔鬼不能直接對我們的意志產生作用，而是利用我們的情慾和幻想在我們內引起作用，從而試圖令我們的心神陷入黑暗中。<\/p>\n<p>因此，關注和監察我們的各種感官是很重要的，它們就像我們靈魂的窗戶。<\/p>\n<p>我們必須特別監察我們的幻想和記憶。「明顯的歡樂」比外在的誘惑逗留的時間更長。對於那些「遊走於各種大罪」的人，魔鬼會設法加深他們所處的狀況及誘惑，「讓他們更有可能沉溺在他們的罪惡中，令他們犯更多的罪。」<\/p>\n<p>善神卻會反其道而行，在他們內激發「理性之光。他會喚醒良心的刺痛，讓他們心懷悔疚」。善神感動我們，使我們運用在信德光照下的理性。<\/p>\n<h3>因此，魔鬼在我們的情慾層面上工作，並從那裏開始在靈性層面上攻擊我們。但天主採取的行動直接影響我們的靈魂。<\/h3>\n<p>善神激發良心的悔疚，也就是說，使他們感到不安，進而引導他們改善。<\/p>\n<h3>第二條規則<\/h3>\n<p>跟這條規則有關的人和第一條的不同。他們是在靈修生活中「奮進」的人。這些人有相反的體驗：「惡神的特徵是以焦慮去滋擾，以憂傷去打擊，並由『謬誤的推理』所支撐而引致的種種障礙，令人的靈魂深感不安。」<\/p>\n<p>另一方面，「善神的特徵卻是激發勇毅和力量、安慰、眼淚、啓迪及平安。」<\/p>\n<p>惡神是
