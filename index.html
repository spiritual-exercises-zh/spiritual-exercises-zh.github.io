焦慮的根源，是牠暗示了謬誤的理性而造成的。牠讓我們覺得事情比真實情況更困難。<\/p>\n<p>當聖金口若望評論聖伯多祿的話：「你們的仇敵魔鬼，如同咆哮的獅子巡遊，尋找可吞食的人」(伯前5：8)，他說魔鬼常在我們周圍，尋找我們的脆弱點；而當牠找到時，牠第一件要做的事就是要使人氣餒。<\/p>\n<p>例如，魔鬼通過我們的良心就有關已過去的罪所產生的悔疚，或就有關眼前的挑戰和誘惑所引起的悔疚，便做到了。同樣地，也用於有關將來的誘惑………，而事實上，不論是過去或將來，為天主並不要緊。<\/p>\n<p>善神卻做相反的事：他帶來安慰，給予我們勇氣、光明和內心的平安，掃除我們靈性生命在成長上的障礙。因此，當一個人尋求美善時，缺乏平安無疑就是惡神存在的明確跡象。<\/p>\n<p>關於這兩條規則，我們應該記住，我們的靈修生命是一場戰鬥。這場戰鬥當中，善神和惡神都不是決定性的因素：憑藉天主的恩寵，我們才是決定結果的人。然而，我們必須辨別在我們身上起作用的各種神類。這些規則如此重要，是因為要知道怎樣應付各種神類。<\/p>\n<h3>第三條：神慰[316]<\/h3>\n<p>神慰的本質是三種超性美德的成長體驗｡「神慰」一詞包含了各種不同的經驗：「………當一個人因天主的愛流淚時，無論是爲罪過而悲傷，還是由於我們的主基督的苦難………信、望、愛的每一分增長，以及所有內在的喜樂和由這種喜樂所招引的天上神聖的事………」<\/p>\n<p>關鍵要素是三超德的增長。它是一種靈性上的增長，未必是我們的感官可體驗到的東西｡<\/p>\n<h3>第四條：神枯<\/h3>\n<p>在這裏，聖依納爵也描述了他所謂的神枯。它包括各類型的的心靈狀態，但關鍵要素是不能經驗到愛。它的經驗有如天主已告別我們並遠去了。天主好像遠離了，我們被留在黑暗中。<\/p>\n<p>很重要的是，在衆多類型的神枯中，都存在各種形式的誘惑。<\/p>\n<p>值得重視的，是從這兩種心靈的狀態――神枯和神慰――產生了各式各樣的思想。對這事實的認識是很重要的，以便我們預期這些思想屬意料中事，且又懂得如何應付 它們。聖依納爵在第五至第九條規則指示我們如何處理神枯。<\/p>\n<h3>第五條規則：「……在神枯的時候，我們不應該做任何改變……」<\/h3>\n<p>當我們在神枯時，總會聽到魔鬼較多的暗示，「正如在神慰中，善神引導我們，勸勉我們一樣；在神枯中，惡神也指引我們，誘導我們。如果依從他的指引，我們永遠不能做到正確的決定。」<\/p>\n<p>尤須緊記，魔鬼比我們更聰明，因此我們絕不能與魔鬼對話。<\/p>\n<p>在神枯中，惡神使我們經歷心靈的黑暗，並導致我們灰心喪志；他突出並強調一些半真半假的話來達到目的。要不然，他讓我們想到未來：「我還要否定自己多久……?」<\/p>\n<p>相比之下，善神致力培養，讓我們受到鼓勵。<\/p>\n<p>卡薩諾瓦神父(Fr. Casanova)說：「在神枯中，我們必須擺脱我們的幻想、擺脱我們的感情、擺脱我們的思想、擺脱對我們意志的各種阻礙，這些阻礙往往會中止我們原先 已下的決定和決心。」……「面對如此狡猾邪惡的敵人，我們需有充份準備好的和堅定不移的意志。」<\/p>\n<p>因此，即使在較次要的事情上，我們也不應該讓步。我們必須在小事上忠信，這樣才能在大事上也忠信。<\/p>\n<p>我們應該反複提醒自己：「在世界上你們要受苦難；然而你們放心，我已戰勝了世界。」（若一16：33)「若是天主偕同我們，誰能反對我們呢？」（羅 8：31)。在任何困難面前，我們都應該像聖保祿一樣說：「天主是忠信的，他決不許你們受那超過你們能力的試探，天主如加給人試探，也必開一條出路，叫你們能夠承擔。」（格前10：13) 我們應當靠信德生活，也要致力於信德的行為。「義人因信德而生活。」（羅1：17)<\/p>\n<p>耶穌在船上睡着了，門徒前來喚醒他說：「主！救命啊！我們要喪亡了。」<\/p>\n<p>耶穌對他們說：「小信德的人啊！你們為什麼膽怯？」（瑪8：26)<\/p>\n<p>阻礙只是表面多於真實的，因為我們倚仗的是天主的恩寵：「我賴加強我力量的那位，能應付一切。｣（斐4：13）<\/p>\n<h3>第六條規則<\/h3>\n<p>這條規則與前一條規則是一致的，但在這裏，聖依納爵展示了他的軍事特色，因爲他說：「我們加強對抗神枯的做法是有利的」，從此便由有名的法則「Agere contra」所取代，即是當我們受到誘惑時，立即對付並抗拒我們的自然慾望和魔鬼暗示的一切。<\/p>\n<p>例如，當受誘惑而出現心緒不寧的特徵時，我們應該透過信德和倚靠的行動來保持平安。同樣地，我們應該對付自己的懶惰或憂鬱的傾向，從而打消那些令我們沉淪的思想；或許也要抗拒我們的慾情，當慾情正在與心靈對抗的話。<\/p>\n<p>聖依納爵給了我們三個忠告：我們可以更熱切地祈禱、默想和更徹底地省察。我們也可以用適當的方式努力做一些補贖。<\/p>\n<p>在他導言中的觀察，聖依納爵說[第13號]：「我們必須記住，在神慰時，只需少少努力就很輕易持續並完成一整小時的默想；但在神枯時，這是很難做到的。<strong>因此，爲了抗擊神枯並戰勝誘惑，奉行神操者必須在神操的功夫上維持一整小時及更長一點點的時間<\/strong>。所以，奉行神操者要讓自己不僅會習慣於抗拒仇敵，甚至要打倒他。」<\/p>\n<p>聖依納爵同樣說，我們必須堅持省察自己，特別是通過考察我們的説話和一連串思想的演進:它們從哪裏開始，是來自善神還是惡神？如果它們導致我們感到神枯，它們不可能來自天主。<\/p>\n<p>最後，聖依納爵建議我們一些可以做的補贖形式。<\/p>\n<p>「當奉行神操者尚未找到他一直想尋求的東西，例如淚水、神慰等，改變一下補贖的方式，比如說：以食物、睡眠或其他方式來做補贖，通常都會有用。」[第89號]<\/p>\n<h3>第七條規則<\/h3>\n<p>在神枯的時候，<strong>我們必須用以信德爲基礎的思想來武裝自己<\/strong>。<\/p>\n<p>「免得我因那高超的啟示而過於高舉自己，故此在身體上給了我一根剌，就是撒殫的使者來拳擊我，免得我過於高舉自己。關於這事，我曾三次求主使它脫離我；但主對我說：『有我的恩寵為你夠了，因為我的德能在軟弱中纔全顯出來。』。所以我甘心情願誇耀我的軟弱，好叫基督的德能常在我身上。為此，我為基督的緣故，喜歡在軟弱中，在凌辱中，在艱難中，在迫害中，在困苦中，因為我幾時軟弱，正是我有能力的時候。」（格後12：7-10）<\/p>\n<h3>第八條規則<\/h3>\n<p>「當一個人身處神枯時，他應該力求堅持耐心。」<\/p>\n<p>「我知道我所信賴的是誰。」 (弟後 1:12)<\/p>\n<p>「我們連在磨難中也歡躍，因為我們知道：磨難生忍耐，忍耐生老練，老練生望德，<\/p>\n<p>望德不叫人蒙羞。」 (羅 5:3-5a).<\/p>\n<p>「沒有受過考驗的人，知道什麼？」 (德34:9 Qui non temptatus est quid scit).<\/p>\n<h3>第九條規則<\/h3>\n<p>神枯的主要原因：<\/p>\n<p>聖依納爵談到我們陷入神枯的三個主要原因。<\/p>\n<p>「首先是因為我們一直溫吞不熱、懶惰或<strong>疏忽了鍛鍊我們的虔敬<\/strong>。」<\/p>\n<p>「第二是因為天主想考驗我們，看看一旦失去了神慰的豐厚賞賜時，<strong>我們還有什麼價值<\/strong>？」<\/p>\n<p>「第三個原因是因為天主想讓我們真正認識和<strong>了解自己<\/strong>。」<\/p>\n<p>這些都是主要的原因：一個取決於我們自己，而另外兩個取決於天主的眷顧。<\/p>\n<p>第一個原因是我們不够慷慨，卻對天主不冷不熱。如果我們不盡全力尋求天主，天主就不再與我們交往。<\/p>\n<p>不管我們的神枯根源是什麼，我們應總是以<strong>忍耐<\/strong>來回應，並<strong>強烈地對抗神枯本身<\/strong>。<\/p>\n<p>認識以下這一點是重要的：這些淨化的進程會充分光照我們的靈魂，亦是促進靈修進益的重要途徑。<\/p>\n<p>卡薩諾瓦神父(Fr. Casanova)給我們解釋：「神慰並非漫無目的，它旨在促使我們更投身侍奉天主。」<\/p>\n<p>我們往往傾向把事物本末倒置：將本來應是目的，卻變成手段，反之亦然。<\/p>\n<h3>第十條規則<\/h3>\n<p>聖依納爵給了處於神慰的人如何思考的忠告：「當一個人享受神慰時，要讓他考慮一旦處於隨之而來的神枯時，他將如何自處來應對，並儲備供應充足的力量，以抵禦那一天。」<\/p>\n<p>卡薩諾瓦神父(Fr. Casanova)：我們不應太執著於神慰，卻應在侍奉天主上日益成長。有時一次的神慰就能提供克服許多困難的內在力量。有人說苦難會的會祖聖十字保祿，他在十八歲之前非常熱心。但從此以後，他一直生活在完全漆黑之中。天主已經準備好讓他帶着先前的神慰去背那個十字架。德蘭修女也是如此。<\/p>\n<p>卡拉桑斯的聖若瑟(St. Joseph of Calasanz)以一種非常特殊的方式接受了試煉。他被所屬的修會干擾了十年之後，連修會也被鎮壓了，而修會的長上一直都迫害他；後來他被綁在羅馬的街道上，並被送到教廷聖部。有一天他對他的祕書說：「我認識一個人，為了天主在他心裏默啓的一句話，忍受了十年的鬥爭、矛盾和各種磨難」。這位祕書明白他說的是他自己………。十年過後，當困難仍持續，聖人重複着同樣的話時，(這次他說成「二十年了」………)而他的秘書再次明白了。<\/p>\n<h3>第十一條規則<\/h3>\n<p>「享受神慰的人應留意要盡可能貶抑自己，降低自己的身份。」<\/p>\n<p>另一方面，一個處於神枯的人應該記住，通過已給予他的足夠恩典，他可以做很多事情來抵擋他所有的仇敵。」<\/p>\n<p>「我們也知道：天主使一切協助那些愛祂的人，就是那些按祂的旨意蒙召的人，獲得益處。」（羅 8：28 <em>Omnia Cooperantur in Bonum<\/em>)｡<\/p>\n<p>最後三條規則是爲了警告和指導我們有關魔鬼對我們所採用的策略。<\/p>\n<h3>第十二條規則<\/h3>\n<p>仇敵[………]在未展示力量時是個弱者，如果任由他的意志主導，他就成了暴君。他像是一頭被綁著的狗，我們不應該被他嚇倒。因此，我們必須堅決反對他。如果我們堅決拒絕誘惑，它就會失去力量。然而，如果我們開始與誘惑對話，那麼我們註定會失敗。我們應該挺身去頂住他（“Poner Rostro”)。<\/p>\n<h3>第十三條規則<\/h3>\n<p>「我們的仇敵的行事方式，也可以比作一個虛僞的情人.」<\/p>\n<p>補救措施：<\/p>\n<p>—經常接受靈修指導；<\/p>\n<p>—真誠地接受靈修指導；<\/p>\n<p>—溫馴地接受靈修指導。<\/p>\n<p>它就像一本書：爲了能夠閱讀它，人必須打開它……<\/p>\n<h3>第十四條規則<\/h3>\n<p>「我們的仇敵的行爲，也可以比作一個領導人的策略，他意圖奪取和搜刮他想要的陣地。」<\/p>\n<p>「你們的仇敵魔鬼，如同咆吼的獅子巡遊，尋找可吞食的人。」（伯前5：8）<\/p>\n<p>補救措施：每天省察自己的良心：「醒悟祈禱罷！免陷於誘惑。」（瑪26：41)<\/p>\n<p>參閱：Scaramelli「Il Discernimento degli Spiriti」(辨別神類)，以及坎特伯雷的鮑德溫(Baldwin of Canterbury) 關於辨別神類的論文｡<\/p>"}], "notes": []}, {"id": "2-02", "num": "02", "kind": "默想要點", "title": "原則與基礎 I", "veni": false, "sections": [{"name": "默想", "html": "<h3>第一個原則與基礎 ─ 天主<\/h3>\n<p>閱讀第23 號。<\/p>\n<p>為我來說，天主是誰？當聖多瑪斯 ‧ 阿奎納還是個孩童時，他會問修道人：「天主是什麼？….」<\/p>\n<p>天主是永恆不變的，天主是一個有位格的神 (Spirit)，超越一切的，以及守護眷顧一切的。<\/p>\n<p><em>人受造的目的，是為讚美、崇敬、事奉我們的主天主，並藉此使自己的靈魂得救。<\/em><\/p>\n<p>默想的第一部分有兩方面：<\/p>\n<ol>\n<li>第一方面是關於我們作為受造物的狀況。<\/li>\n<li>\n<p>第二方面是關於我們受造的目的。<\/p>\n<\/li>\n<li>\n<p><strong>第一方面是關於我們作為受造物的狀況<\/strong><\/p>\n<\/li>\n<\/ol>\n<p>假如我們認真看待我們是受造物的事實，我們可從這個真理獲得許多益處。我們完全依靠天主。聖保祿說：「我們生活、行動、存在，都在他內」(宗17:28)。<\/p>\n<p>如果我們花一些時間察看我們的四周，我們會發現很多的事物，大大吸引了我們注視天主所創造的奇妙大自然。自然界的每樣事物就如一首讚美造物主的詩歌。<\/p>\n<p>不同種類的動物，由細小的昆蟲以至巨大的哺乳類動物；物種各有不同，活動習性亦各有不同。我們在空中、在海洋中、在地上、在地下，到處都可找到不同的受造物。而每個受造物都是由天主所創造的。<\/p>\n<p>天主維持我們的生命及支撐我們的善行 (能量之源)。<\/p>\n<p>這是我們謙遜的根據。「你有什麼不是領受的呢？」(格前4:7)。「一切美好的贈與，一切完善的恩賜，都是從上，從光明之父降下來的」(雅1:17)。<\/p>\n<p>聖多瑪斯說：「謙遜主要是指我們順從天主，由此我們開始邁向成全」(神學大全第二集，第二部，第161題，第 1 節，釋疑5)<\/p>\n<p>聖奧思定亦說：「宗教的首要事情是謙遜，第二是謙遜，而第三亦是謙遜」(書信Epistle 118)<\/p>\n<p>栖亞那的聖加大利納認為我們「除了罪之外，什麼也不是」……<\/p>\n<p>我們知道謙遜有多重要，因為「天主拒絕驕傲人，卻賞賜恩寵於謙遜人」(雅4:6)。「上主所造的各有其用意」(箴16:4)。「我是上主，這是我的名字；我決不將我的光榮讓與另一位」(依42:8)。<\/p>\n<p>但是，所謂的<strong>新尊嚴<\/strong>要求新的、積極的自由，自由自主去改造我們的性別；去與某人結婚而不用考慮性別或生育的可能性；去選擇我們死亡的時刻，並得到專業醫學人士的協助去結束我們的生命；去不單終止一個胎兒在子宮內孕育，更利用他或她的器官以謀取商業利益。新尊嚴亦要求新的、消極的自由――妄求個人自在，可免除不想有的痛楚和不適，免於在加諸自己身體或利用它自決做些什麼時所受的局限，免於那些冒犯我或挑戰我所作的決定的言語或思想。<\/p>\n<p>尊嚴不再著眼於我們是誰或我們是甚麼，而是著眼於我們那不受拘束的意志能做什麼，及它能制止他人作什麼。<\/p>\n<ol>\n<li><strong>第二方面是關於我們受造之目的<\/strong><\/li>\n<\/ol>\n<p>現今人們很忙碌，這是個不爭的事實… 但許多時候，他們甚至沒有思考他們存在於此的最終目的是什麼。<\/p>\n<p>如果我們環視四周，嘗試去察看天主的化工，那麼，除了發現受造物的美之外，我們還會找到許多奇妙的東西。<\/p>\n<p>我們將會看到，每一個受造物都不是隨機被創造，沒有一個受造物不是憑著指派目的而創造的。反之，萬物都有其恰當性、指定功能及受造的原因。山脈形成屏障，使雲在此隨處凝結；風乘載著雲，使雨降落大地；樹木是地球的肺葉，使其得以呼吸，如此類推。每一種動物都有其獨特的角色，並與植物和大地，一起構成<strong>生態系統<\/strong>，在其內每個受造物都有其受造的目的和用意。自然界中沒有一樣東西是偶然的，正如智慧書所說的：「你處置一切，原有一定的尺度、數目和衡量」(智11:20)。沒有東西能脫離天主的控制。祂給每樣事物一個角色，它們將會是完成其使命的要角。<\/p>\n<p>我們以人手製造的物品亦一樣：每件物品都按其特定目的造出來，而且，這個終結目的是個第一目標。首先你要知道你想做什麼，然後你去尋找方法。如果將次序顛倒過來，就會變得非理性，並違反事物的本質。這個法則對任何一個領域的創造都有效。<\/p>\n<p>舉個例子：我們想像一下世上的第一個木匠，並假設他發明了釘子去將兩塊木材連接起來。現在他的問題是如何將釘子釘進木塊中。經過計算和思考，他終於發現或發明了鎚子。原來鎚子是與釘子扣緊起來運用的。你可嘗試用鎚子來扭緊螺絲，或用螺絲刀來釘釘子，但這是辦不到的。鎚子是為釘子而設，螺絲刀是為螺絲而設，至少發明它們的本意是如此。這是十分重要的。各種特定物件究竟是為了什麼而製造的？<\/p>\n<p>人類不可逃脫這一個法則。我們都是天主所創造的，是除天使以外最完美的受造物；當我們仍活在世上時，亦會有一些特定的事須由我們去完成，我們有目標要實現。天主給予我們生命一個最大可能的目的：讚美祂、光榮祂、事奉祂，好使我們離開這個世界時，可以前往與 天主一起生活於永遠的福樂中。這就概括地指出了我們受造的目的。我們不單偕同天使，亦偕同每個受造物一起光榮及事奉天主。<\/p>\n<p>因此，我們可問自己：<\/p>\n<p><strong>天主是誰 ？――<\/strong> <strong>我是誰？――<\/strong> <strong>天主與我的關係怎麼樣？<\/strong><\/p>\n<p>「他於創世以前，在基督內已揀選了我們，為使我們在他面前，成為聖潔無瑕疵的」(弗1:4)。<\/p>\n<p>我對天主有怎樣的認識？為我來說，天主是誰？我與祂的關係怎麼樣？我的祈禱生活有多重要？我對領受聖事的依賴有多頻密？<\/p>\n<p>我與祂的關係怎麼樣？我信靠天主嗎？我能在生活中看出自己真的相信天主嗎？…… 我對良善的、全能的、睿智的、慈悲的、守護並眷顧著人類的天主懷有望德嗎？<\/p>\n<p>我們作為基督徒已獲天主邀請，與祂保持一份特殊的友誼。但是，在實踐上，許多時候在我們生活的某些方面， 天主並沒有位置……。「沒有人能事奉兩個主人：他或是要恨這一個而愛那一個，或是依附這一個而輕忽那一個」(瑪6:24)。<\/p>\n<p>我的祈禱生活是怎麼樣……？ 我怎樣滋養它？我常閱讀什麼讀物？<\/p>\n<p>幾時我們以尋求舒適作為生命的最終目標，我們即停止以尋找天主為優先。<\/p>\n<p>當我們面對自己的過失， 因醒悟自己的弱點和缺陷而灰心喪氣時，我們便停留在天主沒有能力改變我們的想法中。<\/p>\n<p>當我們埋怨發生在我們身上的一些負面的事情、問題和挑戰時，我們便失去了喜樂，而我們 卻有如這些事情不受天主所掌控般回應，那麼我們的取態就如同一個無神論者一樣。<\/p>\n<p>當聖瑪麗‧麥姬洛修女被處以絕罰時，她說：「我真的像置身於夢中。我似乎沒有意識到主教和神父的存在；我知道我看不見他們；但我感覺到，噢，他們對自己職務的熱愛，這份熱愛，也是對這處罰的一種敬畏，那才讓我知悉這處罰正被全力地傳達給了我。我不知道如何描述這個感覺，但我感到強烈的喜悅，並感到與天主從沒如此親近。我永不會忘記天主臨在時那份平靜而美好的感覺」(保祿 ‧ 加德納，《聖十字瑪麗》，第105頁)。<\/p>\n<p>阮文順樞機說：「在我九年遭受隔離監禁的漫長折磨當中，在一間沒有窗口的斗室裡，有時一連好幾天燈光日夜照射著，有時卻連續數周漆黑不見五指；又熱又濕，令我感覺快窒息了，快瘋掉了！當時我尚是一名年輕的主教，只有過八年的牧職經驗。我無法入睡，一想到我被迫放棄教區，看著我為天主所創辦的許多事業毀於一旦，心中萬分憂苦，我感覺到整個人正從內作亂起來。<\/p>\n<p>有一夜，打從心底深處有聲音告訴我：『你為什麼這樣折磨自己？你要學會辨別「天主」和「天主的工作」這兩件事。你已做了的並想繼續做下去的工作：牧靈探訪，培育修生、男女修會會士、平信徒和青年，興建學校、向外教人福傳的傳教中心等等，這一切都是很美好的工作，但卻都是天主的工作，而不是天主！如果天主要你放棄這一切工作，並將自己交託於祂的手上，你就該立刻照著做，並信賴祂。天主將會把你的工作託付給別人，那些比你更有才幹的人。你選擇了天主，而不是祂的工作！』<\/p>\n<p>這道亮光給了我全新的力量，完全改變了我的思維方式。它幫助我克服肉體上幾乎不可能 忍受的困難時刻。從那時起，一種新的平安充滿我內心，並伴隨我受囚禁達十三年之久。在重重困難當前，我感悟到我人性的軟弱，惟我會再次肯定我的抉擇，而我一直充滿平安。選擇天主而不是天主的工作。這是任何世代基督信徒生活的基礎。我明白生命的每一刻都是一連串的選擇，選擇天主或是天主的工作，每次都是新的選擇，每次選擇都是一次皈依。未能全心信賴天主，卻往他處尋找靠山和保障，這經常是天主子民受到的試探，連一些英雄人物，如梅瑟、達味、撒羅滿，也遭受了這種痛苦的經歷…」(《希望的證人》，<em>Testimony of Hope<\/em>, 42-43)。<\/p>\n<p>亞巴郎……<\/p>\n<p>因此，讓我們默想原則與基礎的第一部分：<\/p>\n<p><em><strong>人受造的目的，是為讚美、崇敬、事奉我們的主天主，並藉此使自己的靈魂得救。<\/strong><\/em><\/p>\n<p>這是我們生命的目標，我們必須為此而活。<\/p>\n<p>我們將這神操交託在聖母手中。<\/p>"}], "notes": []}, {"id": "2-03", "num": "03", "kind": "默想要點", "title": "原則與基礎 II", "veni": false, "sections": [{"name": "默想", "html": "<h3>原則與基礎 ─ 受造物<\/h3>\n<p>在默想的第一部分確立了我們存在的目的後，聖依納爵跟著處理另一個課題――即環繞我們四周的其他事物。它們都是為我們而造的，是為幫助我們達成我們之所以受造的目的。<\/p>\n<h3>因此，只要世物能有助人達成目的，他便要盡可能 運用它；有多少幫助，便取用多少；而世物要是為人構成妨礙，他便須直截棄掉它。<\/h3>\n<p>因此，在這部分，我們會探討 關於取用受造物的課題。<\/p>\n<p>在預備經中，求我們的主天主，賞我聖寵，使我的一切意向和行為，都為事奉讚美至尊無比的天主。(第46號)<\/p>\n<p>我們可為這 默想祈求 一份恩寵：即認識 有關受造物的現實、它們的本質，它們給我們可能構成的危險，並祈求能認識自己的「偏情」[「過度的執著」] (對某人或某事物在情感上的依賴)，俾能整理好它們的秩序。<\/p>\n<p>如果我們在天主的光照下評定各種事物，我們會意識到它們的價值是十0分相對的。<\/p>\n<h3>什麼是「其他事物」？<\/h3>\n<p>除了天主或我本人以外的任何東西，便是其他事物，不論是屬於自然界的，例如身外物、身體，或是與靈魂有關的東西，就如我們的天賦才能；還有，屬於超越本性及自然界的事物 (我們可能以錯誤的方式對某些屬靈的東西過於依賴)。<\/p>\n<p>「其他事物」是任何會對我們的生命產生影響的事物。每個人、每處地方，或每件事物；每一種快樂或痛苦；我們身處的每一種情境；每一種思想和每一種欲望；看見的每個景象，或聽到的每種 聲音――全部都在天主的計劃內，以成為引領我們往天堂的多種恩寵。<\/p>\n<p>對天主而言，沒有一件事物是偶然的。每件事物都是天主愛的計劃的一部分，是天主細心並一絲不苟地構想出來的，好使我們能到達祂那裡，而唯有在祂內我們的心才能找到安息。<\/p>\n<p>天主在我們四周安置了一切事物，它們既不是天主本身，也不是我自己，而是為在我們的靈修生活上給 我們幫助。<\/p>\n<p>「上主天主說：『人單獨不好，我要給他造個與他相稱的助手。』」(創2:18)。<\/p>\n<p>在天主的心意中，整個的創造及其內的一切事物，都是為了幫助我們。<\/p>\n<p>這就是聖依納爵在這默想中說的：其他的一切是為我們而造成的，是為幫助我們實現我們之所以受造的目的。但是，它們可能成為一種真正的障礙而非助力。<\/p>\n<p>「沒有人能事奉兩個主人」(瑪6:24)。因此，必須小心運用世物，好讓它們不會成為我們的主人。<\/p>\n<p>世物是為我們而受造的，故必須受制於這目的， 並不是相反過來。<\/p>\n<p>愛具有變革轉化的力量：它能使情人 變成他所喜愛的模樣。因此，若我們以錯誤的方式 (不恰當地)去愛「其他事物」，我們會被它們所轉化。我們會變成它們的奴隸。聖奧斯定說：「若你愛大地，你便變成大地；若你愛天堂，你便變成天堂。」<\/p>\n<p>當然，我們不可能摒棄世上的東西。但是，我們必須以正確的方式取用它們，而永不濫用它們 ，我們尤其要為我們的愛預設規範，使得我們不會將任何事物置於天主的正當地位之上，或與祂的地位對立。<\/p>\n<p>為達到這個目的，聖依納爵頒布了一條黃金法則：能……多少，便…… 多少(…..<em>tanto cuanto…<\/em>)。<\/p>\n<p><em>我們須將這法則應用於取用世物，只要它們對達成我們的目的__能有多少助益__，__便__取用__多少__；能造成多少妨礙，便從我們中間摒棄多少。<\/em><\/p>\n<p>這是一條非常堅實而合理的法則。假使每當我們必須作出選擇時，我們都能記住這一條法則，我們將經歷靈修生活上的極大成長)。它亦幫助我們辨別事物的相對價值。<\/p>\n<p>這條法則分為兩部分：<\/p>\n<p>1) 第一部分可稱為_積極_ 的法則。我們應該取用這些世物，只要它們能幫助我們更親近天主便可以了。「天主看了祂造的一切，認為樣樣都很好」(創1:31)。<\/p>\n<p>聖多瑪斯在他有關天主經的評注中指出「賞給我們日用的食糧」的祈求，是求賜一切所需的東西，以幫助我們度一個 聖善的生活，和成為一個良好的基督徒。<\/p>\n<p>無論如何，我們取用任何世物時，都要把它們當作不屬於我們的一樣：<\/p>\n<p>「 時限是短促的，今後有妻子的，要像沒有一樣；哭泣的，要像不哭泣的；歡樂的，要像不歡樂的；購買的，要像一無所得的；享用這世界的，要像不享用的，因為這世界的局面正在逝去」(格前7:29-31)。<\/p>\n<p>我們必須謹記，在這個積極的意義下，我們為得救，必需取用很多世物。例如聖事、祈禱生活、善工、補贖等。同樣地，這條法則亦適用於 傳教工作。作為一個平信徒，我必須履行一些宗徒職務，只是與獻身修道人工作的方式不一樣。<\/p>\n<p>2) 這法則也有_消極_的一面。我們必須遠離那些世物，只要它們對我們的得救成為障礙。可以這麼說，我們的靈修生活就像一場我們內心的戰爭，不同種類的愛正在決鬥。意思是，內心在不斷掙扎，要根除那些與福音的標準及行為準則不相容的東西。<\/p>\n<p>「偏情」究竟是什麼？<\/p>\n<p>在現代天主教詞典中，哈頓神父 (Father John A. Hardon, S.J.) 定義執著 (attachment) 如下：「某人對另一個人，或某人對某些真實的或虛幻的事物，在情感上的依賴……；為要在成聖方面有所進益，首要條件是對自己的執著有所控制。」<\/p>\n<p>聖十字若望以一個例子來說明我們有需要完全克制我們故意的欲望[voluntary desires即經過同意的欲望]。他指出，一隻小鳥被拴在地面，不論用幼細的線或粗大的繩子，並沒有差別 (《攀登加爾默羅山》，第1卷，第11章，第4節)。意思是：不管執著的程度有多大並不要緊，因為任何執著都會妨礙我們奔向 天主。<\/p>\n<p>當我們取用事物：<\/p>\n<ul>\n<li>多於我們所需時，<\/li>\n<li>不是為了其存在的原定目的，而是為了其他目的時，<\/li>\n<li>作為目的，而不是作為達到正當目的的方法時，<\/li>\n<\/ul>\n<p>我們便沒有 好好駕馭我們的執著。<\/p>\n<p>自私的執著會在靈修的迷霧中把我們定位，妨礙了我們超性的視野。這時我們便難以辨別什麼是正當的欲望，什麼是偏情。下列問題或許可幫助我們坦誠地了解自己：<\/p>\n<ul>\n<li>我是否取用受造物多於我實際的需要？例子：我有多少雙鞋子，相對於我實際需要多少？ 我們可應用這個問題於任何物質擁有物上。我花多少時間看電視？<\/li>\n<li>我取用事物是否為了其存在的原定目的？例子：若我的僱主為方便我的工作而提供電腦給我，我是否花時間用它來發私人電郵，進行不必要的網頁瀏覽或娛樂(假定現有政策禁止如此用途)？<\/li>\n<li>我是否將人或事物本身作為目的，而不是作為達到目的的方法？例子：我與別人建立關係時，是否只藉以讓自己所需要的獲得滿足，多於我關注那關係對別人的福祉？<\/li>\n<\/ul>\n<p>就我對上述有關我與別人的關係，以及我取用事物的情況作出回應時，我是否通過它們更 親近天主？它們使我更頻密地思念祂嗎？我是否藉著它們引領而進入更深切的祈禱？<\/p>\n<p>識別偏情，在自身內覺察它們的存在，並透過實際可行的割捨計劃去處理這些偏情，可使人 感受更大的自由，並樂於接受天主甘願慷慨賜予我們的恩寵。<\/p>\n<p>聖經時常把我們的愛說成有如犯奸淫和崇拜偶像，意思是指我們將我們對天主的愛與對其他事物的愛混為一談。這是因為我們過度偏愛自己。<\/p>\n<p>聖十字若望說：「愛就是為了天主，剝除和擺脫所有不是天主的一切」(《攀登加爾默羅山》，第2卷，第5章，第7節)<\/p>\n<p>聖奧思定說：「那些人既愛你，亦愛其他並不屬於你的，他們對你的愛是不冷不熱的。」<\/p>\n<p>把對天主的愛分了一部分給其他事物，便洩露了我們對天主的觀念有所 貶損。按以上分析，這好像表示天主為我們並不足夠。「我的人民犯了雙重的罪惡：他們離棄了我這活水的泉源，卻給自己掘了蓄水池，不能蓄水的漏水池」(耶2:13)。<\/p>\n<p>許多時候，崇拜偶像是指我們自己：尋求自身的利益、欲望、意願、自我 … 「誰若願意跟隨我，該棄絕自己，背著自己的十字架來跟隨我」(瑪16:24)。<\/p>\n<p>如遇到利益衝突的情況時，為了天主的緣故，我必須準備放棄一切。「若是你的右眼使你跌倒，剜出它來，從你身上扔掉，因為喪失你一個肢體，比你全身投入地獄裡，為你更好；若你的右手使你跌倒，砍下它來，從你身上扔掉，因為喪失你一個肢體，比你全身投入地獄裡，為你更好」(瑪5:29-30)。<\/p>\n<p>「誰獲得自己的性命，必要喪失性命；誰為我的緣故，喪失了自己的性命，必要獲得性命」(瑪10:39)。<\/p>\n<p>當然，耶穌在這裡所講論的是各種有問題的愛的形式……<\/p>\n<p>因此，當我們取用世物時，利用我們與別人及自己的關係時，必須服從這個簡單的法則：那做法有多大程度有助我們達到我們之所以受造的目的，我才確定會否取用。<\/p>\n<p>聖保祿說：「凡事都可行，但不全有益」(格前10:23)。<\/p>\n<p>這個法則亦適用於取用世物時應採取的措施。這情況像應用 藥物一樣……<\/p>\n<p>同樣地，這個法則不單必須應用於重要的事情及抉擇上，也必須運用於任何事物，甚至在小事上，因為誰在小事上忠信，在大事上也忠信。<\/p>\n<p>我如何應用這個法則：<\/p>\n<ol>\n<li>在我必須取用的事物中：例如我的祈禱生活、彌撒聖祭、對近人的愛、傳教工作、時間的運用等。<\/li>\n<li>在我必須捨棄或遠離的事物中：我的自我 (這是_我的_生命)； 會引致犯罪的任何不需要的事物或場合 (與人的關係、娛樂消遣等)；還有，即使是合法的事物，我必須小心檢視我如何取用那些事物，例如互聯網及社交網絡、食物、衣著、我的自由、我與異性相處的方式、我的財物等。<\/li>\n<\/ol>\n<p>我可從我個人 自由的角度進行這個默想：只有那些不被世物奴役的人才是自由的。<\/p>\n<p>聖類思‧公撒格：「這與永生有什麼關係？」(<em>Quid est hoc ad aeternitatem?<\/em>) …<\/p>"}], "notes": []}, {"id": "2-04", "num": "04", "kind": "默想要點", "title": "原則與基礎 III", "veni": false, "sections": [{"name": "默想", "html": "<h3>原則與基礎 ─ 平心<\/h3>\n<p>我們已談論過我們受造的目的；亦談論過那些必定有助 我們達至這個目的的其他事物；現在聖依納爵建議我們去思考他稱之為「平心」(indifference) 的東西。他所採用的這個技術性詞語，有特別的含意，大家必須掌握好。<\/p>\n<p>閱讀第23號<\/p>\n<h3>第一點：什麼是「平心」？<\/h3>\n<p>乍聽起來，大家會覺得有點不妥：我們必須保持「平心」？<\/p>\n<p>這概念帶有技術上的精確性。它的含意包括相對地割捨所有事物 (以至於它可使我們離開天主) ， 以及對天主的依賴。<\/p>\n<p>聖依納爵教導我們，「平心」是靈修生活得以成長的關鍵。這個名詞會給我們帶來一點困擾，因為當某人說：「我對某事保持平心」，他的意思是：「我並不關心它。」但是，當聖依納爵叫我們對某事保持平心時，他並不是要求我們對它不在乎、或把我們的關心放在一旁。他的意思是我們應更加在乎天主。我們可這樣說：在基督徒的生活當中，平心的意思是，調整好自己，與天主、與祂的受造物，及對塵世生活中的物質依賴，應有的正確關係；而不管是好是壞，這都是我们在世俗生活的一部分。<\/p>\n<p>聖依納爵的「平心」是我們靈修生活的基本態度，這是因為除非人對一切受造物保持「平心」(即：擺脫過度的情感依賴；對受造物錯誤的愛)，否則人不能愛天主在萬有之上。<\/p>\n<p>這表示「平心」與愛有非常密切的關係。就其本身而言，它含有非常積極的意義。的確，這個概念牢牢地建基於聖經，前提是我們要正確地理解它。事實上，只有保持「平心」，我們才能達至我們生命的目的：與天主合而為一。<\/p>\n<p>必須注意的是，「平心」是一種_<strong>意志的傾向<\/strong>__，_而非感情的取向。意思是我們要有堅定不移而果斷的意志：該決志使我們極其渴望達成目標 ――即與天主合而為一，其程度因而令我們渴求 那些導致 達成該目標的方法――而且僅是那些方法。<\/p>\n<p>因此，它不是情感上的不在乎 (漠不關心；冷淡)。聖依納爵並不談論不被受造物吸引的意志。事實上，我們內心對受造物的傾向是永遠存在的；在我們不察覺中，該傾向一直在我們內產生作用。但必須指出的是，即使我們沒有意識到我們的傾向和所受到的吸引，它們也會對我們的抉擇產生很大的影響。它們對意志加設了負擔、偏執，從而將它移向它感到受吸引的事物。這可以用天秤上的指針作為例子來說明：即使指針被拉到一側，平心使它停留在天秤的中間。<\/p>\n<p>平心就是以意志戰勝這些自然的傾向，而其方法是將意志放在正確的位置， 並參照我們的終極目標來量度。平心意味著不讓我們被慾情和錯誤的傾向所支配和征服；即使面對著這些傾向的情況下――它們顯然會繼續存在――幸好由於意志上的平心，我們能夠保持克制並作出正確的決定。這種對激情的控制使我們能夠跟隨聖神的上等光照。<\/p>\n<p>這種平心可以是習慣性的，也可以是實在而短暫的。保持平心的人作選擇時，不一定根據他們的喜惡 (憑個人的本能感受或直覺)，或跟隨當下的情緒，但根據他們經過與聖神的上等啟示互相協調下的意志。<\/p>\n<h3>第二點：平心的程度<\/h3>\n<p>聖依納爵說：「我們對一切受造物必須保持平心」，而對一切受造物是指一切可達到天主的方法。此外：「只要是那些不被禁止而我們能自由選擇的事物上。」<\/p>\n<p>因此，平心是關於美好的而合法的事情，所有不被禁止的事情……人不能對罪(惡)保持平心，(罪必須永遠要被棄絕) / 我們總是須要棄絕罪惡的。平心是關乎美好的事物，而那些事物都屬於我們自由抉擇的範圍。<\/p>\n<p>平心的目的是不容_自主_地對美好的事物產生偏情，那可能會分散我們對生命終極 目標的注意力。這意味著_不贊同_和不屈服於那些感覺和傾向。<\/p>\n<p>平心並不是我們對甚至不在意的事物，持有一種無意識的態度。它反而是由人通過理性的自由意志，對自知會被吸引的事物作出個人選擇的結果。<\/p>\n<p>此外，它的目的也不是為消除我們的慾望。這沒有可能，亦無益處。它的目的在於為混亂帶來秩序。<\/p>\n<p>我們可從耶穌找到例子，祂在苦難中喊出：「父啊！你如果願意，請給我免去這杯罷！但不要隨我的意願，惟照你的意願成就罷」(路22:42)。<\/p>\n<p>平心最重要的意思，就是對天主的意願的極度依從。耶穌的一生便總結於此：「全燔祭和贖罪祭，已非你所喜，於是我說：看，我已來到！關於我，書卷上已有記載：天主！我來為承行你的旨意」(希10:6-7)。<\/p>\n<p>聖瑪麗‧麥姬洛：天主的旨意……<\/p>\n<p>聖多瑪斯 ‧ 阿奎納說，愛是一種團結的力量，將所愛的人和物聯繫在一起。它有無所不包及整全的特質。那些愛天主的人，對其他的一切事物只有一份相對的尊重。<\/p>\n<h3>第三點：平心的對象<\/h3>\n<p>聖依納爵說：「因此，就我們而言，我們不重視健康甚於疾病，不重視財富甚於貧窮，不重視尊榮甚於屈辱，也不重視長壽甚於短命。對其他一切事物，均莫不如此。」<\/p>\n<p>平心從來不是關於我們生命的終結 (這早已定了)，亦不是關於罪 (這是禁區)。它總是關乎方法。它旨在辨別哪種方法會真正幫助我，還是妨礙我……。在聖依納爵的例子中，他向我們展示了平心總是關乎美好的事物。<\/p>\n<p>「我們唯一所願望和所選擇的，應是那更能有助我們達到受造目的之事物」：聖依納爵強調了意志 的角色。<\/p>\n<p>為了知道我們是否真的保持平心，進行以下的省察會對此有所幫助：為什麼；我出於什麼理由採取行動？ 我採取那行動的真正目的是什麼？ 我是否在我所做的事情中尋求自我？<\/p>\n<p>為獲得靈性上平心的狀態就是神操的目的：「其目的是為戰勝自己，調整自己的生活，使人不致因任何偏情影響下，而替自己作決定」(第21號 )。<\/p>\n<h3>第四點：平心的必要性<\/h3>\n<p>為實踐「能…多少，便…多少 」(<em>tanto quanto<\/em>) 這個規則，保持平心是有絕對必要的。要做好神操，就必須保持平心。這很重要，因為不保持平心，便不可能愛天主。事實上，有許多情況和障礙會讓人難以保持平心。<\/p>\n<p>平心背後的原則是這個真理：只有在天主內才能找到我們的幸福。天主是絕對的，餘下一切的都是相對的。<\/p>\n<p>因此，聖依納爵說：「我們必須使我們自己保持平心。」這意味著，平心是我們必須通過的靈性掙扎才能獲得的東西。這是一場內心的鬥爭，為了淨化我們的情感(消極方面)，好使我們能夠自由地愛天主 (積極方面)。<\/p>\n<p>聖多瑪斯說，慈善的其中一個效果是熱忱，而熱忱的特徵是會摧毀所有阻撓我們去愛的障礙。<\/p>\n<p>沒有平心就不可能順從聖神微妙的 (推動) / 提示。<\/p>\n<p>聖類斯 ‧ 蒙福在寫給十字聖架之友的信中，描述了一位自由而保持著平心的基督徒：<\/p>\n<p>「十字架之友是個無所不能的君王兼得勝者，能戰勝魔鬼、世界和肉體的三重強烈肉慾。他以熱愛羞辱，粉碎了撒殫的驕傲；他以熱愛貧窮，克服了世俗的貪婪；他以熱愛受苦，抑制了肉體的官能享受。十字架之友是神聖的，並與可見的事物分隔開，因為他的心提升至高於一切易於消逝及朽壞的事物，天堂才是他的家鄉；他像個旅客和朝聖者般遊歷於今世，而且，他不但沒有全心全意投入 那裡，反而以一種平心觀望它，並以蔑視的態度將它踐踏在腳下。」<\/p>\n<p>當我們作這個默想時，我們可想像各種可以妨礙我們振翅高飛的大小事物………。<\/p>"}], "notes": []}, {"id": "2-05", "num": "05", "kind": "默想要點", "title": "三種罪", "veni": false, "sections": [{"name": "默想", "html": "<h3>三種罪<\/h3>\n<p>我們現在默想「三種罪」，這可在神操第45號中找到。<\/p>\n<p>聖依納爵說，在這個默想中要運用靈魂的三司：記憶、理智和意志。<\/p>\n<p>我們必須採取積極的態度：運用記憶力去回想往事。透過推理、沉思等等去運用理智。在此特別的情況下，尋求理解，思考罪的邪惡及嚴重性。我們必須運用意志來將默想應用於我們自己，並嘗試去理解天主如何對待我，即使我是個罪人。<\/p>\n<p>我們必須由預備經開始：「求我們的主天主，賞我聖寵，使我的一切意向和行為，都為事奉讚美至尊無對的天主。」<\/p>\n<p>第一前導是在腦海中為該場所定像：「設想一個幻景： 將會看見我的靈魂如同犯人般被囚禁在可朽壞的肉身內， 並想起整個我的合成體，有如流亡者在這世間被放逐，以致棲身野獸群中一樣。」<\/p>\n<p>求恩：「在這次默想中，將會祈求羞恥與尷尬不安的真情，因為我曾見過許多人僅由於犯下一條大罪，靈魂因此便永遠喪亡 ，而我曾嚴重犯罪多次，本來就該多次遭受永罰。」<\/p>\n<h3>第一端：天使們犯的罪<\/h3>\n<p>我們可在神操的第50號找到這一端。我應將天使們唯一的罪，與我所犯的許多罪過相比較。<\/p>\n<p>我必須默想天使們的罪。他們是在聖寵中受造的，卻不願主動向天主獻上崇敬和服從，反而因著他們的驕傲自大，便由身處寵愛的狀態，轉化成為被罪惡扭曲的狀態，因此被投入地獄。<\/p>\n<p>「『我要直沖霄漢，高置我的御座在天主的星宿以上；我要坐在盛會的山上，極北之處；我要升越雲表，與至高者相平衡！』然而，你卻下到了陰府，深淵的極處。」(依 14:13-15)<\/p>\n<p>天使們為了一條罪受到絕罰：「天主既然沒有寬免犯罪的天使，把他們投人了地獄，囚在幽暗的深坑，拘留到審判之時」(伯後2:4)。<\/p>\n<p>考慮到這個事實，我們必須仔細思考天主的反應。 天使們說：「我不要事奉」(<em>non serviam<\/em>)。天主是無限公義的，對一條罪以這種方式作出反應……….我犯了許多罪，而祂卻還未曾責罰我。<\/p>\n<p>為了更好地理解罪的凶惡，可思考一下天使由多高的位置墮下。<\/p>\n<p>天使是創造化育的初果。他們是最完美和漂亮的受造物，他們擁有純潔的靈魂、極其聰敏、極度強而有力，然而他們墮落了。我們人類看在眼裡，應感到不寒而慄……..。<\/p>\n<p>由於天使的罪惡如此嚴重，因此天主創造了地獄：「可咒罵的，離開我，到那給魔鬼和他的使者預備的永火裡去罷」(瑪25:41)。<\/p>\n<p>誠然，我們比天使弱得多，因此我們的罪責較輕。可是，我們的罪與天使的罪，在本質上是相同的。 罪總是對天主叛逆 (<em>adversio a Deo<\/em>)，和皈依受造物 (<em>conversio ad creaturas<\/em>)。<\/p>\n<p>因此，我們必須為我們倖免受罰而感到非常羞恥和尷尬不安。天主並沒有像對待天使們那樣譴責懲罰我們。<\/p>\n<p>天使們濫用了自由的恩賜：「他們不想運用天主賜予他們的自由來恭敬讚美他們的造物主」(第50號）。 因此，我必須自我反省。<\/p>\n<h3>第二端：原祖父母的罪<\/h3>\n<p>亞當和厄娃也是在聖寵中受造的。 他們擁有恩寵和超性的身體。 此外，他們還享有各種超自然的恩賜：完好的整合 (理智與感情的和諧關係)、不朽和知識滿溢。 他們可以好好地控制自己的強烈的情感，並且不會生病或感到痛楚。 甚至外在世界也完全受他們支配。<\/p>\n<p>他們由於犯了罪，因此失去了這一切，甚至連他們的本質也受到了傷害：他們經歷了三重肉慾的背叛，以及由此隨之而來的所有後果。<\/p>\n<p>關於原罪的聖經故事是非常重要的。 當厄娃開始和蛇對話時，我們讀到這個藉著巧言令色，並以感嘆形式悉心構思的問題：「天主真說了，你們不可吃樂園中任何樹上的果子嗎？」(創3:1)<\/p>\n<p>蛇直截了當地引起了女人的注意。 蛇的表達方式在於強調：「天主真對你們說了？」此外，這樣的陳述本身就是個謊言。<\/p>\n<p>在這種情況下，厄娃應該拒絕與蛇對話，就像耶穌基督在曠野時所作的一樣，可是她卻繼續與蛇進行對話。<\/p>\n<p>厄娃開始思考禁果的吸引力：「你們將如同天主一樣」……「女人看那棵果樹實在好吃好看，令人羨慕，且能增加智慧」(創3:5-6)<\/p>\n<p>在這情節之前，她甚至沒注意到那棵樹；但當她開始思慮會否變得肖似天主的可能性時，她突然察覺到果子上她從來都沒有察覺到的其他方面，她的意志便漸漸而不經意地變得軟弱。 我們對亞當所受的誘惑認識不多，但我們知道這是一種驕傲的罪。 聖保祿說，在亞當內，人類犯了罪。<\/p>\n<p>這個事件的敘述雖然如此簡短，但代價卻極其高昂。讓我們思考一下這罪所帶來的許多苦難。 讓我們思慮一下我們遭受的諸多恥辱。這一切的發生都是源於一條罪。 那麼我所犯的罪又怎樣呢？<\/p>\n<h3>第三端：有人只犯了一條罪<\/h3>\n<p>「就如罪惡藉着一人進入了世界，死亡藉着罪惡也進入了世界」(羅5:12)。這包括了肉身和靈魂的死亡。 任何一條罪都該受譴責。 聖多瑪斯說，我們始終要回歸天主所依據的原則，就是我們的最後目的。這要靠愛德 (愛) 來實現。犯罪使人斷絕與天主的連繫，故不再認識天主，亦失去以天主為歸宿而無法成全我們的終極目的。這個損失並不小。為擺脫這種情況，唯一的方法要靠天主的助佑：唯有天主可以帶我們脫離罪惡的盲目 (神學大全，第二集，第一部，第87題，第 3 節)。<\/p>\n<p>此外，無論誰犯了罪，以自己的永恆得罪了天主 (<em>in suo aeterno_神學大全，第二集，第一部，第87題，第 3 節，釋疑 1)，便為此應該受到永罰，因為「無論何時，他的意志時常處於恆常犯罪的狀態」(_Voluntatem habet in aeternum peccandi<\/em>)。故此教宗額我略一世說：「惡人希望永遠活下去，好能永遠留在罪惡中」(Iniqui voluissent sine fine vivere，ut sine fine potuissent in iniquitatibus permanere)。<\/p>\n<p>許多人只犯了一條罪，便被罰下地獄，而我………… (閱讀第52號)<\/p>\n<p>對禱 (閱讀第53號)<\/p>"}], "notes": []}, {"id": "2-06", "num": "06", "kind": "默想要點", "title": "己罪", "veni": false, "sections": [{"name": "默想", "html": "<h3>論我們的罪過<\/h3>\n<p>預備經：第46號<\/p>\n<p>定像 (即觀看地點)： 與上一個默想相同。<\/p>\n<p>求恩：為我的罪，祈求日益加深而強烈的痛悔和眼淚。<\/p>\n<p>這個默想的目標，並非有如上一個默想那樣去細想罪的凶惡，而是去想我自己所犯的罪如何凶惡。目的不是使我們行事時有諸多顧忌，而是令我們悔改，即痛悔己罪，並改過遷善。<\/p>\n<p>痛悔的意向非常重要，這一點可以從這個默想的對禱 (交談) 中看出來。為能達到真心痛悔的心態，我們要把自己的罪過與天主的慈悲加以對照比較。<\/p>\n<p>聖依納爵想我們看出我們的罪行和天主無窮美善之間的巨大對比，好使我們受感動而轉化皈依．堅定地信賴天主。<\/p>\n<p>他建議我們細想以下五端。<\/p>\n<p>正如大家所知，我們無需全部完成這五端默想。如果我們從某一端找到要旨，就該像蜜蜂或蝴蝶那樣邊停留在該處，邊尋找果實。<\/p>\n<h3>第一端：檢討我(一生)所犯的罪過<\/h3>\n<p>閱讀第56號<\/p>\n<p>這一端的用意，不是進行省察良心。我們必須想起自己曾犯罪的舊事。<\/p>\n<p>現在，我們願意正視自己和自己的罪過。審視己罪的目的，不是為了罪過本身的緣故，而是為了動搖我們自滿的基礎。聖依納爵叫我們為自己的罪，「祈求日益加深而強烈的痛悔和眼淚」。那些眼淚是心靈和意志的淚水，不必是從身體流出的眼淚。<\/p>\n<p>設想天主為你所犯過的每一個罪，都鑄造了一個鉛灰色的標誌，把罪的性質、輕重程度、犯罪的日期和境況都刻在上面。想像那些標誌都按你犯罪的時間而順序排列，就像博物館裡展覽的錢幣那樣，在一個有很多陳列櫃的大禮堂內展覽。在每個有如錢幣的標誌下，都有一份文件，註明你在何時獲得罪赦。請你走進這個「恥辱的殿堂」裡，四週看看吧。<\/p>\n<p>「即使我是個那麼小的幼兒，那時我已是個那麼大的罪人。我是多麼醜陋，奸詐，污穢，劣跡斑斑，腐化墮落啊！我看見這一幕，不勝驚駭，沒法逃避自己………. 「我將這一切歸因於祢的聖寵和慈悲，是祢開釋了我的罪惡，有如冰那樣融化。」(聖奧思定《懺悔錄》卷八，第七章 ; 卷二，第七章)<\/p>\n<p>我們把個人的一生分為若干個階段，將會很有用。例如：從初開明悟之時到初領聖體之日； 等等。<\/p>\n<p>我就每個階段審視所犯的一切罪時，毋須像統計學家那般準確地列出犯罪的次數和罪的種類，只需概括地察看自己的過犯，以引起羞愧與痛悔之情。<\/p>\n<p>換言之，我們要看自己如何回應天主寬宏的美善。「愚昧無知的人民，你們就這樣報答上主嗎？祂不是生育你，創造你，使你生存的大父嗎？」(申32：6)<\/p>\n<h3>第二端：衡量我的罪<\/h3>\n<p>「衡量自己的罪，想想每個我所犯過的死罪(大罪)，那些罪本身也極其厭惡而凶惡的， 縱使我未受禁止犯那些罪。」<\/p>\n<p>我們一定要細想每個罪的邪惡，基本上，犯罪就是拒絕天主，就是以其他事物，以受造物…..….. 來替換了 天主。(即使罪沒有被禁絕，它也是極壞的事。)<\/p>\n<p>那是關乎罪過內在的惡。<\/p>\n<h3>第三端：想想我算什麼，並貶低自己<\/h3>\n<p>藉著以下這些範例，思量自己是誰，並貶低自己：<\/p>\n<ol>\n<li>與所有的世人比較，我算什麼？<\/li>\n<li>與天堂上的天使、聖人相比，世人算什麼？<\/li>\n<li>與天主相比，一切受造物算什麼？ 而後僅我自己一人，能成為什麼？<\/li>\n<li>讓我察看我在身體方面的敗壞和醜陋)。<\/li>\n<li>讓我再看看我的靈魂，真如瘡瘍和膿腫，從中流出許多罪過、許多邪惡，以及最惡毒的毒物。<\/li>\n<\/ol>\n<p>然後，我一定要把自己和散居全球的人比較。在這一刻，全球人口約有六十億，還沒有把 所有古人和將要誕生的人計算在內……….我算是什麼？<\/p>\n<p>我可能會死，為我的離世，人們會悲傷多久呢……….？<\/p>\n<p>多少人曾在此世間生活過，而沒有人再記得起他們了……….<\/p>\n<p>我們也可以細察我們人性的軟弱，看看自己多麼容易腐化墮落。我們的靈魂也同樣軟弱。由於受原罪所傷害，我們的靈魂非常軟弱，如同我們較高等的能力――即理智與意志，也一樣軟弱。<\/p>\n<p>我們學了那麼多東西，但卻是如此無知………..<\/p>\n<p>我們的意志又怎樣？面對著困難時，我們被嚇壞了，惶惶不可終日。我們沒法堅持，令我們的目標一致，以及我們未能完全控制自己激動而強烈的情緒……….<\/p>\n<p>我們的肉軀、理智、意志都曾被罪惡所傷害。可是，我們雖如此可憐，又那麼迫切需要天主的助佑，卻竟然膽敢冒犯祂。<\/p>\n<p>天主以無限的美善對待我們，但我們卻屢屢對祂不忠………..<\/p>\n<p>我們就像以色列。厄則克耳先知描述美善的天主如何恩待以色列，召她作祂的淨配，以色列卻背棄天主，如同娼妓一樣，與人行淫 (參閱則16：8-15, 22, 30)。<\/p>\n<h3>第四端：想想我所得罪的天主是誰<\/h3>\n<p>閱讀#59<\/p>\n<p>我必須想想，我所得罪的天主是誰，回憶起祂的種種屬性，與我內在的種種相反的特性對照。<\/p>\n<p>我算什麼，竟得罪天主？<\/p>\n<p>這個小子到底是誰？ 他竟與全能的天主作對？ 他僅是個由上主天主以地上的黏土形成的微不足道的受造物。<\/p>\n<p>我得罪了誰？<\/p>\n<p>我得罪了天主！別的受造物足以令我相形見絀，然而我竟與天主對抗！天主是無限的存有，具有一切無限的屬性：美善、智慧和全能。我反省祂這些屬性時，便看得出我所犯的罪過是如何凶惡和愚昧無知。我以自己的無知、荒誕、盲目，與祂無限的智慧對抗；以自己的軟弱、不穩定、虛無，與祂的全能對抗；以自己的惡意和反常變態的行為，與祂圓滿絕對的美善對抗。<\/p>\n<p>我們沒有什麼事可埋怨天主，但天主對我們卻有太多的抱怨了。<\/p>\n<h3>第五端：我必會大為驚奇<\/h3>\n<p>閱讀第60號<\/p>\n<p>當我想到受造物為讓我生存而如何忍受莫大苦難，並供養我以延續生命，我必會大為驚奇，並日益感慨萬千。<\/p>\n<p>天主和祂神聖的受造物如何能容忍我活在大罪中呢？<\/p>\n<p>我如此嚴重地冒犯了天主，眾聖天使，天主公義的火劍，怎能依然容忍我，護守我，並和諸聖一起為我祈禱呢？<\/p>\n<p>上天、下地和走獸怎能依然為我服務呢？<\/p>\n<p>大地怎麼沒有裂開來把我吞噬，創造新的地獄來使我永遠在那裡受苦呢？<\/p>\n<p>我們在這裡一定要想想 (西班牙原文說「懷著深情想想」)，天主的慈悲比我們數不勝數的罪過更大。聖依納爵叫我們把自己投身於天父那充滿慈愛的美善；而天父迄今仍饒恕了我們。<\/p>\n<p>天主仍然維持我的生命，繼續使我活著．讓我有時間改變我的生活作風和行為舉止，並且不斷召我皈依。同樣地，天主的受造物也沒有對我施予我應承擔的懲罰。(聖多瑪斯說：「整個受造界像『第一因』手中的一件工具。」) (譯者註：第一因是天主。) 天主並沒有以公義的標竿，反而以祂慈悲的標竿來衡量我們的生命。<\/p>\n<p>聖依納爵所舉的例子是聖經所啓發的 (天使會奉天主的命令去懲罰世人，例如《出谷紀》14章所載的天使在埃及或《撒慕爾紀下》24章16節所載那位在達味王犯罪後懲罰耶路撒冷的天使。)<\/p>\n<p>當人犯罪時，某些東西就會成為天主義怒的工具。我們看到當以色列子民埋怨只能以瑪納果腹，沒有肉吃，因而反叛天主時，天主就以有毒的火蛇為工具來懲罰他們 (戶21：6)。<\/p>\n<p>可是天主並沒有以祂對待祂的選民的方式來對待我。恰恰相反，眾天使為我代禱，並幫助我，就如別的受造物也恩待我。<\/p>\n<p>對禱：把注意力集中在天主的慈悲上，默想並欣賞我們的主天主的慈悲．感謝祂直到現在這一刻，仍賜予我生命。我要仰賴衪的恩寵，立志從今痛改前非。唸一篇天主經來結束這次默想。<\/p>\n<p>請回顧這個默想的目的，並不是為使人凡事都諸多顧忌，也不是省察良心，而是為更深入認識天主如何慈悲待我。<\/p>"}], "notes": []}, {"id": "2-07", "num": "07", "kind": "默想要點", "title": "慈悲", "veni": false, "sections": [{"name": "默想", "html": "<h3>慈悲——蕩子<\/h3>\n<p>路15：蕩子的比喻<\/p>\n<p><strong>「<\/strong> <strong>父親，請把我應得的一份家產給我罷!<\/strong> <strong>」<\/strong>事實上，那份家產並非屬他所有。<\/p>\n<p>雖然我們常會傾向這樣想：我們的生命、我們的財物，都是我們所擁有的。但事實上，我們並不擁有。「我想怎樣生活，便怎樣生活。」「這條命是我的！」「你、或者其他任何人算是誰，竟過問我怎樣過活?」 以上這些話，相信大家在今天都耳熟能詳。<\/p>\n<p>我們的生命領受自天主，是要為天主而活的，而我們如何度過此生，將來必須向天主交帳。我們從天主而來，也無可避免地將要返回天主那裡。因此，我們只是個人「財產」的管理員而已。 (參閱瑪25：14「塔冷通的比喻」)<\/p>\n<h3>父親尊重兒子的決定。<\/h3>\n<p>天主把<strong>自由<\/strong>這份禮物託付給我們。雖然祂極疼愛我們，也同樣切望我們對祂以愛還愛。祂卻不想強迫任何人愛祂；反而，祂渴望得到我們自由地獻給祂的愛；否則，我們便沒法真誠地愛祂，只能成為祂的僕婢。但天主想我們做祂的兒女。牲畜不能愛天主，但我們作為具有自由的人，就能愛天主。許多對天主的計劃不解或誤解，均源自這假定的先決條件。「為什麼天主不把我們創造成沒可能冒犯祂的人呢？」 為什麼人們會與那些具有對己不忠可能性的人結婚呢？這個問題與愛的動力相關：自由對愛是必需的。(即是沒有自由便不可能有真正的愛。)(若15：14-15「我稱你們為朋友。」)。<br />\n這就是父親容許兒子犯下彌天大錯的緣由：不是因為他對兒子漠不關心，而是因為他尊重兒子的決定。<\/p>\n<p>從父親的態度所汲取的教訓，是有點嚇人的：天主會很認真地對待我們給祂無論是肯定或否定的回應。 (參閱谷10：17有關富貴少年的記載)。<\/p>\n<p><strong>有些人會這樣想：天主既然是愛，無論我們做什麼，祂將來都會把我們迎進天國<\/strong>。不過，按照耶穌給我們的教導，天主既不會強迫我們下地獄，也不會迫使我們升天堂。我們是此世的旅客，無論我們發憤向上，或自甘墮落，天主都會尊重我們自由地所作的決定。(Castellani：這個比喻主要指出天主的超越性：祂留在衪所在之處，別無他法。)<\/p>\n<p>施恩主教(Fulton Sheen)：人人都想跟隨耶穌，但要付諸實踐時卻總會說「不過……」。所以，人們就帶著他們常說的「不過……」，朝著『不過』是地獄的方向走去……)<\/p>\n<h3>小兒子往遠方去了。<\/h3>\n<p>遠方代表這世界。放蕩不羈、追求淫慾、貪婪、自我放縱等等，標誌著小兒子的生活方式。 (參閱若15：18世界對信徒的惱恨)<\/p>\n<p>父家裡的平安和美德，與遠方的情況實在對比鮮明。那裡有的，是恬靜、平安、良好習慣，更有父親對他溫馨的愛。<\/p>\n<h3>終於那地方遇上大荒年。<\/h3>\n<p>如今，他的「酒肉朋友」都離他而去，僱主又對他十分刻薄。(「他恨不得拿豬所吃的豆莢充飢，也沒有人給他。」)<\/p>\n<p>此外，他必須放豬……<\/p>\n<p>他一定對自己心生厭惡，覺得自己比任東西都更討厭。<\/p>\n<p>世界曾向我們許諾，不過，卻不遵守諾言。罪惡時常都很誘人，但永遠都是一張空頭支票，如同一塊充滿了鹽的糖果一樣。那些我們以為比天主更重要的事物，就是聖經所說的「世界」，即美色、權勢、金錢、吃喝玩樂、名譽……<\/p>\n<p>這些就是年輕人許多時出賣靈魂來換取的東西。這也是世界向它的追隨者報酬的方式(現代世界的故事就是蕩子的故事……)。「人背棄了天主後，便會背棄自己。」(“Fallen from God will fall from yourself.”)<\/p>\n<p>這就是在我們有罪時，天主如何看我們的「X光片」。罪並不僅是「人人都會做的事」，卻是一個難以完全接受的嚴峻事實。罪並不「可愛」，也不好玩；它可怖得難以形容。它是一種永無休止的誘惑，為追求完全獨立自主，不依靠任何不屬於我自身的一切，連天主也包括在內。<\/p>\n<h3>他清醒過來<\/h3>\n<p>然後，他獲得了真知灼見)：他回想起從前在父家的生活，跟目前的處境相比下，簡直有天淵之別。他清醒過來，決定踏上歸途。<\/p>\n<p>聖奧思定說：「我愛祢太晚了，噢，萬古常存而又常新的美，我愛祢太晚了！昔日，祢在我內，但我卻在外邊，我是在那裡尋覓祢。我既不可愛，便縱身投入祢所創造的可愛事物中。那時，祢與我同在，我卻沒有與祢相偕。」<\/p>\n<h3>「父親，我得罪了天，也得罪了你。」<\/h3>\n<p>他悔不當初。<\/p>\n<p>除非我們悔改，否則天主不能寬恕我們；再說一遍，天主不想強迫我們升天堂。雖然父親渴望兒子歸來，卻一直留在家中：兒子必須痛改前非，然後回來。<\/p>\n<p>這故事最引人注目的地方，是兒子尋求寬恕的特出表現。兒子本來可以如同猶達斯那樣萬念俱灰，陷入絕望的景況。可是，他悔改了，並認為父親的美善，的確大於他所有的罪惡的總和。<\/p>\n<p>「得罪了你」：罪惡最重要的本質，在於冒犯天主，更大於不適當地利用受造物。若我們忘記了天主，利用祂的受造物時，便會無視祂的存在，或更甚至違反天主的旨意；若我們認為受造物比我們的造物主更重要，那就是最使天主傷心的事；因為那的確是我們冒犯祂的邪惡意向——雖然不一定宣之於口。(最使比喻中的父親感到難受的恰恰就是這種情況：小兒子的極度自私表現。)<\/p>\n<p>小兒子真心悔改，即使困難重重，仍然作出徹底的抉擇，決意回歸父家――這就是真正的皈依。真難想像：小兒子做了那麼多錯事後，卻要他返回家中，再次與父親的目光接觸，其實一點也不容易…………。<\/p>\n<h3>至此，一般人的邏輯會是：「把我當作你的一個傭工吧！」<\/h3>\n<h3>真相是：父親正在等他，而且還「動了憐憫的心，跑上前去，撲到他的脖子上，熱情地親吻他。」<\/h3>\n<p>他耗盡了父親的金錢後，要再次面對父親。父親縱然沒有到遠方去找他，但一看見他，就跑上前去迎接。你可想像得到，他來自那個久旱不雨的地方，又曾在那裡放過豬，該是多麼骯髒的樣貌……….，然而，父親竟摟住他，因他而感到更大的喜悅，甚至比對長子還大。(路5：31-32「不是健康的人需要醫生，而是有病的人。我不是來召叫義人，而是召叫罪人悔改。」)<\/p>\n<p>聖女小德蘭說：我們所有的罪加起來，與天主的慈悲相比，就像落在火海裡的一滴水。<\/p>\n<p>聖多瑪斯說：無論誰認為自己沒法蒙主寬恕，他這樣想時所犯的是個更大的罪，因為他聲稱自己的罪竟比天主更大 (那是驕傲)。<\/p>\n<p>有很多罪人害怕回到天主那裡。這證明他們對天主的美善、偉大與慈悲，懷有扭曲了的看法。我們把天主變得像人那樣。天主照祂的肖像造了我們，我們卻反其道而行，把祂貶為凡人………..。由於我們不會饒恕，因此難以領悟天主的無限慈悲。事實上，天主寬恕一個真心悔改的罪人時，比祂對待那些自以為正義的人時，獲得更大的喜樂。祂很重視謙遜，有時甚至會讓我們獨自承受，好使我們能親自體驗到自己的罪惡，從而變得更加謙遜。耶穌懸在十字架上時，實際上左右兩旁共有兩名強盜。其中一個從基督那裡「盜取」了天堂：他做了一件事，來實踐自己的謙遜、信賴、信德、愛德和悔改。這件事遠遠大於他所可能犯過的任何罪惡。在耶穌眼前，他已潔淨了自己過去的一切行徑。<\/p>\n<p>基本上，天主是慈悲的。<\/p>\n<p>聖多瑪斯說：慈悲是天主的最大特質。Misericordia est Deo maxime attribuenda. (S. Th I. 21, 3)<\/p>\n<p>聖保祿說：天主「富於慈悲」(弗2：4) 聖經又說：「雅威是慈悲寬仁的天主，緩於發怒，富於慈愛忠誠。」(出34：6)<\/p>\n<p>「祂慈愛地定睛注視每一個人。福音中處處都證實這一點。一個人也能說：基督這種『慈愛的目光』，可以說，蘊含著全部福音喜訊的摘要與綜合。(……)我願你們每一個人都能發現基督這種目光，並能極其深切地體驗它。我不知道，在你的生命中，你會在什麼時刻 (有這種體驗)。我想，當你最需要它時，就會體驗得到。也許在痛苦中，也許是在純潔的良心作證之時，如同福音中那 (富貴) 少年的情況那樣，也許正正相反，是在有罪惡感，良心感到懊悔的時候。因為伯多祿跌倒了，否認了自己的師傅三次後，基督也定睛凝視他。人需要這種慈愛的目光。他需要知道，天主愛他，永遠愛他，從永遠就揀選他。同時，這種天主選人的永恆之愛，如同基督慈愛的目光一樣，畢生都與他形影不離。也許，體驗得最深的時刻，是考驗、羞辱、迫害與挫敗之際，那時，別人彷彿不把我們視為人，侮辱並踐踏我們的人性。在那個時刻，父常在子內愛我們的意識，基督時常都愛我們每一個人的意識，就成為我們整個人生的堅固支柱。當事事都令我們懷疑自己與生命的意義時，只要看見基督這種目光，意識到這種在祂內顯得比任何邪惡與毀滅的力量更強大的愛，憑著這種意識，我們就能繼續活下去。我願你們體驗到福音中那 (富貴) 少年所體驗到的事：『耶穌定睛看他，就喜愛他。』」<\/p>\n<h3>(教宗若望保祿二世給青年的信，1985年3月31日)<\/h3>"}], "notes": []}, {"id": "2-08", "num": "08", "kind": "默想要點", "title": "基督的國", "veni": false, "sections": [{"name": "默想", "html": "<h3>基督的國<\/h3>\n<p>我們以此默想作為神操第二週的開始 [第91號]。<\/p>\n<p>附規二、六、七、十 (參考第73號等與第130號等)<\/p>\n<p>第一前導：設定地點：在此處，我們憑想像觀看，耶穌宣講時所在的各會堂、各鄉村、各城鎮。<\/p>\n<ul>\n<li>第二前導：求恩：「在此處，求我們的主賜予恩寵，使我對祂的召叫不致聽而不聞，還能爽快而勤奮地完成祂至聖的旨意。」不致聽而不聞：這話不僅在聆聽的意義上，卻特別在我們回應的意義上。我們所求的恩寵，是馴服受教的恩賜和奉行天主旨意的決心。<\/li>\n<\/ul>\n<h3>這個默想有兩個截然不同的部份。<\/h3>\n<h3>召叫——一個比喻<\/h3>\n<h3>第一端<\/h3>\n<p>設想有個現世的君王擁有一切做君王的條件，即歷代最偉大的人物所具備的特質，包括拿破崙的天份、磊思聖王的聖德、偉大將領的能力。啊！這人不但慷慨仁厚，而且還具有捨己為人的犧牲精神。<\/p>\n<h3>第二端<\/h3>\n<p>他走遍各村，到處宣佈以下的消息：<\/p>\n<ol>\n<li>他的旨意是施行仁政，以解救那些活在錯繆和暴政的黑暗境況中的人，並祝福那些負著重軛，遭人奴役的百姓，使他們能在太平盛世中度日。<\/li>\n<li>願意參與他的使命或事業的人，必須與他共患難，和這位君王一同忍受衣食方面的不便、行軍和守夜時的勞累以及睡眠不足之苦。<\/li>\n<li>追隨者白天勞動，晚上值夜，歷盡艱辛後，君王在光榮勝利，大功告成之日，定必論功行賞，按他們所分擔的勞苦和對他的忠誠程度，與他們分享勝利的光榮、榮譽與成果。<\/li>\n<\/ol>\n<p>對這樣的呼籲，除了懦夫之外，人人都會急不及待地響應。有人若在崇高使命的召喚下，不願回應這樣一個涉及犧牲個人利益的呼召的話，定會被人視為自私透頂的卑鄙小人。<\/p>\n<p>這論述顯示了以下各點：<\/p>\n<ul>\n<li>為基督而征服全世界，實際上是君王的旨意。<\/li>\n<li>不過，他不會強迫自己的臣民。他說：「誰<strong>願意<\/strong>與我一起參與這事業………..。」<\/li>\n<li>他並非一個經常作虛假承諾，蠱惑民心的政客。他說得很清楚凡跟隨他必會涉及的一切。<\/li>\n<li>他身先士卒，是首個承擔這項事業的人。他說：「誰願意<strong>與我一起<\/strong>參與這事業，就該在吃喝穿著等方面與我無異，並同樣感到滿足。」<\/li>\n<li>他確實地承諾了：「他既與我一起分擔勞苦，日後也要與我共享勝利。」<\/li>\n<\/ul>\n<h3>第三端<\/h3>\n<p>這位君王既能激勵人心，又十分慷慨，他的臣民應當如何回應他的邀請呢？<\/p>\n<p>如果他們不接受這項挑戰，實在值得受人極度鄙視。<\/p>\n<p>聖依納爵說：「想想那些良好的臣民應當如何回應。」他的話是「應當如何」。似乎在面對這位品格如此清高的君王時，別無選擇。<\/p>\n<h3>第二部份——這比喻的應用<\/h3>\n<h3>第一端<\/h3>\n<p>既然世上君王的號召值得臣民恰當地回應，基督的號召就更應當如此。基督面對著普世眾人，而祂按每人的名字呼喚他們，說：「我的旨意，是征服普世，戰勝所有仇敵，從而進入我父的光榮中。因此，誰願參與我這事業，該與我一起辛勞工作，好能藉著與我一起所受之苦，將來與我一同享受光榮。」<\/p>\n<p>我們必須考慮召叫我們的那一位：<\/p>\n<ol>\n<li>基督卓越無比<\/li>\n<\/ol>\n<p>我們能認識真理，而基督卻是智慧至高無上的君王。祂說：「我是真理。」(若14：6)<\/p>\n<p>我們尋求美善，但基督卻是至高無上的善。基督是眾人意志的君王。<\/p>\n<p>任何認識基督的人，都不得不跟隨祂。祂是眾心的君王。<\/p>\n<ol>\n<li>基督的權能<\/li>\n<\/ol>\n<p>「耶穌上前對他們說：『天上地下的一切權柄都交給了我。』」(瑪28：18)<\/p>\n<p>君王有立法、審判和執行的權柄。<\/p>\n<p>基督在審判中有宣判的權柄。祂說：「父不審判任何人，但祂把審判的全權交給了子。」(若5：22)<\/p>\n<p>基督認可祂的法律。祂說：「如果你們愛我，就要遵守我的命令。」(若14：15) 此外，祂還成全了舊的法律。再者，「君王要對那些在祂右邊的說：我父所祝福的，你們來吧！承受自創世以來，給你們預備了的國度吧！」(瑪25：34)<\/p>\n<ol>\n<li>基督的國的特性<\/li>\n<\/ol>\n<p>它是個屬神的國：「耶穌回答說:『我的國不屬於這世界；假使我的國屬於這世界，我的臣民早已反抗了，使我不至於被交給猶太人；但是我的國不是這世界的。』」(若18：36)<\/p>\n<p>祂對祂的國擁有屬神的權利：「耶穌上前對他們說：『天上地下的一切權柄都交給了我。』」(瑪28：18)<\/p>\n<p>它是要臨現於普世的國。聖保祿：「基督必須為王，直到把一切仇敵屈伏在衪的腳下。」(格前15：25)<\/p>\n<h3>基督為了一個特定的目標而召叫人。簡而言之：<\/h3>\n<ul>\n<li>基督邀請人人都跟隨祂。<\/li>\n<li>祂邀請我們去做的，是重要的事情；值得我們慷慨大方地回應。<\/li>\n<li>做這個默想時，我們須求主施恩，好使我們不要對祂的邀請充耳不聞。<\/li>\n<li>基督的旨意是要征服全世界。<\/li>\n<li>不過，祂不為求取地域上的征服，只想征服眾人的靈魂。祂來尋找的，是我們的靈魂。<\/li>\n<li>祂終必得勝，因為祂已征服了世界。祂說：「你們放心，我已戰勝了世界。」(若16：33) 聖若望宗徒在《若望一書》裡說：「得勝世界的勝利武器，就是我們的信德。」(若一5：4)<\/li>\n<li>因此，祂邀請我們做的事，就是為祂征服眾人的靈魂…………先從自己的靈魂開始。祂說：「就如父派遣了我，我也同樣派遣你們。」(若20：21) 耶穌願意首先征服的，是我們自己的靈魂。大戰要發生的地點，就在此處，就在我們內──我們不要對基督的召叫聽而不聞，而且隨後還要往外去，叫人投向祂。<\/li>\n<li>主召叫每一個人，就連我們這些可憐的罪人在內。祂說：「不是你們揀選了我，而是我揀選了你們。」(若15：16) 這實在是我們信仰中一項很美妙的真理。祂說：「我揀選了你們，並派你們去結果實，去結常存的果實。」(若15：16) 基督的邀請，並非我們憑空捏造的。是祂先發出了邀請，然後我們才去跟隨祂。我們的力量，是植根於這項真理的。<\/li>\n<\/ul>\n<h3>各種不同的回應<\/h3>\n<p>不同的回應共有三種。<\/p>\n<p>消極的回應：故意拒絕跟隨耶穌的人，會消極地回應。耶穌的邀請具有那麼大的吸引力，以致聖依納爵連這個可能性也沒有提過。不過，確實有人拒絕祂。這類人中，有的是傾向或崇尚盡量少改變或少行動的人，有的是縱情恣慾的人。<\/p>\n<p>積極的回應：積極回應共分為兩個模式。<\/p>\n<p>聖依納爵說：「一切有判斷力和理性的人都會完全獻身去從事這項工作。」<\/p>\n<p>那些只會「先尋求天主的國」(瑪6：33)，然後才會尋求任何其他事物的人，屬於這類。「羔羊無論到哪裏去，常隨著羔羊」(默14：4) 的人，屬於這類。那些「把肉身同邪情和私慾釘在十字架上」(迦5：24) 的人，也屬於這一類。<\/p>\n<p>但還有另一類更慷慨的人。<\/p>\n<p>「那些願以更大的憑據去證實他們的愛，並在任何與事奉永生的君王和眾人之主相關的事上，做得比別人更出色的人，不但完全獻身去從事這項工作，而且還以行動抗衡淫蕩、肉慾與世俗之愛，並作出更有價值，更加重要的奉獻。」<\/p>\n<p>他們就是那些願意置身於戰場前線的人。<\/p>\n<p>他們與前者不同之處，在於他們肯背起基督的十字架。因此，他們以行動抗衡淫蕩和無節制的感情 (肉慾與世俗之愛)。<\/p>\n<p>我們的主不是一個蠱惑民心的政客。他坦誠率直，直言不諱地把真相告訴我們：跟隨祂是件難事。祂說：「那導入生命的門是多麼窄，路是多麼狹！找到它的人的確不多。」(瑪7：14) 我們都跟隨著耶穌，而祂走的路是以十字架作為終結。祂說：「誰不背起自己的十字架跟隨我，不配是我的。」(瑪10：38) 那些願意跟隨祂的人，必須接受這一點。祂又說：「誰若願意跟隨我，該棄絕自己，背著自己的十字架來跟隨我。」(瑪16：24)<\/p>\n<p>聖保祿描述我們的召叫，就是與基督一起被釘在十字架上。他說：「我已同基督被釘在十字架上了，所以，我生活已不是我生活，而是基督在我內生活。」(迦2：19-20)<\/p>\n<p>為要征服這「領土」──即我們自己的靈魂，我們要與強大的三仇戰鬥──即魔鬼、世俗與肉身；肉身所指的是我們自己、我們的私慾和弱點。主召叫我們，要因祂的緣故而征服我們自己。<\/p>\n<p>基督不但以祂的話來召叫我們，祂還為我們立了善表，以自己的生活和行為來吸引我們]。祂因此出身寒微，祂先守好誡命。每一件祂命令我們做的事，祂都先身體力行。聖伯多祿說：「基督也為你們受了苦，給你們留下了榜樣，叫你們追隨祂的足跡。」(伯前2：21)<\/p>\n<p>聖奧思定說：「誰若願意達到成全的地步，該輕視那些耶穌所輕視的事，並且愛慕及渴望耶穌所愛慕的。」<\/p>\n<p>主不但在加爾瓦略山上，而且還以祂的一生，給我們立了善表，使我們明白在跟隨祂時，該如何勞苦工作，該如何安於貧窮。祂自出生便過著窮苦的生活。祂說：「狐狸有穴，天上的飛鳥有巢；但是人子卻沒有枕頭的地方。」(路9：58) 祂去世的時候，比出生時更加貧窮。衪畢生貞潔，「聽命至死，且死在十字架上。」(斐2：8) 祂受眾人反對，「來到了自己的領域，自己的人卻沒有接受衪。」(若1：11)「他們窺察祂是否在安息日治好那人，好去控告他。」(谷3：22) 甚至祂的家族和祂本城的人也不相信祂，連最親密的朋友也出賣祂，對祂忘恩負義的人，多得不可勝數…………。祂召喚我們在這一切事上分擔祂的痛苦。祂說：「沒有僕人大過主人的，也沒有奉使的大過派遣他的。」(若13：16)<\/p>\n<p>聖保祿這樣描述宗徒們的處境：「我以為天主把我們作宗徒的列在最後的一等，好像被判死刑的人，因為我們成了供世界、天使和世人觀賞的一場戲劇。我們為了基督成了愚妄的人，你們在基督內卻成了聰明的人；我們軟弱，你們卻強壯；你們受尊敬，我們受羞辱。直到此時此刻，我們仍是忍飢受渴，衣不蔽體，受人拳打，居無定所，並且親手勞碌操作。」(格前4：9-12)<\/p>\n<p>所以在這個課程裡，我們定要渴望陪伴基督，與祂一起安於貧窮，一起蒙羞受辱，遭定了罪，並與祂一起受死，好使日後也能隨著祂，分享祂的喜樂與平安。<\/p>\n<p>在福音中，有許多字句把這種徹底跟隨耶穌的精神表達出來。<\/p>\n<p>例如：「天國好像是藏在地裏的寶貝；人找到了，就把它藏起來，高興地去賣掉他所有的一切，買了那塊地。」(瑪13：44)<\/p>\n<p>就是這個課程了。聖保祿說：「在我看來，生活原是基督，死亡乃是利益。」(斐1：21) 他又說：「凡是願意在基督耶穌內熱心生活的人，都必要遭受迫害。」(弟後3：12)<\/p>\n<p>受苦不等於一敗塗地。恰恰相反，它是世界賴以得救的方法，它將會繼續如此，直到世界的終結………..。<\/p>\n<p>了解此事的關鍵，是必須記住我們是與祂一起受苦的。主邀請我們參與祂已經完成的征服大業。祂召叫我們在這項事業上與衪協作，首先征服我們自己，然後征服他人。為了達到這目的，他籲請我們慷慨地付出，而我們可以自由地回應。<\/p>\n<p>祂對我們說：「誰若願意參與我的事業，該和我一起勞苦工作。」就如祂在福音中也說過：「誰若願意跟隨我，該棄絕自己，背著自己的十字架來跟隨我。」(瑪16：24)<\/p>\n<p>此處真正要緊的，並非我們是否決定跟隨祂，而是我們如何跟隨：我們要忠信地跟隨祂，還是想不冷不熱地跟隨呢？<\/p>\n<p>在基督的福音中，基督說過的很多句話，甚至比喻，都提到這種全心全意跟隨祂的態度，而這種態度也是聖依納爵對我們的要求。<\/p>\n<p>例如：「天國好像是藏在地裏的寶貝；人找到了，就把它藏起來，高興地去賣掉他所有的一切，買了那塊地。天國又好像一個尋找完美珍珠的商人；他一找到一顆寶貴的珍珠，就去，賣掉他所有的一切，買了它。」(瑪13：44-46)<\/p>\n<p>這兩個比喻的主旨是：為得到屬神的財富，我們必須捨棄一切。從本質上說，屬神的財富形成一個整合的體系：信德、聖化的恩寵、天主的法律、「內修生活」、恆心的恩賜和我們的救恩。這些屬神財富就是基督所說的極度寶貴的珍珠，以及地裡藏著的寶貝。<\/p>\n<p>那顆珍珠是絕對的善，為了獲得它，其他的一切都可以棄之如敝屣。作為一個「從事商業的人」，他在交易時絕不容許自己受騙。天主是絕對的，祂所造的萬物是相對的。我們與天主的關係可算是絕對的，所以也是無限的，而因此也難以理解。我們與天主的關係好比一條直線，線的一端有起點，但另一端卻沒有終點，一直延伸到無窮盡之處，就像幾何學家所說的兩條永不相交的平行線一樣。教會的「當信的道理」也是一樣：我們的理智對它們的內容表示同意，但我們卻永遠沒法透徹地論述其全部內容。<\/p>\n<p>基督知道大家對人感興趣，所以祂把我們比作商人和挖掘者。祂在比喻中建議我們做一宗簡單，但卻一本萬利的交易，那是一筆「大生意」。那生意一方面是安全的，但另一方面卻要我們具備非凡的勇氣。天主認識我們，祂如同商業交易一般向我們示愛求婚，而不像迫不得已的責任，或強制的要求一樣。<\/p>\n<p>無論你怎麼理解，它都是一筆「毋庸置疑」的生意：因為雙方都要完完全全地付出一切 (買家要「賣掉他所有的一切」，賣家要付出那顆他唯一擁有的「珍珠」。)，而那是深奧難明的事。<\/p>\n<p>以上這一切都表明，人必須徹底降服，即「賣掉他所有的一切」。這一段就如散見於福音各處，正好呼應了耶穌對祂的追隨者的一切「絕對」要求。為阻止小鳥飛翔，是毋須用上腳鐐，光一條幼線拴著一腿便夠了。耶穌說：「你們中不論是誰，如不捨棄他的一切所有，不能做我的門徒。」(路14：33)「把你一切所有的都變賣了，施捨給窮人，你必有寶藏在天上，然後來跟隨我！」(路18：22)「任憑死人去埋葬自己的死人吧！」(路9：60)「誰獲得自己的性命，必要喪失性命；誰為我的緣故，喪失了自己的性命，必要獲得性命。」(瑪10：39)「一粒麥子如果不落在地裏死了，仍只是一粒；如果死了，才結出許多子粒來。」(若12：24)「人若為自己的朋友捨掉性命，再沒有比這更大的愛情了。」(若15：13) 耶穌甚至說：「如果誰來就我，而不惱恨自己的父親、母親、妻子、兒女、兄弟、姊妹，甚至自己的性命，不能做我的門徒。」(路14：26)<\/p>\n<p>「我們不願賣掉自己所有的一切，我們想把某些東西留下：那是合理的事。」(Castellani《基督的比喻》)<\/p>\n<p>那珍珠代表了絕對的善，其他所有事物丟掉了也不足惜。君王的呼召就是：要放棄一切我目前所擁有的，與君王一起投入戰鬥，然後享受勝利的獎賞。<\/p>\n<p>聖依納爵要我們明白，人須向基督完全順從，這是基督對我們的要求。<\/p>\n<p>聖保祿說：「我將一切都看作損失，因為我只以認識我主基督耶穌為至寶；為了祂，我自願損失一切，拿一切當廢物，為賺得基督。」(斐3：8)<\/p>\n<p>聖依納爵邀請我們用以下對天國的奉獻詞來結束這操練：<\/p>\n<p>「萬物的永生主宰，我賴祢的恩寵助祐，在祢的無窮美善，及祢光榮之母和天朝聖人聖女們的面前，做此奉獻，並鄭重聲明：只要更能事奉祢讚美祢，我真心願意，滿心切望，效法祢承受一切凌辱反對，忍受一切實際的和心靈的貧窮；只要祢的至聖尊威肯選擇我收納我，在這樣的生活和地位上。」(侯景文譯《神操通俗譯本》第98號)<\/p>"}], "notes": []}, {"id": "2-09", "num": "09", "kind": "默想要點", "title": "聖母領報", "veni": false, "sections": [{"name": "默想", "html": "<p>聖母領報 [101]<\/p>\n<p>預備經：照常。<\/p>\n<p>第一前導：記起我即將要默想的主題的歷史。在這裏，天主神聖的一體三位便是如此俯視著全球範圍的遼闊空間裡滿布著人類，看見眾人都走向地獄，便從永恆中命令天主第二位降生成人，以拯救人類。因此時期一滿，天主一體三位便派遣天使加俾額爾拜訪聖母瑪利亞。<\/p>\n<p>第二前導是為將要觀看的地點而定像。從這裏我在想像中將觀看全球幅員廣大的空間，居住著那麼多不同的國民和族群；然後我將特別觀看加里肋亞省的納匝肋城內聖母居住的房屋和內室。<\/p>\n<p>第三前導是求恩――祈求我所願望的。在這裏，我要祈求天主賞我能密切認識為我而降生成人的吾主耶穌，好使我能更加愛慕祂，追隨祂。[104]<\/p>\n<p>為對一個人具有深切的認識，就要從內裡去認識那人，即認識他或她的價值觀、品味、喜好，以及對各種不同刺激的反應方式。為能對一個人有這種認識，我們必須與那人建立密切的關係，經常和他交往。<\/p>\n<p>我們現在要在這個默想中，細想若沒有了基督，這世界會陷於如何悲慘的困境，好使我們得以盡己所能，領會到那頒令讓天主聖子降生成人以拯救世界的絕妙含意，以及源自天主特有的聖愛。我們要透過天主一體三位的眼睛去觀看這世界。<\/p>\n<p>聖依納爵按照他進行這類祈禱的慣常方式，介紹我們在這次默想中，觀看各類人物，聆聽他們要說的話，觀察他們所做的事。他特別強調兩方面：各種處境相異之處，和他們基本的共同點。<\/p>\n<p>相異之處：他們的衣著、種族、處境……。<\/p>\n<p>共同點：人人都好像瞎子那樣過活，一旦死了便要下地獄。只需留意他們談話的方式，和他們所做的事：他們詛咒，褻瀆，彼此傷害，互相殺戮……。<\/p>\n<p>「如果你們不悔改，你們都要同樣喪亡。」(路13：3)「所有的人都犯了罪， 都失掉了天主的光榮。」(羅3：23)「全世界卻屈服於惡者。」(若一5：19)<\/p>\n<p>總而言之：沒有基督，世界便會自趨沉淪。這原則適用於過去，也適用於現在。<\/p>\n<p>「他們(即沒有天主的外教人)雖然認識了天主，卻沒有以祂為天主而予以光榮或感謝，而他們所思所想的，反成了荒謬絕倫的；他們冥頑不靈的心陷入了黑暗；他們自負為智者，反而成為愚蠢，將不可朽壞的天主的光榮，改歸於可朽壞的人、飛禽、走獸和爬蟲形狀的偶像。因此，天主任憑他們隨從心中的情慾，陷於不潔，以致彼此玷辱自己的身體。因為他們將虛妄變作天主的真理，去崇拜事奉受造物，以代替造物主……！因此，天主任憑他們陷於可恥的情慾中……他們既不肯認真地認識天主，天主也就任憑他們陷於邪惡的心思，去行不正當的事，充滿了各種不義、毒惡、貪婪、凶殘、滿懷嫉妒、謀殺、鬥爭、欺詐、乖戾；任憑他們作讒謗的、詆毀的、恨天主的、侮辱人的、高傲的、自誇的、挑剔惡事的、忤逆父母的、冥頑的、背約的、無情的、不慈的人。」(羅1：21－31)<\/p>\n<p>參看羅馬帝國的奴隸制<\/p>\n<p>教宗聖若望保祿二世說：「我們的時代，是個以很多實際的方式去否認天主聖子降生成人的時代，這種否認的後果顯而易見，且令人不安。首先，人與天主的關係被視為純粹個人的私事，以致天主被排除於種種影響社會、政治與經濟活動的過程外。結果又導致人覺得自己所具有的可能性大不如前，因為唯獨基督才能圓滿地揭示人類生命的偉大可能性，真正地『把人的特質向人類本身展示出來』(參閱《論教會在現代世界牧職憲章》22)。當基督被排斥在外或被否認時，我們對人生目標的視野就會縮小；當我們的期望和目標都降低時，希望便會由絕望所代替，而喜樂則會被沮喪所取代。人對理性似乎也懷有強烈的不信任，亦不信任人對真理的領悟能力；的確，連真理這概念也備受懷疑。信仰與理性分道揚鑣，令雙方互相顯得貧乏，其中一方淪為信仰主義 (fideism)，而另一方則淪為唯理主義 (rationalism) (參閱《信仰與理性通諭》48)。生命不受重視，不被愛惜，於是引致某種死亡文化的蔓延，結出墮胎與安樂死的黑暗花朵。人的身體與性得不到恰當的重視和愛惜；因此對性的貶損及降低便呈現於道德混亂、不忠的配偶關係、色情物品的猛烈暴力等浪潮之中。 受造界本身不受重視，不被愛惜；因而導致極具破壞力的自私陰霾出現，使人濫用自然環境，並榨取它的資源。」(若望保祿二世，<em>Letter to the Very Reverend Timothy Radcliffe Master General of the Order of Preachers<\/em>, 28-VI-2001.)<\/p>\n<p>所以，世界若沒有天主，便會朝著投進地獄的方向走去。為此緣故，耶穌熱切地渴望宣講福音，召人皈依。聖保祿也有相同的渴望，他說：「我若不傳福音，我就有禍了。」(格前9：16)<\/p>\n<p>今天，這股引導人們認識基督的傳道熱誠，似乎已不像從前那麼迫切了。<\/p>\n<p>可是「除祂以外，無論憑誰，決無救援，因為在天下人間，沒有賜下別的名字，使我們賴以得救的。」(宗4：12) 天主降生成人的事件把人類的歷史分為兩部份。在基督降生前，外教人的世界異常殘酷。但現在又怎樣呢？從這個充滿罪惡的世界，聖依納爵舉目凝視天主聖三。但天主怎樣看這世界呢？<\/p>\n<p>這世界是瞎眼的，因世人對天主閉上了雙目和心扉，因而誤入歧途。但天主懷著慈悲和仁愛看著我們，祂渴望拯救我們。<\/p>\n<p>天主愛罪人，就連人仍在罪惡中生活時也不例外。「當我們還在軟弱的時候，基督就在指定的時期為不虔敬的人死了。為義人死，是罕有的事：為善人或許有敢死的；但是，基督在我們還是罪人的時候，就為我們死了，這證明了天主怎樣愛我們。」(羅5：6-8)天主惱恨罪惡，但卻深愛罪人。(聖奧思定)<\/p>\n<p>看見這個有罪的世界時，聖依納爵邀請我們聆聽天主三位一體所說的話：「讓我們做救贖人類的工作吧」[107]。「天主竟這樣愛了世界，甚至賜下了自己的獨生子，使凡信祂的人不至喪亡，反而獲得永生。」(若3：16)<\/p>\n<p>天主對我們的愛極大，已到了無以復加的地步：天主把自己的獨生子賜給了我們，讓祂為不義的人而死。「聖言成了血肉。」(若1：14)<\/p>\n<p>「祂派遣了自己的兒子，帶著罪惡肉身的形狀，當作贖罪祭，在這肉身上定了罪惡的罪案……祂既然沒有憐惜自己的兒子，反而為我們眾人把祂交出來了」(羅8：3, 32)<\/p>\n<p>為了拯救世界，天主選擇了「降生成人」這謙抑自下的方式。所以我一定要默觀天主聖子；天主「為了我」而成了血肉。我必須將這個事實據為己用，我一定要觀看祂如何貶抑自己，空虛自己，謙卑地成為一個微不足道的人，緩慢地在瑪利亞的胎中成形。我們可以依循《斐理伯書》中那首詩歌(參照由斐2：5起)來進行默觀。<\/p>\n<p>在天主降生成人之際，祂不但被剝奪了天主性的光榮，而且連人性的特質也沒有充分展現出來。聖母開始懷孕時，耶穌在母腹中既不能動，又無法感覺，也沒法與人接觸。<\/p>\n<p>我們也可以想想祂如何在聖母的胎中隱藏自己：「降生成人的天主把自己幽禁在母胎中僅有的自由空間內。祂容許自己藉著這年輕貞女懷孕而降生，來顯揚天主的權能。祂深藏自己和聖父的光輝，不讓世間萬物窺見，而只揭示給瑪利亞，並以此為自己和聖父的榮耀。為顯揚祂的獨立自主與威儀，祂依賴這可愛的童貞女孕育而成為人。」(《真誠孝愛聖母》18 )<\/p>\n<p>不然，我們也可以從聖母的角度來看這相同的奧蹟。與耶穌一樣，聖母清楚表達了「是」。她說：「看，上主的婢女，願照你的話成就於我吧！」(路1：38) 聖母以身作則，用自己的回應來教導我們也該如何回答天主。<\/p>\n<p>按聖經所載，「基督一進入世界便說：『犧牲與素祭，已非祢所要，卻給我預備了一個身體；全燔祭和贖罪祭，已非祢所喜，於是我說：看，我已來到！關於我，書卷上已有記載：天主！我來為承行祢的旨意。 』」(希10：5-7)<\/p>\n<p>耶穌的第一個回應是對天主的旨意表示贊同，受天主派遣，讓祂以死亡來拯救我們。同樣，聖德蘭修女也從沒拒絕過天主。<\/p>\n<p>聖女瑪利亞．麥其樂 (St Mary McKillop) 說：「對我來說，天主的旨意是一本我心愛而令我愛不釋手的書，它對我常會有些新的魅力。我沒法告訴你，天主的旨意在我看來是何等美妙。」(<em>Mary McKillop<\/em>, Paul Gardiner, 134)<\/p>\n<p>我們亦可細想耶穌基督的天主性，來進行這個默觀。凡是仇敵將會千方百計謀求削弱我們對祂天主性的信德，勝過其他任何事……<\/p>\n<p>結束這個默觀時，讓我們和天主的一體三位，與降生成人的聖言，以及聖母瑪利亞作對禱。我們必須向瑪利亞懇求恩寵，讓我們更緊密地追隨並效法我們的主。<\/p>\n<p>讓我們祈求天主聖三，使我們能與一切人分享天主的愛與慈悲，並使切願他們得救的渴求在我內增長。我們祈求耶穌，使我能效法祂謙遜和甘貧樂道的表率。讓我們求聖母教導我們，使我們常能順從天主的旨意而說「是」。<\/p>"}], "notes": []}, {"id": "2-10", "num": "10", "kind": "默想要點", "title": "兩旗默想", "veni": false, "sections": [{"name": "默想", "html": "<h3>兩旗默想<\/h3>\n<p>求恩：「這將會是求主賞我認清魔魁的詭計，幫助我防範牠；並祈求讓我認清由真正的最高領袖所示範的真生命，並賞我恩寵好能效法祂。」[139]。<\/p>\n<p>聖依納爵給我們講述：我主贏取靈魂的行動，與祂最大仇敵的行動，各方分別帶有各自的旗幟。<\/p>\n<p>我們必須充分意識到，一場戰爭正在進行：「人生在世，豈不像苦工般的勞役？人的歲月，豈不像傭工的時日？」（約7:1 – 拉丁通行本：militia est vita hominis super terram)。在這場戰爭中，沒有人可以保持中立：「不隨同我的，就是反對我；不與我收集的，就是分散。」（瑪12:30) 我們不能指望避免這場戰爭：「你們的仇敵魔鬼，如同咆哮的獅子巡遊，尋找可吞食的人。」（伯前5:9)。除非我們拒絕牠，否則我們將難免被牠吞噬。<\/p>\n<p>這個默想是讓我們認清基督的原則和手法，以及撒殫的謀略和狡計，使我們可以在一生中做出明智的決定和選擇。這是對理性的訴求。<\/p>\n<p>基督在耶路撒冷附近的廣場召集祂的追隨者。在巴比倫地區的另一個營地，路濟弗爾集結了牠的軍隊。這兩個被選中的城市分別是和平之城和混亂之城。我們祈求的是要徹底認清這兩個領袖和他們各自的策略。<\/p>\n<p>我們必須了解撒殫的詭計，因為許多屬靈戰爭的失敗是因為低估了敵人，或不知道牠 有何企圖，以及牠正要謀求什麼。我們與魔鬼決不可妥協，不可與牠商量。牠是我們(誓不兩立)的死敵；與牠討價還價，就會成為牠的奴隸。我們之間永遠不可能停戰或休戰。這是一場生死搏鬥。我們只需要掌握牠的戰鬥方法就可以打敗牠。另一方面，我們必須學習基督的方法，因為祂是踏碎蛇頭的女人的後裔。因此，祂給了我們戰勝撒殫的良方。<\/p>\n<h3>撒殫和他的原則<\/h3>\n<p>然後我們來到巴比倫的地方，默觀坐在火煙寶座上的撒殫。<\/p>\n<p>火象徵着牠給自己帶來的毀滅，並試圖強加諸整個世界。誠然，天主允許撒殫使用牠的力量對付我們，以測試我們的愛。然而，天主不會讓我們受試探超過我們的力量（參見 格前10:13)，反將豐富的恩寵和輕易的勝利賜給那些以謙遜和信賴去呼求祂的人。<\/p>\n<p>煙象徵撒殫以黑暗籠罩著他的邪惡計劃，牠的獵物必會被關在無知和困惑之中；他們必定是頭腦混亂，未曾向人請教或尋求指導。只有光明之子才有效對抗牠而安然無恙。<\/p>\n<p>撒殫時刻都不斷在做什麼？<\/p>\n<p>牠將牠的惡魔派往各處，到每個國家、每個城鎮、每個人；對牠而言，牠是無遠弗屆及無孔不入的。聖金口若望（St Chrysostom）曾教導，我們每一個人都有特定的惡魔 正在傾力詛咒我們，並纏繞我們到底。魔鬼像帶着「羅網」出來，以摧毀我們來報復 牠們的造物主。牠們嫉妒我們這些蒙召並注定要進天堂的人，決心將我們拖入他們自己的痛苦之中。<\/p>\n<p>自亞當和厄娃以來，牠所有的爪牙已有這樣的經驗逾萬千年。<\/p>\n<p>聖依納爵告訴我們，魔鬼首先引誘我們貪圖財富，從而讓我們更容易獲得世俗的虛榮，最後變得越來越驕傲；牠利用這三個步驟，導引出其他一切的邪惡｡（猴子和籠子的故事)[註]。<\/p>\n<p>「沒有人能事奉兩個主人：他或是要恨這一個而愛那一個，或是依附這一個而輕忽那一個。你們不能事奉天主而又事奉錢財。」（瑪6:24)<\/p>\n<p>在非洲, 當地人有一個萬試萬靈的獵猴方法。他們把食物放在一個很重的籠子內, 籠子有一道小門, 其大小剛好能讓猴子的手伸進去。<\/p>\n<p>猴子看到食物, 自然就會伸手進去取。當人們來捉牠時, 只要牠放下食物, 便可以逃跑, 但牠就是捨不得放下食物；由於牠手握著食物不肯放下, 便無法從那道小門退出並逃脫, 於是便成為人們的獵物。當地人就是看準了猴子的這種個性, 因此便能輕易地捕捉牠們。<\/p>\n<p>這比喻很適合用來說明, 魔鬼也很熟悉我們貪婪的個性, 深知我們中大多數傾向貪圖榮華富貴和權勢, 既不願意捨棄, 又不輕易放下, 魔鬼便有機可乘, 令我們成為牠的獵物。所以, 為對抗魔鬼, 我們必須懂得放下，毅然捨棄很多吸引著我們的世上事物。<\/p>\n<p>為什麼聖依納爵視財富為萬惡之源？<\/p>\n<p>因為在本質上 ，財富代表着除天主外，在世上可以攫取到的一切，以及享盡世物的權力。財富對我們的吸引力，在於它的確能帶給舒適和奢華。此外，財富讓人享有體面，這更使我們着迷。大家都知道，對榮譽的狂熱追逐正困擾著我們這個世代。<\/p>\n<p>財富導致虛榮。當我們擁有了值得擁有的東西，就會感到自滿。對自己有十足把握時，我們難免會遠離天主。我們轉向世物後，便會忘記天主，並滿足於我們的財產。<\/p>\n<p>驕傲是這種背離天主的高峰。我們變成孤立隔絕於天主。難怪耶穌説：「駱駝穿過針孔，比富有的人進入天主的國還容易。」（路18:25)。<\/p>\n<p>更何況，惡魔並不需要在理論上打贏這場戰鬥。如果我們在生活中忽視天主，無視祂對我們的計劃，那麼魔鬼已從實踐的層面上戰勝了，對牠來説已足夠了。<\/p>\n<p>可以肯定的是，這不需要鉅額財富，魔鬼只需讓人擁有除天主以外，其他可以帶來滿足的東西，及被其他人認同。<\/p>\n<h3>基督和祂的門徒<\/h3>\n<p>觀察基督――我們「真正的最高領袖」[139] ――那充滿寧謐而謙和恩寵的行為舉止，是很重要的。<\/p>\n<p>基督開展的運動與魔鬼的截然相反。首先，基督會引領所有人接受神貧，對救恩那至高無上的重要性有深刻而活潑的領悟，救恩是我們無法獨自賺得的，並且需靠我們擺脱對世物的過度依戀。為了幫助我們達致這種割捨和內在自由，基督甚至會要求祂的門徒渴望貧窮、以及「凌辱和蔑視」[146]。這是背離世物並將自己投向天主的開始：這是指不再沉溺世物，除非透過這些世物我們可以愛天主，或在天主內喜歡它們。<\/p>\n<p>這是一個崇高的理想，必須逐步實踐。第一步是在凌辱下保持忍耐和温馴。其次是一分對人無畏(而甘冒風險)的尊重。<\/p>\n<p>下一步是如果一個事業顯得是天主願意的，即使不受常人歡迎，我們仍要忠實地堅持下去。再下一步是務實的信念，即是我們經常説的：斥責通常比讚美更能促進我們的神益，失敗比成功對靈魂有更大的裨益。<\/p>\n<p>最後一步是不嫉妒，就是當別人比我們更受讚賞時，我們反而感到欣喜。這做法會讓我們「熱切渴望穿上基督」，而且形狀有如祂一様受「侮辱、誹謗和傷害，並被當作罪犯」[167]。任何想加入耶穌會的望會生，如果連至少「感覺到對感受這種渴求的想望」都沒有，聖依納爵會斷然拒絕他。<\/p>\n<p>聖多瑪斯告訴我們為什麼基督召喚祂的門徒要謙遜。「基督之所以特別向我們推薦謙遜，是因為人類得救的最大阻礙會藉此而得以剷除。因為人的得救是維繫於其關注屬天和屬靈的事物，而人一旦藉著世上事物致力於顯揚自己，便妨礙了他所應關注的。所以，為了消除這個障礙，我們的主以謙遜的榜樣，示範該如何鄙視外在顯耀的排場。因此，謙遜是導引人類以自願方式追求靈性和超性神益的稟性資質。」（S. Th., II-II,161,5)<\/p>\n<p>在這個默觀中，我們須絕對地祈求一事，就是讓我們能在神貧中被收納在基督的旗幟下。<\/p>\n<p>另一件事，我們也許可以祈求有條件地遭受實質的貧窮，而其前提是至高天主所喜悅的。<\/p>\n<p>同時也可以祈求能夠忍受侮辱和輕慢，從而更深地效法衪。<\/p>\n<p>對禱：<\/p>\n<ol>\n<li>\n<p>先求聖母為我祈求她的聖子和她的主耶穌，收納我在祂的旗下：第一、遵守嚴格的神貧，倘若至尊天主肯揀選我，收納我，更願實質的貧窮。第二、只要不致引人犯罪，或招惹至尊天主不悅，甘願受輕慢、凌辱，為能多多效法耶穌基督。念《聖母經》一遍。<\/p>\n<\/li>\n<li>\n<p>向聖子耶穌作同樣的祈禱，望他在聖父前為我求得此恩，念《向耶穌聖靈誦》一遍。<\/p>\n<\/li>\n<li>\n<p>向天主聖父作同樣的祈禱，望他賞賜我這些恩惠。念《天主經》一遍。<\/p>\n<\/li>\n<\/ol>"}], "notes": []}, {"id": "2-11", "num": "11", "kind": "默想要點", "title": "三等人", "veni": false, "sections": [{"name": "默想", "html": "<p><strong>三等人的默想<\/strong> [第149號]<\/p>\n<p>這一節的默想與兩旗的默想在道理上相同，但從不同的角度去思考。聖依納爵在「兩旗」中談過了理智，在這裏他談到我們的意志。本質上，這默想是從與天主旨意的關係來檢視我們的意志的現狀。<\/p>\n<p>理智很重要，然而，一個人可能知道要做某一件事，但卻不去做｡ 就如：「我所願意的善，我不去行；而我所不願意的惡，我卻去作。」（羅7:19)。<\/p>\n<p>這個默想就像一個氣壓計，可以衡量我們意志的壓力和張力。我們想知道我們是否真的 淡泊無欲 。重要的是對世間事物必須以天主的旨意作為我們的意願：亦即我的意願與天主的旨意有什麼關係？<\/p>\n<p>因此，這個默想是為了克服我們在意志上抗拒「天主想要給我的一切」。聖依納爵在開頭就明確指出：「這是同一個第四天的默想，為能做出更好的選擇。」<\/p>\n<p>以下是「三等人」的故事：「三個人都獲得一萬金幣，但並非完全出自他們本份內應有的――為愛天主的緣故。現在他們都願意拯救自己的靈魂， 並在主內尋獲平安，便致力擺脱依戀 那筆得來的金錢， 以免其心理負擔窒礙他們達成目標。」<\/p>\n<p>聖依納爵以金錢為例子，因為金錢較屬靈的事物或人，更容易讓我們察覺和辨明對物質的依戀。但是在默想中，我們可以用任何其他事例來思考我們依戀的事物。例如，我們可以思考三類希望康復的病人，而能夠妥善治療的方法卻都是痛苦的………。或者三類旅行者，他們都很想到達某個地點，但要到達那裏，則必須經歷一段危機四伏而非常疲累的旅程等等。<\/p>\n<p>這次默想的定像是個最威嚴壯麗的場景：「在這裏只為讓我看到自己站在我們的主天主和祂的所有聖人面前，使我能認清和渴望無限美善的天主所最喜歡的事。」<\/p>\n<p>求恩：「祈求天主賞我聖寵，助佑我作出更能光榮無限尊威的天主和拯救自己靈魂的選擇。」<\/p>\n<h3>要牢記的幾個原則：<\/h3>\n<p>a) 天主在召叫我，正如我們在默想基督的國度時看到的。儘管我有一切的弱點，惟天主仍希望我能夠成聖。<\/p>\n<p>b) 正如我們在兩旗默想中看到的，貧窮、 屈辱和蔑視是達到基督徒完美境界的唯一途徑。<\/p>\n<p>c) 如果我仍然對財富、榮譽、舒適、虛榮等感到強烈的依戀（在我的意願中)，這表明我仍然有點受著 這個（敗壞）世界的影響。<\/p>\n<p>d) 因此，如果天主對我的旨意確是如此，我不僅必須棄絕壞事，甚至連好的也要捨棄。<\/p>\n<ol>\n<li><strong>第一等級的人<\/strong>[第153號]<\/li>\n<\/ol>\n<p>「他們很想擺脱對那筆所得財富的依戀，好能在我們的主天主內，找到平安並肯定他們可得救，但直到死亡的時刻來臨，他們仍沒有採用過任何方法來做過什麼。」<\/p>\n<p>這類人好像很想要些什麼，但實際上他們並不想要它，因為他們沒有下定決心，設法採用過一些必要的方法，好能讓他們尋獲 天主內的平安並拯救自己。這並非真正的意志，不過是虛假的。<\/p>\n<p>有這種意志的人，都知道自己有某種缺陷、執着、過度的情慾，這些都是不應該保存的，但他們從沒有下定決心去擊退它們 ，整頓秩序或擺脱它們。<\/p>\n<p>他的意志停留在意圖的層面，它不會從那裡走到任何地方。在靈修生活中，善意是未足夠的｡「我知道你的作為：你也不冷，也不熱；巴不得你或冷或熱！但是，你既然是溫的，也不冷，也不熱，我必要從我口中把你吐出去。」（默3:15-16)<\/p>\n<p>在福音書中，我們找到了這種意志的例子：有一位經師前來，對他說：「師傅，你不論往那裡去，我要跟隨你。」耶穌給他說：「狐狸有穴，天上的飛鳥有巢，但是人子卻沒有枕頭的地方。」（瑪8:19-20)<\/p>\n<p>這是一群想要跟隨耶穌但不願接受任何不舒適的人；他們想要成果，但不想致力採用任何正確方法去達致這些成果。他們只是有良好的意圖，但僅此而已。<\/p>\n<p>這種意志對人的靈修生活是災難性的。人感到來自天主的內心提示，感到需要改善自己的靈修生活， 並致力於自己的得救，但那人始終不 情願以適當的方法來一一實現。<\/p>\n<p>例如，某人知道他必須避免某些導致犯罪的場合，但沒有去做：他的意志太弱了，以致未能做到。或者，天主呼召我與他建立更親密的友誼，但這意味著要祈禱，克己等等，而且，人面臨要為具體志向下定決心時，會有相當的惰性。或者，人須做某事時，卻會拖延耽擱……..。<\/p>\n<ol>\n<li><strong>第二等級的人<\/strong>[第154號]<\/li>\n<\/ol>\n<p>這等人説「我想要」，雖然他的意志算得上頗為堅定，但還是不夠完美。<\/p>\n<p>他們沒有為遵行天主旨意而定立必要的志向。反而 ，他們選擇了無效的方法。<\/p>\n<p>醫生替病人處方戒煙，因為他們的生命危在旦夕，但他們只決定_<strong>減少<\/strong>_吸煙…………。最終， 那些人不久便死去。<\/p>\n<p>第二種人的意志比第一種更棘手。這些人似乎有着堅定和決斷的意志。他們確實想擺脱過度的依戀，但實際上他們試圖要求天主依從他們，而不是反過來。在這個過程中，他們試圖説服自己，他們所做的一切都是為了中悦天主（自欺欺人)。這意味着，他們會用各種似是而非的理由，來為自己的行為辯解，以保住金錢（或香煙)。他們想擺脱過度的依戀，卻選擇了無效的方法。他們想兩者兼得：心靈上的平安和他們喜歡的東西｡(「你可以將那個蛋糕據為己有並可吃掉它………。」) 他們妥協了。<\/p>\n<p>按以上最後的分析，這種依戀是頗為嚴重的，因為它說明了他們喜愛世物甚於天主。我們可在富貴少年的故事中看到這一點………， 耶穌對他說：「你若願是成全的，去！變賣你所有的，施捨給窮人，你必有寶藏在天上；然後來跟隨我。」（瑪 19:21)。他自小就做了很多善事，但他沒法確切地依從耶穌對他的要求而捨棄一切。<\/p>\n<p>耶穌描述這種意志為：「一個人不能事奉兩個主人」（瑪 6:24)。<\/p>\n<p>這些人確實想要揹負十字架，但不全照耶穌為他們所選擇的。歸根結柢，那是對天主旨意的某種操縱：只要袮要求我的，正合乎我想要的，我才跟隨你。<\/p>\n<p>這種態度暴露了一種軟弱的意志，不重視天主對我們的實際計劃：我定會為天主做好一切，但「這件事」是例外………。這就是般雀比拉多的方式：他想拯救耶穌，但他的意願是理論上的。他的軟弱表明他尋求他自己多於真理………。<\/p>\n<p>聖十字若望説：「如果天主要求你一件事，你給祂另一件，這對你有什麼益處？要想想天主想望什麼，然後就去做。結果，你所得到的心靈滿足，甚至超過你順從自己意向所得到的。」（光與愛的諺語，第 73 期)。<\/p>\n<p>耶穌向他們說：「我的食物就是承行派遣我者的旨意，完成他的工程。」（若 4:34)。<\/p>\n<p>有時我們冒著風險做好事，但卻不完全是天主希望我們做的事。例如，一個人喜歡祈禱，但卻不與自己的歪念和惡習作戰｡ 聖方濟各沙雷氏説，一個母親的天職要求她在家裏撫養孩子，她不應把所有時間都花在聖堂 ………。.<\/p>\n<p>我們在福音中發現了許多個例子， 屬於附有條件才追隨耶穌的意願：就是那些聽到基督的召叫，還要等待的人。例如有一個門徒對衪說：「主，請許我先去埋葬我的父親。」但耶穌回答他說：「你跟隨我羆! 任憑死人去埋葬他們的死人!」（瑪8:21-22)。<\/p>\n<p>– 另一個人要求讓他先處理好自己的事情，耶穌對他說：「手扶著犁而往後看的，不適於天主的國。」（路 9:62)。<\/p>\n<ol>\n<li><strong>第三等級的人<\/strong>[第155號]<\/li>\n<\/ol>\n<p>這些屬於一心想要遵行天主旨意而且絕不妥協的人。這方面的例子是聖母瑪利亞在領報時說的「……願照你的話成就於我罷。」(路 1:38)： 她就像給天主簽了一張空白支票。<\/p>\n<p>他們是那種想擺脱一切偏情的人，亦會保持平心，全不介意保留金錢（或世物）與否。只要是天主對他們的旨意，他們才想保留它：「他們只求按照 天主啟示他們的旨意，變成自己的意志，為更好事奉和讚美尊威的天主。」 [155]。<\/p>\n<p>同時，他們並不知道天主對他們的旨意是什麼，惟仍然捨離那些事物，而且他們將會用盡心力不去滿足自己的慾望或其他事物，除非僅為事奉我們的主、天主，才足以感動他們去做。」<\/p>\n<p>我們應該盡力時常保持這種意志。我們意願的取向不是一成不變，而是靈活多變的，而且可能很複雜。一個人可能對某些事情有堅定的意願，而對另外一些事情的意願卻頗薄弱。而一個人可能在某一時刻有第三類人的意志，然後卻轉變了取向，變成擁有第二類人的意志。<\/p>\n<p>因此，這默想必須在人生的不同階段重複進行，作為一種操練。如果一個人發現自己對某事物猶豫不決，或感覺受到該事物過度吸引，那人便可能需要測試自己的意志，並更新自己意志的傾向，直到那人獲得完滿的內心自由。如果我們意識到我們未能以平心來對待某些事物，我們便必須努力並鍛鍊我們的意志，使自己至少在感情上能捨離它 (就算事實上還未能如此)。<\/p>\n<p>這可以與我們的智能狀態比較。如果我們即將參加考試，突然意識到我們對某些要點的瞭解不足，那麼我們必須加強鞏固該科目內的相關重點內容。為我們的意志也是這樣，如果我們意識到我們的意志 在應付某事物上很薄弱，那麼我們必須激發我們的意志（就像運動教練在決賽暫停時向球隊訓話 一樣)。<\/p>\n<p>許多事情正岌岌可危，這裏所關注的昰我們靈修生活的進展及我們與天主的關係。我們的自由正面對危機，當我們思考它時，我們就會明白我們往往會在意志薄弱的地方跌倒。如果一個人感覺依戀或傾向於不完全正確的事情上（在實質、數量或強度上)，我們就更可能在那特定的地方跌倒（犯罪)。因此，我們必須把我們的努力聚焦在這裏。在我們的靈修生活中，我們不會漫無目的地四處走，「我總是這樣跑，不是如同無定向的; 我這樣打拳，不是如同打空氣的；」（格前9:26)。<\/p>\n<p>我們可以從魔鬼的策略中吸取教訓；「……我們人性的仇敵從四面八方偵察我們所有的美德，包括神學上的、基要上的和道德上的。在牠找出我們防衛永恆救恩方面的最脆弱和最不足 的地方，牠就會在那裏攻擊並試圖如風暴一樣攻陷我們」[第327號]。<\/p>\n<p>這個默想應該以天主的美善作為它依據的背景。在我們眾多的選擇和決定中，尤其是當它們牽涉與世物的某種割捨時，我們應該時刻 牢記天主是美善的，天主想要的一切都只是我們靈魂的福祉、我們內在的自由和我們獲得聖化。<\/p>\n<p>加爾各答的德蘭修女下定決心永遠不會對耶穌説「不」。<\/p>\n<p>艾蒂特‧史坦茵 (Edith Stein)：「我記不起我曾經理解那是天主對我的旨意，而卻沒有付諸實行。」<\/p>\n<p>聖十字瑪麗：「對我來説，天主的旨意是一本我從來都百讀不厭的書，它對我來説總是具有新的魅力。我無法向你說明：在我看來天主的旨意是多麼美好的事。」<\/p>\n<p>聖依納爵説，我們應該採用兩旗的默想相同的對禱，來結束這次默想。<\/p>\n<h3>福音書中的一些例子<\/h3>\n<p>《巴克萊（Barclays）釋經集》： 那時正是猶太人的慶節，耶穌便上了耶路撒冷。在耶路撒冷靠近羊門有一個水池，希伯來語叫作貝特匝達（Bethzatha)，周圍有五個走廊。在這些走廊內，躺著許多患病的，瞎眼的，瘸腿的，痳痺的，都在等候水動，因為有天使按時下到水池中，攪動池水；水動後，第一個下去的，無論他患什麼病，必會痊愈。在那裡有一個人，患病已三十八年。耶穌看見這人躺在那裡，知道他已病了多時，就向他說：「你願意痊愈嗎？」那病人回答說：「主，我沒有人在水動的時候，把我放到水池中；我正到的時候，別人在我以前已經下去了。」耶穌向他說：「起來，拿起你的床，行走罷！」那人便立刻痊愈了，拿起自己的床行走。（若5:1-9）<\/p>\n<p>(i) 耶穌首先問這個人他是否想被治癒。這個問題並不像聽起來那麼愚蠢。那男人已等了三十八年，很可能所有希望已經破滅，只留下消極而鬱悶的絕望。在他的內心深處，這個人可能很滿足於繼續是一個病人，因為如果他被治癒了，他將可能要承擔所有謀生的重擔。有些病弱者並不介意成為長期的病弱，因為其他人做了所有的工作和揹負起所有的擔憂。但是這個人的反應是即時的。他想得到醫治，儘管他不明白自己怎樣才可以被治好，因為沒有人來幫助他。<\/p>\n<p>想得到耶穌的力量的首要條件是對它強烈的渴望。耶穌説：「你真的想要改變嗎？」如果在我們的內心深處，我們很滿足於保持現狀，那麼我們就不會改變。<\/p>\n<p>(ii) 耶穌接着吩咐那人起來，這就好像對他説：「老兄，順從這個意願，你和我就可以一起完成這件事！」天主的大能永遠不會免除人的努力。最真實無誤的就是我們必須理解自己的無助；惟在最真確的意義上，當我們的意志和天主的全能合作，即會令奇蹟成為可能時，奇蹟就會發生，而這是真實的。<\/p>\n<p>(iii) 實際上，耶穌是在命令這個人去嘗試不可能的事｡ 他説：「起來。」他的床只是一個像框架一樣的輕型擔架──希臘語是 krabbatos (GSN2895)，這口語的真正意思是一張簡陋的小床──而耶穌告訴他把它撿起來帶走。那人很可能會抱怨説，他的床已用來負載了他三十八年，現在反叫他拿起它，那並沒有多大意義吧？但是他和基督一起努力了，事情就這樣完成了。<\/p>\n<p>– 聖母領報；訪親（路 1:28)。<\/p>\n<p>– 亞巴郎（創 12:4)。<\/p>\n<p>– 撒慕爾（撒上 3:10)。<\/p>\n<p>– 聖瑪竇（瑪 9:9)。<\/p>\n<p>– 聖保祿:……立即（迦 1:17)。<\/p>\n<h3>對禱<\/h3>\n<p>注意[第157號]<\/p>"}], "notes": []}, {"id": "2-12", "num": "12", "kind": "默想要點", "title": "苦難：山園祈禱", "veni": false, "sections": [{"name": "默想", "html": "<p><strong>第三週――苦難<\/strong> [第190號]<\/p>\n<p>我們現在開始第三週的神操。聖依納爵試圖從我們救主的苦難中，為我們樹立我們必須遵循的典範。<\/p>\n<p>默觀――革責瑪尼園<\/p>\n<p>第一前導： 歷史：我們的主基督如何與祂的十一個門徒，從熙雍山下來，到了約沙法特谷。祂將八人留在山谷的一處，只帶同其他三人進入園中。<\/p>\n<p>然後祂開始祈禱，祂的汗水變成了血珠｡ 「我父，若是可能，就讓這杯離開我罷；但不要照我的意願，而要照你所願意的。」（瑪26:39)。祂三次向天父禱告，也三次將門徒從睡夢中叫醒。然後祂被抓住並被帶著越過山谷，回到山坡上，前往亞納斯的家裡去。<\/p>\n<p>第二前導：定像：想像那個地方 (瑪 26:36-56；谷 14:32-52；路 22:40-53; 若 18:2-11)。<\/p>\n<p>第三前導：「因基督受苦而一同悲傷，因基督爲我忍受巨大的苦難、流淚和深深的痛苦而心碎。」<\/p>\n<p>第一點：想像當中的人物，並在自己內心反思。.<\/p>\n<p>第二點：傾聽他們所說的，並反思。<\/p>\n<p>第三點：觀察他們在做什麼，及其他近似的細節。<\/p>\n<p>我們必須試圖進入基督的心，以瞭解祂內心的苦痛和折磨。<\/p>\n<p><strong>從這次默想中必須尋求的是什麼<\/strong> [第195-197號]<\/p>\n<p>1) <strong>我們必須思考基督在祂的人性中所忍受的苦，或所願意忍受的苦<\/strong>。我必須著力為此而悲痛，並感到傷心難過。<\/p>\n<p>2）我們必須思考祂的天主性如何自我隱藏了。耶穌為甚麼能消滅祂的仇敵，但祂反而讓祂的人性受如此殘酷的苦難？耶穌可以消滅祂的仇敵，但祂反而允許祂的人性受苦。<\/p>\n<p>3）<strong>我們必須思考耶穌為我的罪受苦，以及我應該做什麼來為祂受苦。<\/strong><\/p>\n<p>主的苦難是以無限向度的短語來記載其開始和結束。它們暗示着耶穌的靈魂所經歷的痛苦。除非耶穌曾揭示了那些提示 ，否則我們甚至不敢如祂所揭示那般想像祂的苦難：<\/p>\n<p>「我的心靈憂悶得要死」（瑪 26:38）<\/p>\n<p>「我的天主，我的天主，你爲什麼捨棄了我？」 （瑪 27:46）<\/p>\n<p>「當他還在血肉之身時，以大聲哀號和和眼淚向那能救祂脱離死亡的天主，獻上了祈禱和懇求，」（希5:7)。<\/p>\n<p>這些記述表明了基督內在的痛苦。聖多瑪斯說，耶穌身體上的折磨只是祂內心痛苦的影子。這種折磨反映了地獄的痛苦：這是那些被完全被棄絕了的人的狀態――而同是人亦是天主的耶穌，也被完全棄絶。<\/p>\n<p>耶穌開始感到「憂悶和恐怖」（瑪 26:37)；然後「驚懼恐怖」（谷 14:33)。<\/p>\n<p>「父啊！你如果願意，就給我免去這杯罷！但不要隨我的意願，惟照你的意願成就罷！」（路 22:42)<\/p>\n<p>「他在極度恐慌中，汗如同血珠滴在地上。」（路 22:44)<\/p>\n<h3>祂痛苦的原因有三個：<\/h3>\n<p>1) 祂對迫在眉睫的苦難和死亡的預見。這帶來的凌辱……….<\/p>\n<p>“Iesus coepit Pavere et tedere”（「耶穌……開始感到驚懼和恐怖。」 (谷14:33)<\/p>\n<p>由預見巨大痛苦或危險帶來的恐懼，尤其是當那是不可避免時，通常會產生比身體疼痛本身更大的痛苦，（例如：逼近的考試；等待槍斃或手術；坦克車在戰場上對決），這甚至有時會驅使人自殺。我們想像的功能使我們預見將會出現的邪惡，並與它抗爭。這對耶穌帶來更大的折磨 (耶穌取了一個肉身，以便祂為我們而死)。<\/p>\n<p>耶穌第一次流血，不是因鞭打造成，而是因祂感到悲傷難過。<\/p>\n<p>痛苦和感性之間有着密切的關聯……<\/p>\n<p>我們的心神(良心)爲我們肉體的痛(狗的痛,──一個人的痛)提供了另一個維度，有點像第三維度。但在耶穌的情況，那是天主在承受痛苦。<\/p>\n<p>– 在祂的觸覺方面：祂的肉被撕裂了（殮布──鞭打，有如米路吉遜的《受難記》)；<\/p>\n<p>– 在祂的味覺方面：苦膽和醋<\/p>\n<p>– 在祂的聽覺方面：褻瀆言行和嘲弄<\/p>\n<p>– 在祂的視覺方面：看着祂的母親<\/p>\n<p>– 祂的頭顱被荊棘刺傷折磨<\/p>\n<p>– 祂的手腳被釘子刺穿<\/p>\n<p>– 祂的臉被拳擊和吐了唾沫；<\/p>\n<p>並思考祂的身體被鞭打…….. 「看，這個人」（若 19:5）<\/p>\n<p>「他沒有俊美，也沒有華麗，可使我們瞻仰。他没有儀容，可使我們戀慕。他受盡了侮辱，被人遺棄，他真是一個苦人，熟悉病苦，他好像一個人們掩面不顧的人；他受盡了侮辱，因而我們都以他不算什麽。」（依 53:2-3）<\/p>\n<ol>\n<li>普世的罪：祂是祭獻的羔羊。祂承擔了整個人類的罪惡（罪惡的含意──紐曼)。耶穌知道罪的邪惡（BMV = 榮福童貞瑪利亞作為一個孩子)。<\/li>\n<\/ol>\n<p>「他所背負的，是我們的疾苦；担負的，是我們的疼痛；我們還以為他受了懲罰，為天主所擊傷和受貶抑的人。可是她被刺透，是因了我们的悖逆；他被打傷，是因了我们的罪惡；因他受了懲罰，我们便得了安全；因他受了創傷，我們便得了痊癒。」（依 53:4-5)<\/p>\n<p><strong>我的罪<\/strong>（“dilexit me et tradidit semetipsum pro me” [祂愛我並為我捨棄了自己]：ST：為了單一的罪過……..)。讓我們思考各種罪……..<\/p>\n<p>「他曾使那不認識罪的，替我們成了罪，好叫我們在他內成爲天主的正義。」（格後5:21)<\/p>\n<p>「基督由法律的咒駡中贖出了我們，為我們成了可咒駡的，」（迦 3:13)<\/p>\n<p>誰殺了耶穌?（St Alphonsus Liguori 聖雅風/聖亞豐索：殺死祂的是我們的罪──我的罪。)<\/p>\n<p>3）<strong>認識我們的忘恩負義<\/strong><\/p>\n<p>(我的血於你何益？詠 30:10) 例如:猶達斯<\/p>\n<p>耶穌可以聽到該被詛咒的人的褻瀆言行。<\/p>\n<p>耶穌看着祂的血漫無目的而白白地枉費在這麼多人身上。<\/p>\n<p>「我白白勤勞了，我枉費了氣力而毫無好處。」（依49：4)<\/p>\n<p>對談：對基督｡ 「我們的天父（天主經）」<\/p>\n<p>聖保祿說：<\/p>\n<p>– 「我曾決定，在你們中不知道别的，只知道耶穌基督，這被釘在十字架上的耶穌基督；」（格前 2:2)<\/p>\n<p>– 「如果我們堅忍到底，也必與他一同為王」（弟後 2：12)<\/p>\n<p>– 「我實在以為現時的苦楚，與將來在我們身上要顯示的光榮，是不能較量的。」(羅 8:18)<\/p>\n<p>– 「我們連在磨難中也歡躍，因爲知道望德不叫人蒙羞。」(羅 5:3ff)<\/p>\n<p>– 「因爲我們這現時輕微的苦難，正分外無比地給我們造就永遠的光榮厚報，」（格後 4:17)<\/p>\n<p>再者，十字架是一眾聖人的願望：<\/p>\n<p>-在沒有痛苦下，我度過的時辰在我看來似乎是失去了的時光，只有痛苦讓我的生活更容易承受。（聖瑪加利大亞拉高，St Margaret Mary Alocoque)<\/p>\n<p>– 那些因基督的光榮苦難令其神往，而渴望靈魂得救的人，趕緊在神聖十字架的桌前就座。（謝納‧聖佳琳/聖加大利納，St Catherine of Siena）<\/p>\n<p>– 主啊，要麼死去，要麼受苦。（聖女大德蘭，St Teresa of Avila)<\/p>\n<p>– 不是死去，而是受苦。（巴斯的聖瑪利亞瑪達肋納，St Mary Magdalene de Pazzi)<\/p>\n<p>– 主，爲你受苦和被鄙視。（聖十字若望, St John of the Cross)<\/p>\n<p>– 靠着我們敬愛的天主的憐憫，除了與耶穌同釘十字架之外，我不想知道別的事情，也不想享受任何其他安慰。（聖十字保祿, St Paul of Cross）<\/p>\n<p>– 真正熱愛我們主基督的十字架的人，當遇到這些考驗時會得到憩息；當他們逃離這些考驗，或不再有這些考驗時，就會死去。（聖方濟各沙勿略，St Francis Xavier, 普世傳教主保)<\/p>\n<p>– 十字架不會沒有耶穌。或者耶穌沒有十字架。（聖類斯‧葛利寧‧蒙福特, St Louis Marie Grignion de Monfort).<\/p>\n<p>– 我渴望並選擇與基督一起貧窮，而不是財富；與基督一起備受侮辱，而不是榮耀；我渴望為基督緣故而被視為毫無價值的傻瓜，而不是在今世因個人智慧和明智而深受好評。（聖依納爵‧羅耀拉，St Ignatius of Layola)<\/p>\n<p>聖人喜歡受苦，因為這是他們跟隨耶穌，並表明他們有多愛祂的最佳方法：<\/p>\n<p>– 主啊，增加我的痛苦，並因這些痛苦增加祢在我心中的愛。（聖羅撒, St Rose of Lima)<\/p>\n<p>– 為基督受苦便會找到真正的人間天堂。（聖類斯‧葛利寧‧蒙福特，St Louis Marie Grignion de Monfort）<\/p>\n<p>– 對基督的愛唯靠與祂同在十字架上受釘；並無其他途徑。（聖類斯奧里奧內, St Luis Orione)<\/p>\n<p>基督的十字架是喜樂。如果不是活在喜樂中，這可能是個十字架，但它永不會來自基督的。這是宗徒、殉道者、聖師和所有聖人不斷的教導：<\/p>\n<p>――「我對你們大可放心；我為你們也很可誇耀；我充滿了安慰。在我們各樣的苦難中，我格外充滿喜樂，」（格後7:4)<\/p>\n<p>– 「我的弟兄們，幾時你們落在各種試探裏，要認為昰大喜樂」（雅 1:2)<\/p>\n<p>– 痛苦對我來說是未知的。在其中我找到了我的喜樂，因爲在十字架上找到了耶穌。當一個人愛的時候，痛苦又有什麼關係呢？什麼是犧牲，什麼是十字架，當耶穌基督在它上面時，天堂就在那裏? （安底斯的聖德蘭，St Teresa of the Andes, 智利加爾默羅聖衣會)<\/p>\n<p>– 我已經不會再痛苦了，因爲對我來說，所有的痛苦都是甜蜜的。（聖女小德蘭，St Therese of Child Jesus of Liesiux，聖師及普世傳教主保)<\/p>\n<p>– 十字架是天主給祂的朋友的禮物。我承受的十字架,似乎比我能夠承受的要多得多。我要自己去祈求能夠喜愛十字架，我就很快樂。的確，快樂不需要尋找，因為就在那裏。（聖若翰維雅納, St John Vianney)<\/p>\n<p>– 等待帶來的好處是如此之大，以至於所有的痛苦都給了我安慰。（聖十字若望，St John of Cross)<\/p>\n<p>– 可愛的基督，爲愛被釘十字架!……….我渴望愛祢以至爲愛而死。（聖女聖三麗莎, St Elizabeth of the Trinity)<\/p>"}], "notes": []}, {"id": "2-13", "num": "13", "kind": "默想要點", "title": "苦難：宗教和政治審判", "veni": false, "sections": [{"name": "默想", "html": "<h3>宗教和政治審判<\/h3>\n<p>求恩：「祈求悲傷、憐憫和羞辱，因為主爲了我的罪要去受苦。」<\/p>\n<p>在默想基督的苦難時，我會設想祂「為我」受苦，我會不斷問自己究竟我能爲基督做些什麼。<\/p>\n<p>扼要地閱覽一下耶穌的苦難能使我們意識到耶穌曾蒙受的羞辱和輕慢有多大｡ 「他們就向耶穌下手，拿住了他。耶穌開口對他們說：「你們帶著刀劍棍棒出來拿我，如同對付強盜一樣。」 (谷 14:46,48)。祂像在夜裏被抓到的盜賊一樣被捕。<\/p>\n<h3>宗教審判<\/h3>\n<p><strong>1.<\/strong> <strong>他們把耶穌送到亞納斯那裏<\/strong><\/p>\n<p>「他們把耶穌帶到大司祭那裏，所有的司祭長、長老和經師都聚集在那裏……….原來有許多人造假證據告他，但那些證據各不相符。」(谷 14:53.56)。耶穌被捆綁並拖到公議會前，在那裏祂被誣告。<\/p>\n<p>在被帶到公議會之前，大司祭亞納斯想就祂召收門徒和宣揚的道理去審問耶穌。亞納斯的企圖是查獲一個祕密團夥的可能性，或發現祂所教授的一些異端道理。<\/p>\n<p>耶穌回答說祂總是公開說話，如果亞納斯想知道祂說了什麼，祂應該問那些在會堂和聖殿裏聽過祂說話的人。這個激發附近一名守衛給祂的耳光：「你就這樣答覆大司祭嗎？」 (若 18:22)。<\/p>\n<p>耶穌可能不是被掌摑，而是像都靈聖殮布所顯示的那樣被杖打，它顯示屍體鼻樑破裂，右臉頰腫脹（經師通常拿着手杖，他或是一個左撇子｡）這毆打是非法的，但沒有受到懲罰。耶穌在那裡並沒受到法律的保障。<\/p>\n<p>耶穌卻以忍耐、謙卑和溫良的態度回答說：「我若說得不對，你指證那裏不對；若對，你爲什麼打我？」 (若 18:23)。<\/p>\n<p>「亞納斯遂把他解送到大司祭蓋法那裏去。」(若 18:24)。<\/p>\n<p><strong>2.<\/strong> <strong>耶穌晚上在蓋法的處所受審<\/strong><\/p>\n<p>1) 大司祭蓋法是撒杜塞人。也就是說，在意識形態上，他是一個物質主義者｡ 「就是這個蓋法曾給猶太人出過主意：叫一個人替百姓死，是有利的。」(若 18:14)。<\/p>\n<p>2) 儘管不是所有成員都在場，但公議會已經聚集在他的處所裏。這個初步審查是爲了獲得一些關於耶穌的信息 (參見瑪 26:57)。會議是非法的，因爲它是在晚上舉行。很明顯，耶穌的死早已決定了。<\/p>\n<p>3) 當他們完成簡短的審訊後，耶穌被送到處所的地下室，由兵士看守｡ 「那些羈押耶穌的人，戲弄他、打他；又蒙起他來，問他說：『你猜一猜：是誰打你？』」 (路22：63-64)。<\/p>\n<p>兵士們向耶穌發泄他們的憤怒，因爲他們要在晚上工作，而且他們也可能喝醉了。他們一定對耶穌的溫良感到驚訝，這便讓他們更加憤怒｡ 「你們一向聽說過：『以眼還眼，以牙還牙。』我卻對你們說：不要抵抗惡人；而且，若有人掌擊你的右頰，你把另一面也轉給他。」(瑪 5:38)。耶穌以言傳身教。<\/p>\n<p><strong>3.<\/strong> <strong>上午審訊<\/strong><\/p>\n<p>1）「天一亮，民間長老及司祭長並經師集合起來，把耶穌帶到他們的公議會裏。」(路 22:66)。組成公議會的所有三個團體聚集在一起：長老、經師和司祭長。<\/p>\n<p>2）他們沒有審視案件的具體情況，耶穌的命運已經決定了。他們只想尋找證人，以便判祂死刑：「司祭長和全體公議會，尋找證據反對耶穌，為把他處死，卻沒有找著。」(谷 14:55)。<\/p>\n<p>3) 他們傳召了許多證人，但他們自相矛盾：「許多人造假證據誣告他，但他們的證供互不相符。有幾個人站起來，作假見證來指控他說：『我們曾聽他說過：我要拆毁這座用手建造的聖殿，三天內要另建一座不用手建造的。』即使如此，他們的證詞並不一致。」(谷 14:56-59)。<\/p>\n<p>耶穌從未說過祂會毀壞聖殿。他說：「你們拆毀這座聖殿……」(若 2:19)。<\/p>\n<p>4) 當蓋法知道盤問只會讓耶穌無罪釋放時，他介入了：「大司祭起來，站在中間，問耶穌說：『這些人作證反對你的事，你什麼也不回答嗎？』」（谷 14:60)。事實上，指控者已經呈現很大的矛盾。<\/p>\n<p>5）但耶穌保持沉默：「耶穌不作聲，什麼也不回答。」(谷 14:61 – Iesus autem tacebat)。<\/p>\n<p>6) 蓋法運用他的政治權力，直接告訴耶穌：「我命你在生活的天主前起誓告訴我們：你是不是默西亞，天主之子？」(瑪26:63)[註]。 蓋法這樣做，是以天主作見證。<\/p>\n<p>「耶穌對他說：『你說的是。並且我告訴你們：從此你們將要看見人子，坐在大能者的右邊，乘著天上的雲彩降來。』」(瑪26:64)。耶穌的回應引用了達尼爾關於默西亞的預言 (達7:13)。<\/p>\n<p>「大司祭遂撕裂自己的衣服說：『何必還需要見證呢？你們都聽見褻瀆的話了，你們看著該怎樣？』眾人都判定他該死。」（谷 14：63-64)。耶穌被判定爲褻瀆者。<\/p>\n<p>祂的敵人「開始向他吐唾沫，蒙起他的臉來，用拳頭打他，對他說：『你作先知罷！』差役且用巴掌打他。」（谷 14:65)。<\/p>\n<p>「他受盡了侮辱，被人遺棄；他真是個苦人，熟悉病苦；他好像一個人們掩面不顧的人，他受盡了侮辱，因而我們都以他並不算什麼。然而他所背負的是我們的疾苦；擔負的，是我們的疼痛；我們還以為他受了懲罰，為天主所擊傷，和受貶抑的人。他受虐待，仍然謙遜忍受，總不開口，如同被牽去待宰的羔羊；又像母羊在剪毛的人前不出聲，他也同樣不開口。為此我把大眾賜與他作報酬，他獲得了無數的人作為獵物；因為他為了承擔大眾的罪過，作罪犯的中保，犧牲了自己的性命，至於死亡，被列於罪犯之中。」（依53:3.4.7.12)。<\/p>\n<p>「至於我，成了微蟲，失掉了人形；是人類的恥辱，受百姓的欺淩。凡看見我的人都戲笑我，他們都撇著嘴，搖著頭。」（詠22：6-7)。<\/p>\n<p>耶穌再次受辱：「於是，他們全體起來，把耶穌押送到比拉多面前，開始控告他說：『我們查得這個人煽惑我們的民族，阻止給凱撒納稅，且自稱是默西亞君王。』」（路 23:1-2)。<\/p>\n<h3>政治審判<\/h3>\n<p><strong>1.<\/strong> <strong>比拉多<\/strong> (參閱瑪 27: 1-6; 路 23:1-25; 若18:28等等)<\/p>\n<p>猶太人向比拉多提出各式各樣的指控。因爲他們不能以自己的判決去處決耶穌，他們轉向比拉多。他們指責耶穌: a) 把自己當作天主; b) 是罪犯; c) 擾亂國家; d) 稱自己爲國王。<\/p>\n<p>法利塞人的意識是是顯著的：「他們自己卻沒有進入總督府，怕受了沾污，而不能吃逾越節的羔羊。」（若 18:28)｡ 「我們是不許處死任何人的！」（若 18:31)。<\/p>\n<p>直到他們提出了所有指控，比拉多就查問耶穌自稱是天主的事。耶穌在其他時候都保持沉默，但在這裏他給出了一個讓比拉多困惑的答案。比拉多只著眼政治，耶穌卻說：「這話是由你自己說的，或是別人論我而對你說的？」 （若 18:34)。然後祂說祂擁有王權，但那是另類的：「我的國不屬於這世界。假使我的國屬於這世界，我的臣民早已反抗了，使我不至於被交給猶太人，但是，我的國不是這世界的。」（若 18:36)。這一回應使比拉多感到困擾，因此他決定不對耶穌做任何事，並將他送到黑落德那裏。<\/p>\n<p><strong>2.<\/strong> <strong>黑落德<\/strong><\/p>\n<p>黑落德高興見到這個會行神蹟的人站在他面前。事實上，他想耶穌為他行一個奇蹟。黑落德是一個膚淺、感性和輕浮的人，耶穌用「狐狸」這個詞來形容他（路 13:32)。就是他殺死了若翰洗者。<\/p>\n<p>黑落德問了耶穌許多問題，但耶穌只以沉默應對，黑落德不值得祂認真去理會。於是黑落德嘲笑耶穌，把祂當作瘋子，讓他的僕人給祂穿上衣服，然後把祂送回比拉多那裏。耶穌忍耐地保持沉默，為了我們的緣故，祂很樂意接受這種屈辱（參見路23:8-11)。<\/p>\n<p><strong>3.<\/strong> <strong>再見比拉多<\/strong><\/p>\n<p>比拉多想找方法擺脫這種困境。他不想殺死一個無辜的人，<\/p>\n<p>但與此同時，他不希望猶太人挑起可能危及他政治生涯的叛亂：「你們有一個慣例：在逾越節我該給你們釋放一人，那麼你們願意我給你們釋放猶太人的君王嗎？」 （若 18:39)｡ 「他們就大聲喊說：『不要這人，而要巴辣巴！』」 （若 18:40)｡ 「比拉多給他們釋放了巴辣巴；至於耶穌，把他鞭打了以後，交給人釘在十字架上。」（瑪 27:26)。<\/p>\n<p>比拉多確有關注真理，但他的決定是出於他對自己的榮礜和事業的過度依戀（參見瑪 27:26；谷 15:15；路23:25；若 19:16)。<\/p>\n<p>鞭打是極殘酷的折磨。所造成的疼痛程度因事而異，這取決於所使用的器具以及施刑者打擊的強度。除了身體上的痛若外，還須加上一點，即受害者完全赤身裸體並被綁在一根柱子受刑的。酷刑是如此的羞辱，以至根據波西亞法( lex Porcia)，羅馬公民不能被鞭打。<\/p>\n<h3>鞭打<\/h3>\n<p>瑪竇、馬爾谷和若望只說「比拉多將耶穌鞭打」（若 19:1)。比拉多的意圖是讓猶太人對耶穌產生同情。因此，施刑者很可能接到指示，以引起對被判刑者的同情的方式去做。<\/p>\n<p>a) 通常鞭打在釘十字架之前，但有時也會只鞭打了事，這正是比拉多對耶穌的意圖。<\/p>\n<p>b) 被鞭打的人被剝光衣服，綁在柱子上，被鞭打至皮開肉裂。<\/p>\n<p>c) 「flagellum」（或flagrum）是一根短鞭，用鉛球和羊骨綁在皮條上。因它造成的效果被稱爲「蠍子」。它穿透了皮肉，並會抽出一點點肉來。<\/p>\n<p>d) 猶太法律限打 39 下，羅馬法律則沒有限制。耶穌是按照羅馬人的方式被鞭打的。<\/p>\n<p>e) 鞭打使人的身體變成了一塊血肉。有時受刑者會失去生命。<\/p>\n<p>f) 都靈聖殮布有 97 條條紋：背面 61 條，正面 36 條。每一刑鞭都有三根鞭條，每鞭一下會造成 6 處傷口。耶穌的肉體總共有 582 處傷口。<\/p>\n<p>鞭打的效果包括：割傷、撕裂，重擊，開洞。事實上不時在殉道者的敘述中，我們可以讀到，受害者的傷口深可見骨和血管。<\/p>\n<p>對耶穌的鞭打是由有敘利亞或撒瑪黎雅血統的羅馬兵士執行的。這些人對猶太人懷有極大的仇恨。<\/p>\n<p>我將看到我們的主為「我」，為「我和全世界的罪」受苦。我要問自己，爲了基督的緣故，我要做什麼才能回應祂對我的愛。<\/p>\n<p>「兵士把耶穌帶到庭院裏面，即總督府內，把全隊叫齊，給耶穌穿上紫紅袍，編了一個茨冠給他戴上，開始向他致敬説：『猶太人的君王，萬歲！』然後用一根蘆葦敲他的頭，向他吐唾沫，屈膝朝拜他。他們戲弄了耶穌之後，就給他脫去紫紅袍，給他穿上他自己的衣服，然後帶他出去，把他釘在十字架上」（谷 15:16-20)。<\/p>\n<h3>茨冠加冕<\/h3>\n<p>福音的敘述詳細描述了茨冠。這可能是因爲這是一種聞所未聞的做法。兵士們戲弄耶穌，好像嘲弄一個假冒國王的騙徒。<\/p>\n<p>1)「 鞭打後，兵士將他帶進屋內，即總督府，召集了全隊」（谷 15:16)。<\/p>\n<p>2) 「給他披上一件紫紅袍」（若 19:2)。這是兵士們過去常穿在盔甲上的羊毛斗篷。他們很可能讓耶穌坐在假寶座上以取笑他。<\/p>\n<p>3) 他們「用荊棘編了一個茨冠，放在他頭上」（若 19:2)。實際上，它的形狀不是皇冠，而是帽子或頭盔的形狀。<\/p>\n<p>耶路撒冷希伯來大學聖經植物博物館館長 Ha-Reubeni 發表了一項關於製作茨冠的植物的研究。它很可能是由「棘蕈Poterium spinosum」製成的，在希伯來語中是「sirah」。這種植物存在於耶路撒冷，人們用它取火。兵士們看到院子裏的灌木，就用它製造了一個王冠。人們必須明白，戴在耶穌的頭上的，不是一個的精緻的王冠，而是一個頭盔形狀的粗硬物件。<\/p>\n<p>4) 他們「拿一根蘆葦放在他的右手裏；」（瑪 27:29)。他們讓耶穌坐在那裏，跪在他面前｡ 「他們開始向他敬禮：『萬歲，猶太人的君王！』」並不斷用蘆葦敲打他的頭，向他吐唾沫。他們跪在他面前表示敬意（谷 15:18-19)。<\/p>\n<p>5) 「他們反覆打他」（若 19:3)。他們「不斷用蘆葦打他的頭，吐唾沫在他身上」（谷 15:19)，使荊棘深深插入祂的頭。<\/p>\n<p>6) 他們向他吐唾沫（參見谷 15:19)，尤其是在他的臉上。<\/p>\n<p>7）「戲弄完了，就給他脫去外氅，又給他穿上他自己的衣服，帶他去釘在十字架上。」（瑪27:31)。<\/p>\n<p>可以正確地說，這段敘述是人類歷史上最臭名昭著的一頁。它顯示了我們有能力做什麼。沒有天主的恩寵，我們就會墮落，變得比畜牲更壞。<\/p>\n<p>當他完全沉默地受苦時，我看到耶穌「如同被牽去待宰的羔羊」（依53:7)。他的印記是「萬王之王，萬主之主」（默 19:16）。<\/p>\n<p>在默想基督的國度時，我決定「在苦難中」跟隨他，捨棄我的肉慾、自私、對享樂的執着和這個世界的虛榮。我會告訴自己：「畢竟基督頭上戴着茨冠，作為祂奧體內的一個肢體是不能這樣嬌弱的。」（聖伯爾納德，St Bernard)<\/p>\n<p>當我回顧並思考自己的生活時，我意識到我與被鞭打、戴上茨冠的耶穌基督相距甚遠。事實上，我的生活是相當輕鬆和舒適的。我始終拒絕所有不討好的事物以及任何擾亂我的幸福的事物。但這與基督的榜樣完全相反，即使我宣稱自己是他的門徒。我必須自問我有多大真誠跟隨耶穌｡ 「沒有僕人大過主人的，也沒有奉使的大過派遣他的。」（若 13:16)。<\/p>\n<p>當我望着耶穌基督被鞭打並戴上茨冠時，我會被感染和從中汲取力量，去忍受任何在肉體還是精神上，臨到我身上的痛苦。平時我會抱怨任何痛若的經歷。當事情不是按照我的期望發生時，我是第一個表達失望的人。我要從耶穌身上學習怎樣以基督徒的態度承擔我的十字架。<\/p>\n<p>在他的苦難中，耶穌遭受了最痛若的屈辱：他被譏諷、嘲笑、掌摑、吐唾沫、侮辱、被視爲瘋子、假先知、被裁定爲褻瀆者、假默西亞、當權者的叛徒。他像蟲子一樣被踐踏，被剝奪了所有人的尊嚴。在屈辱中，他孤獨一人，沒有一個人爲他辯護。敵人的誣告和虛善、比拉多、羅馬兵士和猶太人的輕蔑都落在祂身上，永恆的父依然沉默，只剩下他一個人。<\/p>\n<p>耶穌在人們眼中是一個褻瀆者、罪犯和強盜，一個刺客比他更受歡迎。的確，耶穌爲自己選擇了最卑末的位置。<\/p>\n<p>在兩旗的默想中，我看到了驕傲如何引導人走向各種邪惡。耶穌以言傳身教，糾正我的驕傲、個人野心；以及控制別人、被舉揚、被人尊重和享尊榮的渴望。我必須願意踏上羞辱之路。<\/p>\n<p>我通常拒絕任何對我和我的行爲的批評。這與耶穌不同。<\/p>\n<p>當我默想基督受難時的屈辱時，我意識到，像伯多祿一樣，我也是「遠遠地」跟著耶穌（路 22:54)：我想成爲耶穌的門徒，卻不想完全分擔祂的苦難。但我已祈求主的恩寵，接納我到他的旗下。<\/p>\n<p>另一個我們可以默想的題材是耶穌的臨終七言(架上七言)。<\/p>\n<p>[譯者註]:<em><strong>多數英文版天主教聖經<\/strong><\/em> 指出：大司祭命令耶穌，在天主前起誓並告訴公議會祂是否天主之子；但_<strong>思高的中文版聖經<\/strong>_ 卻指出大司祭因天主而起誓，命令耶穌告訴公議會祂是否天主之子。這裡採用了英文版之內容。<\/p>"}], "notes": []}, {"id": "2-14", "num": "14", "kind": "默想要點", "title": "復活", "veni": false, "sections": [{"name": "默想", "html": "<p><strong>默觀<\/strong> <strong>――<\/strong> <strong>復活<\/strong><\/p>\n<p>我們以默觀基督的復活來開始第四週 (第218 號)。<\/p>\n<p>聖依納爵建議我們默觀我們的主基督顯現給聖母這事件。<\/p>\n<p>聖經雖然沒有提及這次顯現，但教會傳統一向認為這是真確的。聖女大德蘭指出，耶穌有一次顯現給她，並告訴她，祂在復活後顯現給祂的母親，因為瑪利亞非常渴望看見祂，而自己亦想安慰她。<\/p>\n<p>為相關地點而定像：這裡可觀看耶穌的聖墓，及聖母的住處。<\/p>\n<p>從福音中可選取的一些其他題材。<\/p>\n<p>耶穌顯現給瑪利亞瑪達肋納：谷16:9-11；瑪28:8-10；若20:11-18。<\/p>\n<p>耶穌顯現給伯多祿：若20:1-10；路24:34。<\/p>\n<p>顯現給厄瑪烏的門徒：路24:13-35。<\/p>\n<p>顯現給門徒，而多默不在：若20:19-25。<\/p>\n<p>顯現給門徒，而多默也在場：若20:26-29。<\/p>\n<p>在提庇黎雅海邊顯現給門徒：若21:1-14；與伯多祿的對話：若21:15-19。<\/p>\n<p>求恩：「求天主賞賜聖寵，使我對吾主基督莫大的福樂和光榮，感到歡欣雀躍。」<\/p>\n<h3>需要思考的兩個附加元素：<\/h3>\n<p>– 「思量耶穌在受難時，祂的天主性似乎隱藏了起來；現在，在祂這至聖的復活中，藉著種種真實而神聖的效果，祂的天主性又再重現，並神妙地彰顯出來。」(223 號)<\/p>\n<p>– 「思量吾主耶穌怎樣履行了 安慰者的任務，並以朋友之間互相安慰的慣常做法作比較。」 (224 號)<\/p>\n<p>這點十分重要。在若望福音裡，耶穌在最後晚餐中承諾，天父會賜給我們聖神作為「另一位護慰者」(「另一位安慰者」- 若14:16)，這意味著耶穌自己也是一位安慰者。<\/p>\n<p>在差不多所有描述復活的基督現身並公開顯現的章節中，都很清晰地表達了耶穌力求安慰別人。舉個例子，在祂與厄瑪烏的門徒相遇時，我們見到耶穌親自走近才遇上二人，在路上與他們談話及講解聖經、擘餅。儘管早前門徒已完全失去了信德和望德，在與耶穌相遇後，他們的心卻變得火熱起來。<\/p>\n<p>耶穌對祂的門徒說：「看看我的手，我的腳，鬼神是沒有肉軀和骨頭的」(路24:39)。<\/p>\n<p>伯多祿曾三次否認主，耶穌與他的相遇份外動人 (若21:15 ff)。耶穌三次問他：「西滿，你比他們更愛我嗎？」<\/p>\n<p>同樣地，祂怎樣賜給他們聖神和平安 (若20:21-23)。<\/p>\n<p>祂怎樣遇到並顯現給滿懷悲傷的瑪利亞瑪達肋納 (若20:11-18)。她守在安放基督遺體的空墳墓前，耶穌走近她去安慰她。<\/p>\n<p>因此，思考基督在復活中的任務，以及祂如何想法子去安慰每一個人。<\/p>\n<p>聖女大德蘭：<\/p>\n<p>「如果妳們是喜樂的，請看已復活了的妳們的主；只想像祂如何離開墳墓，妳們就會歡欣喜樂。而且，祂是何等的輝煌！又是何等的美麗！何等的莊嚴！何等的凱旋！何等的欣喜！他彷彿是個從戰場凱旋歸來的戰士，贏得了一個宏偉的王國！祂要把這一切，而且連同祂自己，全都給妳們。那麼，對給予妳們這麼多餽贈的這位，妳們只要轉目看祂一次，難道這算過分嗎？」(《全德之路》第26章)<\/p>\n<p>聖多瑪斯 ‧ 阿奎納 (《神學大全》，第三集，第53題，第一節)<\/p>\n<h3>基督復活的五個動機。<\/h3>\n<ol>\n<li><strong>為彰顯天主的正義<\/strong><\/li>\n<\/ol>\n<p>天主舉揚那些謙卑自下的人。<\/p>\n<p>耶穌「使自己空虛，取了奴僕的形體…他貶抑自己，聽命至死…為此，天主極其舉揚他，賜給了他一個名字，超越其他所有的名字，致使上天、地上和地下的一切，一聽到耶穌的名字，無不屈膝叩拜」(斐2:8ff)<\/p>\n<p>「他從高座上推下權勢者，卻舉揚了卑微貧困的人」(路1:52)<\/p>\n<ol>\n<li><strong>為肯定我們的信德<\/strong><\/li>\n<\/ol>\n<p>對基督復活的信仰是我們信德和望德的根基。<\/p>\n<p>「他雖然由於軟弱而被釘在十字架上，卻由於天主的德能仍然活著；我們也是一樣，雖然我們在他內也成了軟弱的，但對於你們，我們卻也要由於天主的德能同他一起活著」(格後13:4)。<\/p>\n<p>我們的靈修生活建基於基督的復活：「如果基督沒有復活，你們的信仰便是假的，你們還是在罪惡中」(格前15:17)。<\/p>\n<p>「邪惡淫亂的世代要求徵兆，但除了約納先知的徵兆外，必不給它其他的徵兆」(瑪12:39)。<\/p>\n<ol>\n<li><strong>為提升我們的望德<\/strong><\/li>\n<\/ol>\n<p>因為我們的頭基督復活時，我們――祂的肢體――也盼望將來要復活。<\/p>\n<p>「我們既然傳報了基督已由死者中復活了，怎麼你們中還有人說：死人復活是沒有的事呢？」(格前15:12)<\/p>\n<p>「如果我們在今生只寄望於基督，我們就是眾人中最可憐的了。但是，基督從死者中實在復活了，做了死者的初果。因為死亡既因一人而來，死者的復活也因一人而來；就如在亞當內，眾人都死了，照樣，在基督內，眾人都要復活」(格前15:19-22)<\/p>\n<ol>\n<li><strong>為調整信徒們生活的秩序<\/strong><\/li>\n<\/ol>\n<p>就如保祿在羅馬書中說的：<\/p>\n<p>「我們藉著洗禮已歸於死亡與他同葬了，為的是基督怎樣藉著父的光榮，從死者中復活了，我們也怎樣在新生活中度生」(羅6:4)<\/p>\n<p>「我們知道：基督既從死者中復活，就不再死；死亡不再統治他了，因為他死，是死於罪惡，僅僅一次；他活，是活於天主。你們也要這樣看自己是死於罪惡，在基督耶穌內活於天主的人」(羅6:9-11)。<\/p>\n<ol>\n<li><strong>為使我們獲得圓滿的救贖<\/strong><\/li>\n<\/ol>\n<p>既然基督藉著死亡，已把我們從各種罪惡中解救出來，因此，基督受難的目的，是要清除阻礙我們度聖善生活的一切障礙 (特別是罪)。同樣地，祂的復活是要使我們獲得為得救所需的一切美好事物。「祂曾為了我們的過犯被交付，又為了使我們成義而復活」(羅4:25)。<\/p>\n<p>這樣，當耶穌救贖我們的工程，特別是藉著祂的復活得以完成時，祂把我們從三重的奴役中解救出來：<\/p>\n<ul>\n<li>從魔鬼中：「人被誰制勝，就是誰的奴隸」(伯後2:19)。但魔鬼在原罪中制勝了我們。<\/li>\n<li>從罪惡的奴役中：「你們曾作過罪惡的奴隸」(羅6:17)<\/li>\n<li>從死亡的奴役中：「死亡啊！你的災害在那裡？陰府啊！你的毁滅在那裡？」(歐13:14, Mors ero mors tua)<\/li>\n<\/ul>\n<p>對禱<\/p>\n<p>回想起的景象： 向聖母瑪利亞祈禱，請她為我們轉求，使我們有份參與復活的光榮。<\/p>\n<p>向耶穌基督祈禱，恭賀祂，分享祂的喜樂。<\/p>"}], "notes": []}, {"id": "2-15", "num": "15", "kind": "默想要點", "title": "獲得愛情的默觀", "veni": false, "sections": [{"name": "默想", "html": "<h3>獲得愛情的默觀<\/h3>\n<p>獲得愛情的默觀是放在《神操》編號230及以後的篇幅。<\/p>\n<p>它是一種默想，也就是說，我們必須觀察，然後反省自己。<\/p>\n<h3>聖依納爵設下兩個前提：<\/h3>\n<p>「<strong>第一個是愛情不在空言，應在行事上表現。<\/strong>」<\/p>\n<p>「孩子們，我們愛，不可只用言語，也不可只用口舌，而要用行動和事實。」（若一 3:18）<\/p>\n<p>「<strong>第二個是愛是互相共享所擁有的<\/strong>，例如，愛人者把他擁有的，或他現存或可以分施的，贈送給所愛的人，與其共享；反之，被愛的人也和愛人者分享他的所有。因此，如果一個人有知識，他與沒有的人分享；對於尊榮或財富，也是這樣。因而，每個人總是給予別人。」<\/p>\n<p>預備經：照常的祈禱。<\/p>\n<p>地點的定像：設想我站在我主天主，以及衆天使和為我代禱的聖人面前。<\/p>\n<p>求恩：在這裏祈求我深切明瞭我已獲得的諸般恩惠，使我能為此充滿感激，並在一切事上愛慕和侍奉尊威的天主。<\/p>\n<ol>\n<li><strong>至今聖依納爵仍沒有為「愛」這個詞下定義<\/strong>。他甚至沒有在神操中提及過，雖然神操本質上充滿了愛所帶來的現實意義。<\/li>\n<\/ol>\n<p>通常當人們談論「愛」，他們傾向於把重點放在言語上，而不是行爲。世界本身充滿了愛的言語，但少有愛的行為。「孩子們，我們愛，不可只用言語，也不可只用口舌，而要用行動和事實。」（若一 3:18)。「如果你們愛我，就要遵守我的命令……接受我的命令而遵守的，便是愛我的人；」（若14：15, 21）<\/p>\n<p>因此，爲使我們能回應天主的愛，我們應該做好的事。<\/p>\n<p>整冊《神操》就是要解釋這一點 ｡ 如果我們看看我們先前做過的操練，我們會發現：聖依納爵已經引導我們做許多愛的行爲。但他卻幾乎沒有用過「愛」這個字。<\/p>\n<ol>\n<li><strong>一旦有「愛」，就會涉及「雙方當事人<\/strong>——愛人者和被愛者<strong>」<\/strong>。「雙方」指兩個人分享「一份同樣的愛」。愛包含個人自身的擴寬或擴展，藉以容納被愛的人，且加上對被愛者完全的自我交付。那些真愛的人要的並非恩惠，而是對方本身。<\/li>\n<\/ol>\n<p>正確地說，「愛」的意思是希望讓另一個「人」好。(而根本並沒有「愛物」這回事 )<\/p>\n<p>– 如果是出於為自己的緣故去愛另一個人，那種愛被稱爲「情慾」。<\/p>\n<p>– 如果是出於為別人的緣故去愛別人，那種愛被稱為「慈善」。<\/p>\n<p>– 如果是相互對應的愛，那可稱為「友誼」。<\/p>\n<p>– 如果愛是神聖、超性的，那稱爲「仁愛」。<\/p>\n<p>愛的正確目標，即愛正確地所傾向的，是兩個人的融合。嚴格來說，愛存在於這種融合中。這包括奉獻個人自身並同時擁有另一個人。喜樂是源於這種透過自我交付及與其他人融合而達致的自我寬擴。<\/p>\n<p>在友誼中，融合是來自雙方｡ 因此，這種自我奉獻是相互的，由此而來的喜樂也同樣是相互的。 「天主是愛，那存留在愛內的，就存留在天主內，天主也存留在他內。」（若一 4:16)。<\/p>\n<p>除了這種基本的自我交付之外，愛還給予附帶的恩惠，這是由於兩個原因：<\/p>\n<p>a）「愛」想要送給被愛者 一切恩惠。<\/p>\n<p>b）「愛」需要透過外在的事物去證明這些 基本恩惠是實在的。<\/p>\n<ol>\n<li><strong>天主的愛的一些特徵<\/strong><\/li>\n<\/ol>\n<p>– 天主的愛具有創造性。在天主內，愛就是創造。因此，祂的愛常見諸行動：天主愛，所以祂創造。<\/p>\n<p>– 天主愛祂創造的一切。不恰當地說，衪只愛世物；祂為了我們的緣故而愛那些世物（祂在世物中愛了我們）。但是天主以友誼的愛，去愛一切靈體――包含我們。由於祂把我們提升到超性的層次，祂也以仁愛來愛我們。這神聖的仁愛其實已融合於天主聖三之間的至聖之愛。因此，天主把自己賜給我們，讓我們分享祂的天主性。<\/p>\n<p>– 天主的愛是主動的。正是因爲天主的愛基本上是具創造性的，祂的作為總是先於其他受造物，「我們愛，因爲他先愛我們。」（若一 4:19)<\/p>\n<ol>\n<li><strong>人類愛的一些特徵<\/strong><\/li>\n<\/ol>\n<p>– 自私自利。這個特徵有時把自身隱藏在愛情的偽裝下。即使看起來似是真愛，其實衹是尋求自我。它想從施予者尋找恩惠，多於找到施予者本身。<\/p>\n<p>– 從美感的角度理解真愛的喜樂。<\/p>\n<p>– 如果我們跟天主的友誼失落了，問題總是出在我們一方。<\/p>\n<p>– 極度貧乏，以致它常不能施予它本想施予的。<\/p>\n<p>聖依納爵在這個默想中談及友誼的愛｡ 他說這是雙方的互相交流，即是説，愛人者給予，並與被愛者分享他擁有和獲得的一切，而被愛者也會以同樣方式對待愛人者。<\/p>\n<h3>標題<\/h3>\n<p>整冊《神操》是一個獻給愛的紀念碑，「以征服他自己，並規範他的生活，令他的所有決定不致受任何過度依戀的影響。」 神操的目標是讓我們擺脱過度的依戀，去尋覓並找到天主的旨意。愛不再只是一種理論，而是真實的。依戀這主題，或稱作「過度而不正常的依附」，瀰漫整冊《神操》的論述 (但是，聖依納爵從來不會用崇高的「愛」字來表示依戀) 。<\/p>\n<p>所以，愛存在於雙方相互交流恩惠，而主要是互相自我交付。<\/p>\n<p>聖伯爾納德(St. Bernard)説：「受造物只有通過愛才可回應天主的愛」，即使我們不可能回報天主賜予我們這麼多的恩惠。<\/p>\n<p>聖奧思定説：「能夠愛天主已是衪給我們的恩賜。」 當耶穌問伯多祿是否愛祂時（「你比他們更愛我嗎？」），祂所要求伯多祿的，是要他回報耶穌先給了他的。」<\/p>\n<p>我們的靈修生活在於學習怎樣愛天主和我們的近人，同時，也要連根拔起我們的一切不當而過度的依戀。對天主和近人的真愛與自戀剛好相反，真愛是忘我的。<\/p>\n<p>聖方濟各沙雷氏（St Francis de Sales）説：「基督徒的成全在於愛天主在萬有之上，從不違抗天主，也沒有什麼可與對天主的愛相比。<\/p>"}], "notes": []}]}], "veni": [["Veni, Sancte Spiritus,", "天主聖神，請降臨，"], ["Reple tuorum corda fidelium:", "充滿你信眾的心："], ["Et tui amoris in eis ignem accende.", "並在我們心中燃起你的愛火。"], ["V. Emitte Spiritum tuum, et creabuntur.", "V. 使我們蒙受再造之恩。"], ["R. Et renovabis faciem terrae.", "R. 並使大地更新。"], ["Oremus. Deus, qui corda fidelium Sancti Spiritus illustratione docuisti: da nobis in eodem Spiritu recta sapere; et de eius semper consolatione gaudere. Per Christum Dominum nostrum. Amen.", "請大家祈禱。天主，請以聖神之光，教導信眾的心，請以同樣的神，賜給我們理解的智慧，並在你的撫慰中，常喜樂。因我們的主基督。阿們。"]]};

};

window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); bip=e; if(current && current.view==='home') render(); });
function installMode(){
  if(!window.SE_PWA) return null;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const standalone=window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(standalone) return null;
  if(Date.now()-(+store.get('hideInstall',0)||0) < 7*DAY) return null;   // dismissed: ask again after a week
  if(bip) return 'prompt';
  return ios ? 'ios' : null;
}
const pad2 = n => String(n).padStart(2,'0');
const lastBackupText = () => { const b=store.get('lastBackup',null); return b ? `上次備份：${fmtDate(b)}` : '還沒有備份過'; };
function needBackup(){
  const n=L.filter(l=>journal[l.id] && (journal[l.id].text||'').trim()).length;
  if(!n) return 0;
  const b=store.get('lastBackup',null);
  if(b && Date.now()-new Date(b).getTime() < 14*DAY) return 0;
  if(!b && n<3) return 0;
  if(Date.now()-(+store.get('backupNag',0)||0) < 7*DAY) return 0;
  return n;
}
async function exportBackup(){
  const d=new Date(), name=`神操筆記備份-${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.json`;
  const data={app:'shencao', v:1, at:d.toISOString(), done, journal, plan};
  const blob=new Blob([JSON.stringify(data,null,1)], {type:'application/json'});
  const ok=()=>{ store.set('lastBackup', new Date().toISOString()); toast('已備份'); render(); };
  // Inside the claude.ai artifact viewer, files go through the platform's downloads capability
  if(window.claude && typeof window.claude.use==='function'){
    let dl=null; try{ dl = await window.claude.use('downloads'); }catch(e){}
    if(dl){ try{ await dl.save({filename:name, data:blob}); ok(); }catch(e){ if(!e || e.code!=='declined') toast('無法在這裡備份，請改用「複製全部」'); } return; }
  }
  try{
    const f=new File([blob], name, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:'神操筆記備份'}); ok(); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500); ok();
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result); if(!d || d.app!=='shencao') throw new Error('not a backup');
    let nj=0, nd=0;
    Object.entries(d.journal||{}).forEach(([id,e])=>{ const cur=journal[id]; if(e && (!cur || (e.at||'')>(cur.at||''))){ journal[id]=e; nj++; } });
    Object.entries(d.done||{}).forEach(([id,at])=>{ if(!done[id]){ done[id]=at; nd++; } });
    if(d.plan && !plan){ plan=d.plan; store.set('plan',plan); }
    store.set('journal',journal); store.set('done',done);
    toast(`已還原 ${nj} 篇筆記、${nd} 篇進度`); render();
  }catch(e){ toast('這不是神操的備份檔'); } };
  r.readAsText(file);
}

function doneInPeriod(){
  const P=PACES[plan.pace], k = t => P.unit==='day' ? startOfDay(t) : weekStart(t), now=k(Date.now());
  return planSet().lessons.filter(l=>done[l.id] && k(done[l.id])===now).length;
}
function todayCard(){
  const s=planSet(), P=PACES[plan.pace]||PACES.daily, tot=s.lessons.length, n=doneCount(s.lessons), nx=nextLesson();
  const unit = P.unit==='day' ? '今天' : '本週';
  const since = Math.max(0, Math.round((startOfDay(Date.now())-startOfDay(plan.start))/DAY));
  const period = P.unit==='day' ? `第 ${since+1} 天` : `第 ${Math.floor(since/7)+1} 週`;
  const meter = `<div class="meter"><i style="width:${n/tot*100}%"></i></div>`;
  const chg = `<button class="linkbtn" id="chg">更改操練計劃</button>`;
  if(n===tot) return `<button class="continue" id="cont" data-id="${s.lessons[0].id}">
      <span class="eyebrow">${s.name}・已全部完成</span><strong>願天主受讚美</strong>${meter}
      <small>已完成 ${tot} / ${tot} 篇。可以按這裡重溫，或在「筆記」頁回顧天主給你的光照。</small></button>${chg}`;
  const did=doneInPeriod(), left=Math.max(0, P.per-did);
  const after=Math.max(0, (tot-n)-left), periods=Math.ceil(after/P.per);
  const fin=new Date(startOfDay(Date.now()) + periods*(P.unit==='day'?1:7)*DAY);
  let eyebrow, small;
  if(left>0){
    eyebrow = `${P.name}・${period}・${unit}的操練`;
    small = `${P.per>1?`${unit}還有 ${left} 篇　`:''}已完成 ${n} / ${tot} 篇　預計${fin.getMonth()+1}月${fin.getDate()}日完成`;
  } else {
    eyebrow = `${P.name}・${period}・${unit}的操練已完成`;
    small = `下一篇可以${P.unit==='day'?'明天':'下週'}再做；如願意，也可以現在開始。已完成 ${n} / ${tot} 篇`;
  }
  let rep = '';
  if(left===0){
    const last = s.lessons.filter(l=>done[l.id]).sort((a,b)=>String(done[b.id]).localeCompare(String(done[a.id])))[0];
    const m = last && journal[last.id] && journal[last.id].mood;

  }
  return `<button class="continue" id="cont" data-id="${nx.id}">
      <span class="eyebrow">${eyebrow}</span><strong>${esc(nx.num)}　${esc(nx.title)}</strong>${meter}<small>${small}</small></button>${rep}${chg}`;
}

  const go_=$('#tGo'); if(!go_) return;
  tState.left=tState.total=30*60; $('#clock').textContent=fmt(tState.left);
  app.querySelectorAll('.dur').forEach(b=>b.onclick=()=>{ if(tState.run) return; app.querySelectorAll('.dur').forEach(x=>x.classList.remove('on')); b.classList.add('on'); tState.left=tState.total=b.dataset.m*60; $('#clock').textContent=fmt(tState.left); });
  go_.onclick=()=>{ if(tState.run){ pauseTimer(); } else { startTimer(); } };
  $('#tReset').onclick=()=>{ stopTimer(); tState.left=tState.total; $('#clock').textContent=fmt(tState.left); };
}
let actx=null;
function bell(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const t0=actx.currentTime;
  [0,1.6,3.2].forEach(off=>{ [1,2.76,5.4].forEach((r,ix)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=392*r; o.type='sine'; g.gain.setValueAtTime(0,t0+off); g.gain.linearRampToValueAtTime(.18/(ix+1),t0+off+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+off+3.5); o.connect(g).connect(actx.destination); o.start(t0+off); o.stop(t0+off+3.6); }); });
  }catch(e){} }
function startTimer(){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); }catch(e){}
  try{ navigator.wakeLock && navigator.wakeLock.request('screen').then(l=>tState.lock=l).catch(()=>{}); }catch(e){}
  const end = Date.now()+tState.left*1000;
  $('#tGo').textContent='暫停';
  tState.run=setInterval(()=>{ tState.left=Math.max(0,Math.round((end-Date.now())/1000)); const c=$('#clock'); if(c) c.textContent=fmt(tState.left);
    if(tState.left<=0){ stopTimer(); bell(); toast('默想時間到了，請作對禱'); } },250);
}
function pauseTimer(){ clearInterval(tState.run); tState.run=null; const b=$('#tGo'); if(b) b.textContent='繼續'; releaseLock(); }
function stopTimer(){ if(tState.run){ clearInterval(tState.run); tState.run=null; } const b=$('#tGo'); if(b) b.textContent='開始'; releaseLock(); }
function releaseLock(){ try{ tState.lock && tState.lock.release(); }catch(e){} tState.lock=null; }

function counselHTML(m){
  const rules = RULES ? `<button class="linkbtn" data-rules>閱讀〈${esc(RULES.title)}〉全文</button>` : '';
  if(m==='c') return `<div class="counsel"><h5>在神慰中</h5>
    <p>感謝天主。聖依納爵勸告：在神慰時，要想想將來神枯時應如何自處，為那時積蓄力量；也要謙下自己，記得這是天主白白的恩賜［神操 323–324］。</p>
    <p>下次可以<strong>重複這篇默想</strong>，回到你最感受到神慰的那一點，在那裡多停留［神操 62、118］。</p>${rules}</div>`;
  if(m==='d') return `<div class="counsel"><h5>在神枯中</h5><ul>
    <li><strong>不要改變決定。</strong>在神枯時，不要改變先前在神慰中所作的決定和定志，要堅持下去［神操 318］。</li>
    <li><strong>更加努力。</strong>不要縮短默想時間，反而要多一點祈禱、默想和省察［神操 13、319］。</li>
    <li><strong>天主仍與你同在。</strong>雖然感覺不到，天主的恩寵仍足夠你抵抗誘惑［神操 320］。</li>
    <li><strong>忍耐。</strong>相信神慰很快會再來［神操 321］。</li></ul>
    <p>神枯可能是因為自己鬆懈，也可能是天主在考驗我們，或要讓我們明白一切都是恩賜［神操 322］。下次可以重複這篇默想［神操 62］。</p>${rules}</div>`;
  return `<div class="counsel"><h5>沒有明顯的感受</h5>
    <p>當人在操練中沒有感到神慰或神枯，聖依納爵提醒要檢查操練是否按時、按方法進行［神操 6］：</p>
    <ul><li>有沒有找一個安靜的地方，在固定的時間開始？</li><li>有沒有認真做預備經、定像和求恩？</li><li>有沒有做足整段默想時間？</li></ul>
    <p>平淡的祈禱也是忠信的祈禱。如果情況持續，可以和神師或神父談談。</p></div>`;
}
function reviewHTML(l, j){
  return `<p>默想完畢後，或坐或散步，用一刻鐘省察默想的情形：如果默想得不好，查找原因，痛悔並定志改善；如果默想得好，感謝我們的主天主，下次照樣去做。［神操 77］</p>
  <div class="review">
    <ol><li>默想進行得怎樣？我有沒有按照預備經、定像、求恩去做？</li><li>哪一句話或哪一點最觸動我？</li><li>我感到神慰還是神枯？天主給了我什麼光照？</li><li>我在對禱中對主說了什麼？下次要改善什麼？</li></ol>
    <label>這次默想，我主要感到：</label>
    <div class="moods">${MOODS.map(m=>`<button class="mood ${j.mood===m.k?'on':''}" data-m="${m.k}" aria-pressed="${j.mood===m.k}">${m.name}</button>`).join('')}</div>
    <div id="counsel">${j.mood?counselHTML(j.mood):''}</div>
    <label for="jt">我的筆記</label>
    <textarea id="jt" placeholder="寫下這次默想的收穫……">${esc(j.text||'')}</textarea>
    <div class="row">
      <button class="btn primary" id="markDone">${done[l.id]?'已完成這篇':'完成這篇默想'}</button>
      <span class="saved" id="saved">${j.at?'已保存 '+fmtDate(j.at):'筆記會自動保存在這部裝置'}</span>
    </div>
  </div>`;
}
function bindCounsel(){ const r=app.querySelector('[data-rules]'); if(r && RULES) r.onclick=()=>go('lesson', RULES.id); }
function bindReview(l){
  const t=$('#jt'); let tm;
  const save = (extra={}) => {
    const e = Object.assign({}, journal[l.id]||{}, {text:t.value, at:new Date().toISOString()}, extra);
    if(!e.mood) delete e.mood;
    journal[l.id]=e; store.set('journal',journal); $('#saved').textContent='已保存';
  };
  t.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>save(),500); };
  app.querySelectorAll('.mood').forEach(b=>b.onclick=()=>{
    const cur=(journal[l.id]||{}).mood, m = cur===b.dataset.m ? null : b.dataset.m;
    save({mood:m});
    app.querySelectorAll('.mood').forEach(x=>{ x.classList.toggle('on', x.dataset.m===m); x.setAttribute('aria-pressed', x.dataset.m===m); });
    $('#counsel').innerHTML = m ? counselHTML(m) : ''; bindCounsel();
  });
  bindCounsel();
  const b=$('#markDone');
  if(done[l.id]) b.classList.remove('primary');
  b.onclick=()=>{
    if(t.value.trim()) save();
    if(done[l.id]){ delete done[l.id]; store.set('done',done); b.textContent='完成這篇默想'; b.classList.add('primary'); toast('已標示為未完成'); return; }
    done[l.id]=new Date().toISOString(); store.set('done',done);
    b.textContent='已完成這篇'; b.classList.remove('primary');
    toast(doneCount(l.set.lessons)===l.set.lessons.length?l.set.name+'已全部完成。願天主受讚美！':'已完成。願天主受讚美！');
  };
}

const WHAT = "<h2>什麼是神操？<\/h2>\n<p>我們深信，將生命中的時間，奉獻給祈禱和退省，是非常有益的，所以我們邀請您，按照聖依納爵的方法做神操；神操不僅是「另一種退省」，而是自成一格，有其特殊方法，超絕出眾的退省；因此得到教會的廣泛推薦。<\/p>\n<p>為把神操理解得更透徹，請看以下三個問題的答案：<\/p>\n<ul class=\"toc-q\">\n<li><button data-jump=\"w1\">1. 神操是誰寫的？<\/button><\/li>\n<li><button data-jump=\"w2\">2. 神操的目的是什麼？<\/button><\/li>\n<li><button data-jump=\"w3\">3. 神操如何影響教會與歷史？<\/button><\/li>\n<\/ul>\n<h3 id=\"w1\">1. 神操的作者……<\/h3>\n<p>是聖依納爵·羅耀拉，耶穌會會祖。<\/p>\n<p>聖依納爵在 19 年（1522-1541 年）期間，創作了《神操》，從那時起便一直是聖化教會成員的最有力方法之一，無論是平信徒還是修道人。教宗碧岳三世在他的聲明中，很清楚地表達這一點：「我們發現，這些神操充滿了虔誠和神聖，對信徒的屬靈利益非常有用且有益……我們真誠地勸告所有人和每一位男女信徒，隨處使用如此虔誠的指導和神操，並接受其指導。」（Pastoralis Officii《有關牧職》31-VII-1548）<\/p>\n<h3 id=\"w2\">2. 神操追求的目的……<\/h3>\n<p>可以用聖依納爵自己為其書所寫的標題和說明來總結：「神操是為戰勝自己，整頓自己的生命，不讓任何私欲偏情影響自己作決定。」［神操 21］<\/p>\n<p>聖依納爵在整本神操書中，只在探求，人如何努力根據天主的計畫整頓自己的生命，亦即人要追求自己的聖德。聖依納爵的神操提供我們實際的方法，幫助我們瞭解如何活出聖德，到達最完美的境界。神操教授純全的聖德，取自我主耶穌基督的教導和榜樣。<\/p>\n<p>為了達到神操所追求的目的，操練者的熱衷委身，與帶領者對於聖依納爵在其小書中所寫的指示之忠誠，一樣重要。保祿六世在這方面說：「在帶領平信徒退省的各種值得稱讚的方法中，以聖依納爵神操為基礎的方法，自1548年教宗保祿三世批准以來，使用得最廣泛。然而，帶領退省者應該持續不斷地加深理解依納爵的方法。」<\/p>\n<blockquote>「以創新作法淡化神操退省是錯誤的，這將降低此靜默式退省的有效性。那些活動，例如團體動力、信仰分享和宗教社會學研討會，在教會中佔有一席之地，但那席地並不在靜默式的退省中；在這裡，靈魂與天主獨處，慷慨地敞開與他相遇，並被奇妙的加強和光照。」<br>（聖保祿六世，致庫欣樞機的信，1969 年 7 月 25 日）<\/blockquote>\n<h3 id=\"w3\">3. 神操在教會和歷史中的影響<\/h3>\n<p>神操一書的傳播，是其他克修書所無法迄及的。單獨出書或附上註釋，出版超過4800次，被翻譯超過19種語言，包括阿茲特克語、丹麥語、馬達加斯加語、泰米爾語、巴斯克語等。而在上世紀（廿世紀）中葉，至少可以計算出四百萬份副本。<\/p>\n<blockquote>「我希望神父、修道人和平信徒繼續忠於這種體驗，並加以發揚：我向所有真誠尋求真理的人發出邀請。神操學校對於現代人的罪惡，始終是一劑良藥，現代人被人類滄桑的旋風拖著，活在自己之外，過度受外物吸引；但願神操成為鍛造新人、鍛造正宗基督徒、鍛造忠誠的使徒。我將這願望委託聖母代禱，她是卓越的默觀者，神操的明智老師。」<br>（教宗聖若望保祿二世，1979 年 12 月 16 日，三鐘經）<\/blockquote>\n<div class=\"trio\">\n<div><b>作者<\/b>聖依納爵·羅耀拉<\/div>\n<div><b>目的<\/b>尋找和發現天主對我生命的旨意：成聖<\/div>\n<div><b>影響<\/b>使我整頓生命，認出並驅除「私慾偏情」<\/div>\n<\/div>\n<p><button class=\"btn primary\" id=\"toHow\">下一步：如何使用本應用程式做神操<\/button><\/p>\n";
const HOW = "<h2>如何使用本應用程式做神操？<\/h2>\n<p>典型神操設想的是30天的操練，但聖依納爵自己也提供了一些改編。<\/p>\n<p>通常，改編的神操是提供三天的簡易版，其中包含聖依納爵提供的基本默想和規則。他明白，並非所有人都能夠將自己的生活，擱置整整一個月，以進行操練；因此，甚至聖依納爵在世時，也為較短的退省提供方便。<\/p>\n<p>最好是在退省和靜默中做神操，但我們也相信，我們這作法甚好：改編神操以適應現代世界，並透過這個應用程式，把神操帶給那些無法以任何其他方式接觸它的人。<\/p>\n<p>但是，<strong>如何透過應用程式進行這些神聖的操練呢？<\/strong>首先要記住，用手機或電腦做神操並不意味著「不真實」，而只是有一個螢幕在我們中間。本應用程式為每一篇提供文字材料，按神操的步驟編排：先呼求聖神，然後是預備經、定像、求恩、默想、對禱，最後是考查默想。<\/p>\n<h3>第一步：選擇方式<\/h3>\n<p>我們當做的第一件事，是根據我們可用的時間，選擇一個方式：<\/p>\n<div class=\"choice\">\n<div><b>退省<\/b>意味著有整整幾天，<strong>完全<\/strong>獻給天主，遠離任何外在干擾（3天、5天、8天……）。<\/div>\n<div><b>日常生活<\/b>在平常生活的忙碌中，投入至少<strong>每天一小時，或一週至少三天一小時<\/strong>，奉獻給天主，同時繼續我們的日常工作。<\/div>\n<\/div>\n<p>選好之後，在首頁按「<strong>設定我的操練計劃<\/strong>」。應用程式會按你選擇的節奏，告訴你今天該做哪一篇。<\/p>\n<h3>第二步：每次操練<\/h3>\n<p>我入靜，在一天中最適合我的時間（日常生活神操）或為我安排的時間表（退省神操），然後在「神操」頁打開相應的一篇，慢慢閱讀。建議按次序進行，應用程式會記住你已完成的篇章。<\/p>\n<p>如果是「<strong>主題講解<\/strong>」（例如〈神操介紹〉），閱讀並反省之後，這次操練便結束。如果是「<strong>默想要點<\/strong>」，在閱讀要點之後，我會進行至少 30 分鐘的<strong>個人默想<\/strong>，按照以下步驟：<\/p>\n<ol class=\"method\">\n<li><h4>預備（一開始簡短地）<\/h4>\n<ul>\n<li>誦念神操<strong>預備經<\/strong>，來到上主面前：「求我們的主天主，賜我恩寵，讓我所有的意向、行動和運作，純粹都是為了事奉與讚美至尊的天主。」［神操 46］<\/li>\n<li><strong>前導：<\/strong>聖依納爵提出一個場景或歷史，供我們默想或靜觀，就是要「<strong>定像<\/strong>」：設想一個地點，有時要「<strong>使用感官<\/strong>」：意即想像一個具體空間，以及那裡所能看見、聽見、聞到等五官所能感受的東西。<\/li>\n<li><strong>求恩：<\/strong>藉此默想或靜觀，向天主祈求我所願望獲得的恩典。<\/li>\n<\/ul><\/li>\n<li><h4>默想本身（30分鐘）<\/h4>每篇「默想」部分的開頭有一個默想計時器。開始後可以放下手機，專心祈禱；時間到時會輕輕鳴鐘。<\/li>\n<li><h4>結論：對禱<\/h4>對禱應是真正的談話，就如朋友與朋友，僕人與主人談心一樣。每篇的「對禱」部分會提示該如何對禱。<\/li>\n<li><h4>考查默想<\/h4>默想完畢後，用一刻鐘省察默想的情形［神操 77］。每篇最後都有「考查默想」的問題和筆記欄，你寫下的筆記會保存在「筆記」頁。記下你感到<strong>神慰<\/strong>還是<strong>神枯<\/strong>，應用程式會按聖依納爵辨別神類的規則，給你一些提醒。<\/li>\n<\/ol>\n<p style=\"font-size:.85em;color:var(--muted)\">筆記和進度只保存在你這部裝置的瀏覽器內，不會上載或與他人分享。請不時在「筆記」頁按「備份到檔案」，以免換手機時遺失。<\/p>\n<p><button class=\"btn primary\" id=\"toStart\">開始操練<\/button><\/p>\n";
